# packages/frontend/local-runtime/moon.yml
$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'library'
tags:
  - 'local-runtime'
  - 'frontend'
  - 'library'

project:
  name: 'frontend-local-runtime'
  description: 'Modality-agnostic local model runtime — ModelAssetStore, LocalEngine, LocalTaskPool.'
  channel: '#frontend'
  owner: 'Frontend Team'

dependsOn:
  - 'constants'
  - 'schemas'
  - 'types'
  - 'logger'

fileGroups:
  tests:
    - 'tests/**/*'

tasks:
  test:
    command: 'bun run test'
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
