# packages/backend/auth/moon.yml
$schema: 'https://moonrepo.dev/schemas/v2/project.json'

language: 'typescript'
layer: 'library'
tags:
  - 'auth'
  - 'firebase'
  - 'backend'
  - 'library'

project:
  name: 'backend-auth'
  description: 'Authentication services and utilities using Firebase Auth.'
  channel: '#backend'
  owner: 'Backend Team'

dependsOn:
  - 'backend-database'
  - 'constants'
  - 'schemas'
  - 'types'


fileGroups:
  sources:
    - 'src/**/*'
  configs:
    - 'package.json'
    - 'tsconfig.json'
  # 🔴 Load-bearing. tests/better_auth.test.ts applies every SQL file in
  # packages/backend/database/drizzle-d1 to an in-memory libsql database, so a
  # migration change alters this suite's result without touching anything
  # under this project. Without this input moon serves a cached pass and a
  # broken migration ships green (it did: 0006 dropped account.issuer and this
  # task kept its pre-change hash).
  migrations:
    - '/packages/backend/database/drizzle-d1/**/*'
  tests:
    - 'tests/**/*'

tasks:
  test:
    command: 'bun run test'
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
      - '@group(migrations)'
