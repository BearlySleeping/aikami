# packages/backend/auth/moon.yml
$schema: 'https://moonrepo.dev/schemas/v2/project.json'

language: 'typescript'
layer: 'library'
tags:
  - 'auth'
  - 'firebase'
  - 'backend'
  - 'library'

project:
  name: 'backend-auth'
  description: 'Authentication services and utilities using Firebase Auth.'
  channel: '#backend'
  owner: 'Backend Team'

dependsOn:
  - 'backend-database'
  - 'constants'
  - 'schemas'
  - 'types'


fileGroups:
  sources:
    - 'src/**/*'
  configs:
    - 'package.json'
    - 'tsconfig.json'
  tests:
    - 'tests/**/*'

tasks:
  test:
    command: 'bun run test'
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(configs)'
