$schema: 'https://moonrepo.dev/schemas/v2/project.json'

language: 'typescript'
layer: 'library'
stack: 'backend'
tags:
  - 'svelte-kit'
  - 'backend'
  - 'library'

project:
  name: 'backend-svelte-kit'
  description: 'Backend utilities and helpers for SvelteKit applications.'
  channel: '#backend'
  owner: 'Backend Team'

dependsOn:
  - 'constants'
  - 'schemas'
  - 'types'
  - 'logger'
  - 'backend-utils'

fileGroups:
  sources:
    - 'src/**/*'
  configs:
    - 'package.json'
    - 'tsconfig.json'

tasks:
  test:
    command: 'bun run test'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
    options:
      mergeArgs: 'replace'
