# packages/backend/discord-bot/moon.yml
$schema: 'https://moonrepo.dev/schemas/v2/project.json'

language: 'typescript'
layer: 'library'
tags:
  - 'discord-bot'
  - 'backend'
  - 'library'

project:
  name: 'backend-discord-bot'
  description: 'Discord Gateway bot logic for #bugs-features-requests (forum auto-reply, moderator-triggered GitHub issue creation, in-thread LLM replies). Started by apps/backend/worker — this package has no opinion on hosting or env sourcing.'
  channel: '#backend'
  owner: 'Backend Team'

dependsOn:
  - 'logger'
  - 'utils'
  - 'backend-project-ai'

fileGroups:
  sources:
    - 'src/**/*'
  configs:
    - 'package.json'
    - 'tsconfig.json'

tasks:

  test:
    command: 'bun test --pass-with-no-tests'
    inputs:
      - '@group(sources)'
