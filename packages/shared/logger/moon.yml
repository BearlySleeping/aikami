# packages/shared/logger/moon.yml
$schema: 'https://moonrepo.dev/schemas/v2/project.json'

language: 'typescript'
layer: 'library'
tags:
  - 'logger'
  - 'shared'
  - 'library'

project:
  name: 'logger'
  description: 'Shared logging utility for structured logging across the monorepo.'
  channel: '#general'
  owner: 'Core Team'

dependsOn:
  - 'constants'
  - 'types'

fileGroups:
  sources:
    - 'src/**/*'
  configs:
    - 'package.json'
    - 'tsconfig.json'
    - 'moon.yml'

tasks:
  test:
    command: 'bun run test'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
    options:
      mergeArgs: 'replace'

