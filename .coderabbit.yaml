# .coderabbit.yaml
# CodeRabbit AI PR review configuration.
# See https://docs.coderabbit.ai/ for full documentation.
#
# CodeRabbit is advisory only — never a required check.
# Only the self-hosted actionlint+zizmor job may block a merge.

language: "en-US"
early_access: false
review:
  show_link: true
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    # Exclude generated / vendored files from review
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.next/**"
    - "!**/coverage/**"
    - "!**/__pycache__/**"
    - "!.context/llms.txt"
    - "!docs/contracts/PROGRESS.md"
    - "!apps/frontend/client/src/lib/assets/lpc/**"
    - "!apps/frontend/client/static/lpc/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.map"
    - "!**/*.lock"
    - "!**/*.lockb"
    - "!**/pnpm-lock.yaml"
  path_instructions:
    - path: "**/*.svelte"
      instructions: "Review Svelte 5 components using runes ($state, $derived, $effect). Ensure logicless Views and proper ViewModel separation."
    - path: "**/*_view_model.svelte.ts"
      instructions: "Review ViewModel files for proper state management with $state runes. No PixiJS or Firestore imports allowed."
    - path: "**/*.ts"
      instructions: "Review TypeScript for strict types, no `any`, no `interface` (use `type`), proper error handling with AppError."
    - path: ".github/workflows/*.yml"
      instructions: "Review GitHub Actions workflows for security best practices: pin actions to SHAs, avoid template injection in run blocks, set explicit permissions."
chat:
  auto_reply: true
