# apps/frontend/landing_page/moon.yml
$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'
tags:
  - 'website'
  - 'astro'
  - 'application'

project:
  name: 'site'
  description: 'Public marketing site built with Astro.'
  channel: '#frontend'
  owner: 'Frontend Team'

dependsOn:
  - 'constants'
  - 'schemas'
  - 'types'
  - 'frontend-theme'

fileGroups:
  sources:
    - 'src/**/*'
    - 'public/**/*'
    - 'scripts/**/*'
  configs:
    - 'package.json'
    - 'tsconfig.json'
    - 'tailwind.config.*'
    - 'astro.config.*'
  tests:
    - 'tests/**/*'
  deployment:
    - 'scripts/deploy.ts'
    - 'wrangler.jsonc'

tasks:
  dev:
    command: 'bun run dev'
    preset: 'server'
  start:
    command: 'bun run start'
    preset: 'server'
  build:
    command: 'bun run build'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      # 🔴 Load-bearing — see the same block in client/moon.yml. Astro bundles
      # these workspace packages FROM SOURCE via TS aliases. This task is
      # cached (moon's default), so without these globs the cache key lies:
      # a change to frontend-theme or constants would NOT invalidate a built
      # site. Unlike client/hub this was never caught, because a stale
      # marketing page fails quietly.
      - '/packages/shared/*/src/**/*'
      - '/packages/frontend/*/src/**/*'
    outputs:
      - 'dist'
  preview:
    command: 'bun run preview'
    preset: 'server'
  preview-chromium:
    command: bun
    args:
      - run
      - preview:chromium
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'scripts/*'
    options:
      cache: false
      runInCI: false
      persistent: true
  deploy:
    command: bun
    args:
      - run
      - deploy
    inputs:
      - '@group(deployment)'
    options:
      cache: false
      runInCI: false
  test:
    command: 'bun run test'
    inputs:
      - '@group(sources)'
    options:
      cache: false
      runInCI: true
  unlighthouse:
    command: bun run unlighthouse
    options:
      cache: false
      runInCI: false
  astro:
    command: 'bun run astro'
