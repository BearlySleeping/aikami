# apps/frontend/docs/moon.yml
$schema: 'https://moonrepo.dev/schemas/v2/project.json'

language: 'typescript'
layer: 'application'
tags:
  - 'documentation'
  - 'astro'
  - 'application'

project:
  name: 'docs'
  description: 'Project documentation website built with Astro.'
  channel: '#frontend'
  owner: 'Frontend Team'

dependsOn:
  - 'constants'
  - 'schemas'
  - 'types'
  - 'utils'
  - 'frontend-theme'

fileGroups:
  sources:
    - 'src/**/*'
    - 'public/**/*'
  configs:
    - 'package.json'
    - 'tsconfig.json'
    - 'tailwind.config.*'
    - 'astro.config.*'
  tests:
    - 'tests/**/*'

tasks:
  dev:
    command: 'bun run dev'
    preset: 'server'
  start:
    command: 'bun run start'
    preset: 'server'
  build:
    # `bun run build` in package.json wraps back to `moon run docs:build` so
    # direct calls still hit this task's cache/hashing. Real command is the
    # `build:app` script.
    command: 'bun run build:app'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      # 🔴 Load-bearing — see the same block in client/moon.yml. Starlight
      # bundles these workspace packages FROM SOURCE via TS aliases, and this
      # task is cached (moon's default), so without these globs the cache key
      # lies: a change to a shared package would NOT invalidate built docs.
      - '/packages/shared/*/src/**/*'
      - '/packages/frontend/*/src/**/*'
    outputs:
      - 'dist'
  preview:
    command: 'bun run preview'
    preset: 'server'
  astro:
    command: 'bun run astro'
  deploy:
    command: 'bun run scripts/deploy.ts'
    inputs:
      - 'scripts/deploy.ts'
      - 'wrangler.jsonc'
      - '@group(sources)'
    options:
      cache: false
      runInCI: false
