$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'
stack: 'frontend'
tags:
  - 'hub'
  - 'svelte'
  - 'application'

project:
  name: 'hub'
  description: 'Hub dashboard built with SvelteKit.'
  channel: '#frontend'
  owner: 'Frontend Team'

dependsOn:
  - 'frontend-utils'
  - 'frontend-services'
  - 'frontend-configs'
  - 'frontend-storage'
  - 'frontend-theme'
  - 'frontend-engine'
  - 'frontend-preview'
  - 'lpc'
  - 'schemas'
  - 'types'
  - 'constants'
  - 'logger'
  - 'utils'
  - 'backend-auth'
  - 'backend-configs'
  - 'backend-database'
  - 'backend-project-ai'
  - 'backend-utils'

fileGroups:
  sources:
    - 'src/**/*'
    - 'static/**/*'
  configs:
    - 'svelte.config.*'
    - 'vite.config.*'
    - '.env.*'
    - '.env'
  deployment:
    - 'scripts/deploy.ts'
    - 'wrangler.jsonc'

tasks:
  # ------------------------------------------------------------------
  # SvelteKit codegen ($types, ambient app modules). `typecheck`, `test`,
  # `test-unit`, and `build` all need `.svelte-kit` populated and all run
  # in parallel in CI — each used to call `svelte-kit sync` inline, which
  # raced 3-4 concurrent writers on the same directory (intermittent
  # "Cannot find module './$types'" / implicit-any failures). Now a single
  # shared, cached task produces it and the others depend on it instead of
  # regenerating it themselves.
  # ------------------------------------------------------------------
  sync:
    command: 'bun run sync'
    inputs:
      - '@group(configs)'
      - 'src/routes/**/*'
      - 'src/app.d.ts'
      - 'src/hooks.server.ts'
    outputs:
      - '.svelte-kit'
    options:
      cache: true

  dev:
    command: 'bun run dev'
    preset: 'server'

  dev-worker:
    command: 'bun run dev:worker'
    preset: 'server'
    options:
      cache: false

  db-migrate-local:
    command: 'bun run db:migrate:local'
    options:
      cache: false

  db-seed-local:
    command: 'bun run db:seed:local'
    options:
      cache: false
      # Needs a live hub-worker dev server on :5278 to post seed data to —
      # nothing in CI ever starts one, so this task can only fail there.
      # Local-only, same as `deploy` below.
      runInCI: false

  build:
    command: 'bun run build'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(deployment)'
      - '.env'
      # 🔴 Load-bearing. The SvelteKit build bundles these workspace packages
      # FROM SOURCE via TS aliases, so their files are real build inputs.
      # They were previously absent from the hash — that is why a stale cache
      # shipped /api/logs to prod after logger_browser.ts changed, and why
      # `cache: false` was the correct response at the time.
      #
      # Listing them fixes the cause rather than the symptom. The hub also
      # pulls backend packages (auth, database, project-ai), unlike the client.
      # Do NOT narrow these globs to the current `dependsOn` set — a new import
      # would then be silently uncovered, which is the original bug.
      - '/packages/shared/*/src/**/*'
      - '/packages/frontend/*/src/**/*'
      - '/packages/backend/*/src/**/*'
    deps:
      - '~:sync'
    options:
      cache: true
    outputs:
      - '.svelte-kit'
      - 'build'

  typecheck:
    deps:
      - '~:sync'

  preview:
    command: 'bun run preview'
    preset: 'server'

  deploy:
    command: bun
    args:
      - run
      - deploy
    inputs:
      - '@group(deployment)'
    options:
      cache: false
      runInCI: false

  test:
    command: 'bun run test'
    deps:
      - '~:sync'
    inputs:
      - '@group(sources)'
      # 🔴 Load-bearing, same reason as `build` above. The Worker boundary
      # guard (src/lib/server/tests/worker_boundary.test.ts) walks the server
      # import graph across workspace packages, so a `node:fs` landing in
      # packages/backend/* must invalidate this task. Without these inputs
      # Moon serves a cached pass and the guard silently stops guarding.
      - '/packages/shared/*/src/**/*'
      - '/packages/frontend/*/src/**/*'
      - '/packages/backend/*/src/**/*'
      - 'svelte.config.js'

  test-unit:
    command: 'bun run test:unit'
    deps:
      - '~:sync'
    inputs:
      - '@group(sources)'
      - '/packages/shared/*/src/**/*'
      - '/packages/frontend/*/src/**/*'
      - '/packages/backend/*/src/**/*'
      - 'svelte.config.js'
