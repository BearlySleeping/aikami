$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'
stack: 'frontend'
tags:
  - 'hub'
  - 'svelte'
  - 'application'

project:
  name: 'hub'
  description: 'Hub dashboard built with SvelteKit.'
  channel: '#frontend'
  owner: 'Frontend Team'

dependsOn:
  - 'frontend-utils'
  - 'frontend-services'
  - 'frontend-configs'
  - 'frontend-storage'
  - 'schemas'
  - 'types'
  - 'constants'
  - 'logger'
  - 'utils'
  - 'backend-configs'
  - 'backend-database'
  - 'backend-utils'

fileGroups:
  sources:
    - 'src/**/*'
    - 'static/**/*'
  configs:
    - 'svelte.config.*'
    - 'vite.config.*'
    - '.env.*'
    - '.env'
  deployment:
    - 'Dockerfile'
    - 'firebase.json'
    - 'scripts/deploy.ts'
    - 'start.js'

tasks:
  dev:
    command: 'bun run dev'
    preset: 'server'

  build:
    command: 'bun run build'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(deployment)'
      - '.env'
    options:
      # 🔴 Never cache: the SvelteKit build bundles workspace packages
      # FROM SOURCE via TS aliases, and moon's cache key can't cover those
      # files (no package build tasks, no `..` globs). A stale cache shipped
      # /api/logs to prod after logger_browser.ts changed — a fresh build
      # every time is a few seconds and always correct. Deploys are already
      # gated by their own checksum cache.
      cache: false
    outputs:
      - '.svelte-kit'
      - 'build'

  preview:
    command: 'bun run preview'
    preset: 'server'

  deploy:
    command: bun
    args:
      - run
      - deploy
    inputs:
      - '@group(deployment)'
    options:
      cache: false
      runInCI: true

  test:
    command: 'bun run test'
    inputs:
      - '@group(sources)'

  test-unit:
    command: 'bun run test:unit'
    inputs:
      - '@group(sources)'
