<!-- biome-ignore-all lint/a11y/useValidLang: Paraglide i18n uses dynamic lang="%paraglide.lang%" placeholder resolved at build time -->
<!DOCTYPE html>
<html lang="%paraglide.lang%">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png">
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest">
    <meta name="theme-color" content="#6d28d9">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Anti-FOUC: suppress rendering until the SPA mounts. -->
    <style>
    body {
      visibility: hidden;
    }
    .app-mounted {
      visibility: visible;
    }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script>
    // Register the audio-range service worker for iOS Safari compatibility.
    // Contract: C-150 Audio System — Service Worker Range Interceptor
    // Deferred to avoid forcing layout before stylesheets load (Firefox FOUC warning).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' });
      });
    }
    </script>
  </body>
</html>
