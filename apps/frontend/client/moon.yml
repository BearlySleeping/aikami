# apps/frontend/client/moon.yml
$schema: 'https://moonrepo.dev/schemas/v2/project.json'

language: 'typescript'
layer: 'application'
tags:
  - 'client'
  - 'svelte'
  - 'application'

project:
  name: 'client'
  description: 'Main Progressive Web Application built with SvelteKit.'
  channel: '#frontend'
  owner: 'Frontend Team'

dependsOn:
  - 'parser'
  - 'frontend-utils'
  - 'frontend-services'
  - 'frontend-theme'
  - 'schemas'
  - 'types'
  - 'constants'
  - 'logger'
  - 'mocks'
  - 'utils'
  - 'frontend-local-runtime'
  - 'frontend-preview'

fileGroups:
  sources:
    - 'src/**/*'
    - 'static/**/*'
    - 'messages/**/*'
  configs:
    - 'package.json'
    - 'tsconfig.json'
    - 'tailwind.config.*'
    - 'svelte.config.*'
    - 'vite.config.*'
  srcTauri:
    - 'src-tauri/**/*'
  unitTests:
    - 'src/**/*.test.ts'
  i18n:
    - 'messages/**/*'
    - 'project.inlang/**/*'
    - '!project.inlang/cache/**'

tasks:
  # `src/lib/paraglide` (gitignored) is only ever generated as a side effect
  # of `paraglideVitePlugin`'s vite build hook — so `build`/`dev`/`test` all
  # self-heal via vite, but `typecheck` (svelte-kit sync + a standalone
  # tsc-style checker, no vite involved) does not and fails with "Cannot
  # find module '$lib/paraglide/...'" on any checkout where nothing else
  # has run vite first. Usually masked by moon's task cache reusing an old
  # green result, or by `build` happening to run earlier in the same CI
  # job — exposed by C-468 needing a lockfile change, which busts every
  # project's typecheck cache (root-configs) including this one.
  paraglide:
    command: 'bun run paraglide'
    inputs:
      - '@group(i18n)'
      - 'package.json'
    outputs:
      - 'src/lib/paraglide'
    options:
      cache: true

  dev:
    command: 'bun run dev'
    preset: 'server'
    env:
      # C-418 Feature B: dev server must keep the (dev) sandbox routes even
      # when CI sets NODE_ENV=production (the gate strips them otherwise).
      AIKAMI_INCLUDE_DEV_ROUTES: 'true'
  build:
    # `bun run build` in package.json wraps back to `moon run client:build`
    # so direct calls still hit this task's cache/hashing. The real command
    # lives in the `build:app` script — see that script for `--mode` handling.
    command: 'bun run build:app'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      # Build-step scripts: the runner, the dev-route gate and the post-build
      # chunk-cycle guard all run as part of `bun run build`, so they are
      # build inputs.
      - 'scripts/build_client.ts'
      - 'scripts/gate_dev_routes.ts'
      - 'scripts/check_bundle.ts'
      # 🔴 Load-bearing. Vite bundles these workspace packages FROM SOURCE via
      # TS path aliases — the emitted bundle contains their code, so their
      # files are real build inputs. They were previously absent from the hash,
      # which made the cache key lie: a stale cache once shipped old
      # shared-code to prod, and `cache: false` was the correct response.
      #
      # Listing them here fixes the cause rather than the symptom, so caching
      # is safe again. Do NOT narrow these globs to the packages currently in
      # `dependsOn` — a new import would then be silently uncovered, which is
      # the original bug. Over-inclusion only costs cache hit rate.
      - '/packages/shared/*/src/**/*'
      - '/packages/frontend/*/src/**/*'
    options:
      cache: true
      # C-418 Feature B decision (M5): staging builds intentionally SHIP the
      # (dev) sandbox routes (AC-2 excludes only production). Set
      # AIKAMI_INCLUDE_DEV_ROUTES=false to strip them from a staging build.
    outputs:
      - '.svelte-kit'
      - 'build'
  preview:
    command: 'bun run preview'
    preset: 'server'
  # Overrides the inherited .moon/tasks/all.yml typecheck task (same
  # command/inputs) only to add the `paraglide` dependency explained above.
  typecheck:
    command: 'bun'
    args: ['run', 'typecheck']
    deps:
      - '~:paraglide'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(root-configs)'
    options:
      mergeArgs: 'replace'
      cache: true
      runInCI: true
  test:
    command: 'bun run test:unit'
    inputs:
      - '@group(unitTests)'
      - '@group(sources)'
      - '@group(configs)'
    options:
      cache: true
      timeout: 120
      runInCI: false
    env:
      AIKAMI_INCLUDE_DEV_ROUTES: 'true'
  test-unit:
    command: 'bun run test:unit'
    inputs:
      - '@group(unitTests)'
      - '@group(sources)'
      - '@group(configs)'
    options:
      cache: true
      timeout: 120
      runInCI: false
    env:
      AIKAMI_INCLUDE_DEV_ROUTES: 'true'
  tauri-dev:
    command: 'bun run tauri:dev'
    preset: 'server'
  tauri-build:
    command: 'bun run build:tauri'
    options:
      cache: false
      # Excluded from default CI graph: compiles Rust + full desktop bundle,
      # very expensive on GitHub Actions free credits. Runs in release.yml
      # (the deploy pipeline) when a desktop release is published.
      runInCI: false
    inputs:
      - '@group(sources)'
      - '@group(srcTauri)'
      - '@group(configs)'
  tauri-run:
    command: 'bun run tauri:run'
    preset: 'server'
    options:
      cache: false
  deploy:
    command: 'bun run scripts/deploy.ts'
    inputs:
      - 'scripts/deploy.ts'
      - 'wrangler.jsonc'
      - '@group(sources)'
    options:
      cache: false
      runInCI: false
