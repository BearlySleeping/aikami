# apps/frontend/client/moon.yml
$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'
tags:
  - 'client'
  - 'svelte'
  - 'application'

project:
  name: 'client'
  description: 'Main Progressive Web Application built with SvelteKit.'
  channel: '#frontend'
  owner: 'Frontend Team'

dependsOn:
  - 'parser'
  - 'frontend-utils'
  - 'frontend-services'
  - 'frontend-theme'
  - 'schemas'
  - 'types'
  - 'constants'
  - 'logger'
  - 'mocks'
  - 'utils'
  - 'frontend-local-runtime'
  - 'frontend-preview'

fileGroups:
  sources:
    - 'src/**/*'
    - 'static/**/*'
    - 'messages/**/*'
  configs:
    - 'package.json'
    - 'tsconfig.json'
    - 'tailwind.config.*'
    - 'svelte.config.*'
    - 'vite.config.*'
  srcTauri:
    - 'src-tauri/**/*'
  unitTests:
    - 'src/**/*.test.ts'

tasks:
  dev:
    command: 'bun run dev'
    preset: 'server'
    env:
      # C-418 Feature B: dev server must keep the (dev) sandbox routes even
      # when CI sets NODE_ENV=production (the gate strips them otherwise).
      AIKAMI_INCLUDE_DEV_ROUTES: 'true'
  build:
    command: 'bun run build'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      # Build-step scripts: the runner, the dev-route gate and the post-build
      # chunk-cycle guard all run as part of `bun run build`, so they are
      # build inputs.
      - 'scripts/build_client.ts'
      - 'scripts/gate_dev_routes.ts'
      - 'scripts/check_bundle.ts'
      # 🔴 Load-bearing. Vite bundles these workspace packages FROM SOURCE via
      # TS path aliases — the emitted bundle contains their code, so their
      # files are real build inputs. They were previously absent from the hash,
      # which made the cache key lie: a stale cache once shipped old
      # shared-code to prod, and `cache: false` was the correct response.
      #
      # Listing them here fixes the cause rather than the symptom, so caching
      # is safe again. Do NOT narrow these globs to the packages currently in
      # `dependsOn` — a new import would then be silently uncovered, which is
      # the original bug. Over-inclusion only costs cache hit rate.
      - '/packages/shared/*/src/**/*'
      - '/packages/frontend/*/src/**/*'
    options:
      cache: true
      # C-418 Feature B decision (M5): staging builds intentionally SHIP the
      # (dev) sandbox routes (AC-2 excludes only production). Set
      # AIKAMI_INCLUDE_DEV_ROUTES=false to strip them from a staging build.
    outputs:
      - '.svelte-kit'
      - 'build'
  preview:
    command: 'bun run preview'
    preset: 'server'
  test:
    command: 'bun run test:unit'
    inputs:
      - '@group(unitTests)'
      - '@group(sources)'
      - '@group(configs)'
    options:
      cache: true
      timeout: 120
    env:
      AIKAMI_INCLUDE_DEV_ROUTES: 'true'
  test-unit:
    command: 'bun run test:unit'
    inputs:
      - '@group(unitTests)'
      - '@group(sources)'
      - '@group(configs)'
    options:
      cache: true
      timeout: 120
    env:
      AIKAMI_INCLUDE_DEV_ROUTES: 'true'
  tauri-dev:
    command: 'bun run tauri:dev'
    preset: 'server'
  tauri-build:
    command: 'bun run build:tauri'
    options:
      cache: false
      # Excluded from default CI graph: compiles Rust + full desktop bundle,
      # very expensive on GitHub Actions free credits. Runs in release.yml
      # (the deploy pipeline) when a desktop release is published.
      runInCI: false
    inputs:
      - '@group(sources)'
      - '@group(srcTauri)'
      - '@group(configs)'
  tauri-run:
    command: 'bun run tauri:run'
    preset: 'server'
    options:
      cache: false
  deploy:
    command: 'bun run scripts/deploy.ts'
    inputs:
      - 'scripts/deploy.ts'
      - 'wrangler.jsonc'
      - '@group(sources)'
    options:
      cache: false
      runInCI: false
