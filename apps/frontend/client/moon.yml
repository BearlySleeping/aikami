# apps/frontend/client/moon.yml
$schema: 'https://moonrepo.dev/schemas/v2/project.json'

language: 'typescript'
layer: 'application'
tags:
  - 'client'
  - 'svelte'
  - 'application'

project:
  name: 'client'
  description: 'Main Progressive Web Application built with SvelteKit.'
  channel: '#frontend'
  owner: 'Frontend Team'

dependsOn:
  - 'parser'
  - 'frontend-ai-gateway'
  - 'frontend-configs'
  - 'frontend-storage'
  - 'frontend-utils'
  - 'frontend-services'
  - 'frontend-theme'
  - 'schemas'
  - 'types'
  - 'constants'
  - 'logger'
  - 'mocks'
  - 'utils'
  - 'frontend-local-runtime'
  - 'frontend-preview'

fileGroups:
  sources:
    - 'src/**/*'
    - 'static/**/*'
  configs:
    - 'package.json'
    - 'tsconfig.json'
    - 'vite.config.ts'
    - 'tsconfig.service-worker.json'
  srcTauri:
    - 'src-tauri/**/*'
  unitTests:
    - 'src/**/*.test.ts'
    - 'tests/**/*.test.ts'

tasks:
  dev:
    command: 'bun run dev'
    preset: 'server'
    env:
      # C-418 Feature B: belt-and-braces, and now redundant with the default in
      # scripts/dev_routes_gate.ts (an unset flag already includes `(dev)` on a
      # Vite `serve` command). Pinned so the sandboxes stay present even if that
      # default is ever reverted.
      AIKAMI_INCLUDE_DEV_ROUTES: 'true'
  build:
    # `bun run build` in package.json wraps back to `moon run client:build`
    # so direct calls still hit this task's cache/hashing. The real command
    # lives in the `build:app` script — see that script for `--mode` handling.
    command: 'bun run build:app'
    deps:
      # 🔴 Load-bearing ordering, not a convenience.
      #
      # `build` and `typecheck` both drive `svelte-kit sync` into the SAME
      # `.svelte-kit/` directory, with DIFFERENT route sets: `typecheck` opts
      # into the `(dev)` sandbox routes (AIKAMI_INCLUDE_DEV_ROUTES=true) while
      # `build` runs the production dev-route gate, which excludes them. Run
      # concurrently — which moon does by default — the build's sync rewrites
      # `.svelte-kit/types` without the `(dev)` routes while svelte-check is
      # reading them, and `typecheck` fails with `Cannot find module './$types'`
      # from `src/routes/(dev)/+layout.svelte`.
      #
      # The race is latent: it only surfaces when the build cache is cold, so
      # it appears and disappears with unrelated edits. Ordering build AFTER
      # typecheck makes build the last writer, which is what its declared
      # `outputs` (`.svelte-kit`, `build`) already assume.
      - '~:typecheck'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      # Build-step scripts: the runner, the dev-route gate and the post-build
      # chunk-cycle guard all run as part of `bun run build`, so they are
      # build inputs. The ORT externalization plugin, the deploy-asset guard,
      # the ineffective-dynamic-import ratchet, the diagnostic collector and
      # the budget report are build steps too; the two baselines are read by
      # the ratchets, so a baseline edit must invalidate the build cache.
      - 'scripts/build_client.ts'
      - 'scripts/gate_dev_routes.ts'
      - 'scripts/dev_routes_gate.ts'
      - 'scripts/check_bundle.ts'
      - 'scripts/check_no_eruda.ts'
      - 'scripts/check_service_worker.ts'
      - 'scripts/service_worker_registration.ts'
      - 'scripts/check_deploy_assets.ts'
      - 'scripts/check_ineffective_dynamic_imports.ts'
      - 'scripts/diagnostic_collector.ts'
      - 'scripts/ort_external_plugin.ts'
      - 'scripts/report_bundle_budget.ts'
      - 'scripts/bundle_budget.baseline.json'
      - 'scripts/ineffective_dynamic_imports.baseline.json'
      # 🔴 Load-bearing. The emitted route graph depends on this flag, so it MUST
      # be part of the cache key. Without it moon serves a cached
      # production-graph build for a dev-route request (and vice versa) purely
      # on the ambient environment: `AIKAMI_INCLUDE_DEV_ROUTES=true bun moon run
      # client:build -- --mode staging` printed `excluding (dev)` and `1 cached`,
      # silently ignoring the opt-in. A `$`-prefixed input is moon's
      # environment-variable input form.
      - '$AIKAMI_INCLUDE_DEV_ROUTES'
      # 🔴 Load-bearing. Vite bundles these workspace packages FROM SOURCE via
      # TS path aliases — the emitted bundle contains their code, so their
      # files are real build inputs. They were previously absent from the hash,
      # which made the cache key lie: a stale cache once shipped old
      # shared-code to prod, and `cache: false` was the correct response.
      #
      # Listing them here fixes the cause rather than the symptom, so caching
      # is safe again. Do NOT narrow these globs to the packages currently in
      # `dependsOn` — a new import would then be silently uncovered, which is
      # the original bug. Over-inclusion only costs cache hit rate.
      - '/packages/shared/*/src/**/*'
      - '/packages/frontend/*/src/**/*'
    options:
      cache: true
      # TEMPORARY: the dev-route gate includes `(dev)` in `staging` builds and in
      # the dev server, and strips it everywhere else — production included. This
      # task passes no mode of its own, so the effective mode comes from
      # `--mode` / AIKAMI_BUILD_MODE (see scripts/dev_routes_gate.ts). The tasks
      # that pin AIKAMI_INCLUDE_DEV_ROUTES=true below (`typecheck`,
      # `test-prepare`, `test`, `test-unit`) stay explicit so they are unaffected
      # by reverting the staging exception.
    outputs:
      - '.svelte-kit'
      - 'build'
  preview:
    command: 'bun run preview'
    preset: 'server'
  # Overrides the inherited .moon/tasks/all.yml typecheck task (same
  # command/inputs).
  typecheck:
    command: 'bun'
    args: ['run', 'typecheck']
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(root-configs)'
    options:
      mergeArgs: 'replace'
      cache: true
      runInCI: true
    env:
      # Typecheck is a development-time check over the full source tree,
      # including the `(dev)` sandbox routes. `svelte-kit sync` resolves this
      # config with `command: 'build'`, which would otherwise point
      # `files.routes` at `.svelte-kit/routes-prod` and make `./$types`
      # unresolvable from `src/routes`. Opt in exactly as `dev`/`test` do.
      AIKAMI_INCLUDE_DEV_ROUTES: 'true'
  # Build and both test entry points share `.svelte-kit`. Complete the build
  # before test preparation so both test runs read the test-generated files
  # after the last build writer has finished.
  test-prepare:
    command: 'bun run test:prepare'
    deps:
      - '~:build'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'scripts/write_test_tsconfig.ts'
    outputs:
      - '.svelte-kit'
    options:
      cache: true
      timeout: 300
      runInCI: true
    env:
      AIKAMI_INCLUDE_DEV_ROUTES: 'true'
  test:
    command: 'bun run test:unit:run'
    deps:
      - '~:test-prepare'
    inputs:
      - '@group(unitTests)'
      - '@group(sources)'
      - '@group(configs)'
      - 'tsconfig.test.json'
      - '/packages/shared/*/src/**/*'
      - '/packages/frontend/*/src/**/*'
      - '/packages/backend/*/src/**/*'
    options:
      cache: true
      # `test` and `test-unit` intentionally run together in CI. The full
      # client suite can exceed five minutes when both Bun processes compete
      # for CPU, so leave explicit headroom above that measured ceiling.
      timeout: 600
      runInCI: true
    env:
      AIKAMI_INCLUDE_DEV_ROUTES: 'true'
  test-unit:
    command: 'bun run test:unit:run'
    deps:
      - '~:test-prepare'
    inputs:
      - '@group(unitTests)'
      - '@group(sources)'
      - '@group(configs)'
      - 'tsconfig.test.json'
      - '/packages/shared/*/src/**/*'
      - '/packages/frontend/*/src/**/*'
      - '/packages/backend/*/src/**/*'
    options:
      cache: true
      timeout: 600
      runInCI: true
    env:
      AIKAMI_INCLUDE_DEV_ROUTES: 'true'
  # Real-Svelte lane (Vitest Browser Mode + Playwright chromium). Runs in CI:
  # the `validate` job installs the matching Chromium before `moon ci`, so this
  # lane is a mandatory PR check, not a local-only pilot. Run locally with
  # `bun run test:browser`.
  #
  # `cache: false` is deliberate. The lane compiles shared base classes and
  # client source, so an input set that omitted them could reuse a passing
  # result after the code under test changed. `client:build` documents the same
  # concern; until the input set below is proven complete, never cache a pass.
  test-browser:
    command: 'bun run test:browser'
    inputs:
      - 'src/browser_tests/**/*'
      - 'tests/**/*.browser.test.ts'
      - 'vitest.config.ts'
      - '@group(sources)'
      - '@group(configs)'
      - '/packages/frontend/*/src/**/*'
      - '/packages/shared/*/src/**/*'
    options:
      cache: false
      timeout: 180
      runInCI: true
  tauri-dev:
    command: 'bun run tauri:dev'
    preset: 'server'
  tauri-build:
    command: 'bun run build:tauri'
    options:
      cache: false
      # Excluded from default CI graph: compiles Rust + full desktop bundle,
      # very expensive on GitHub Actions free credits. Runs in release.yml
      # (the deploy pipeline) when a desktop release is published.
      runInCI: false
    inputs:
      - '@group(sources)'
      - '@group(srcTauri)'
      - '@group(configs)'
  tauri-run:
    command: 'bun run tauri:run'
    preset: 'server'
    options:
      cache: false
  deploy:
    command: 'bun run scripts/deploy.ts'
    inputs:
      - 'scripts/deploy.ts'
      - 'wrangler.jsonc'
      - '@group(sources)'
    options:
      cache: false
      runInCI: false
