[package]
name = "aikami"
version = "0.1.0"
description = "Aikami Desktop Application"
authors = ["Aikami Team"]
edition = "2021"

[lib]
name = "aikami_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
# Windows/Linux deliver a deep link by launching a second process with the
# URL as a CLI arg (see lib.rs) — this plugin catches that relaunch and
# forwards it into the already-running instance instead of opening a second
# window. Registered on every platform (harmless where unused, e.g. macOS)
# to keep lib.rs free of per-OS conditional compilation.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
