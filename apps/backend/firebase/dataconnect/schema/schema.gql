# ---------------------------------------------------------------------------
# Aikami — SQL Connect PostgreSQL Schema (hardened draft)
# ---------------------------------------------------------------------------
# Relational schema behind Firebase SQL Connect (formerly Data Connect).
# Mirrors the Firestore collection shapes as relational tables, but with real
# foreign keys (@ref), enum-typed status fields, unique constraints, and
# server-set timestamps. Arrays and nested objects are stored as JSONB
# (`Any`) columns; each `Any` column carries a doc comment naming the TypeBox
# schema that governs its runtime shape (see packages/shared/schemas/src/lib/
# database/).
#
# Scalars (provided by prelude):
#   Date      — YYYY-MM-DD (Postgres `date`)
#   Timestamp — RFC 3339 (Postgres `timestamptz`)
#   UUID      — RFC 4122 (Postgres `uuid`)
#   Any       — arbitrary JSON (Postgres `jsonb`)
#
# ───────────────────────────────────────────────────────────────────────────
# ID STRATEGY (deliberate, not an oversight)
# ───────────────────────────────────────────────────────────────────────────
# All tables except AudioTrack keep `id: String!` primary keys. This is
# intentional: ids are migration-bridged from existing Firestore document ids
# (User.id holds the Firebase Auth uid; Chat/Message/Npc/Persona/SaveSlot/
# Notification ids are the Firestore doc ids the sync layer writes). Switching
# to server-generated UUIDs would break the Firestore bridge and require an
# app-wide id migration. AudioTrack is the exception: it is a new catalog
# table (C-151) with no Firestore equivalent, so it uses `UUID!` generated via
# `uuidV4()`. Do NOT migrate the String-id tables to UUID without a plan for
# the Firestore bridge (see schema-refactor-decisions.md).
#
# Physical column names are preserved via @col(name:) / @ref(fields:) so the
# DDL stays compatible with anything already deployed.
#
# ───────────────────────────────────────────────────────────────────────────
# AUTHORIZATION (read before editing)
# ───────────────────────────────────────────────────────────────────────────
# In the current SQL Connect dialect (April 2026) the @auth directive is only
# valid on QUERY | MUTATION — it CANNOT be declared on @table types. Every
# table below therefore documents its intended access policy in its doc
# comment (derived from the Firestore security rules in
# apps/backend/firebase/src/rules/firestore.rules). Enforcement happens at
# operation level in connector/queries.gql and connector/mutations.gql:
# every operation must carry an explicit @auth (default is NO_ACCESS).
# Documented policy per table:
#   User         → read: USER (authenticated); write: owner or admin
#   Npc          → read: PUBLIC for visibility==PUBLIC, else owner/admin; write: owner or admin
#   Persona      → read: PUBLIC (per rules); write: owner or admin
#   Chat         → read: owner or PUBLIC visibility; write: owner or admin
#   Message      → read/write follow owning Chat (owner or PUBLIC visibility)
#   Notification → owner only
#   SaveSlot     → owner only
#   AudioTrack   → read: PUBLIC (catalog); write: NO_ACCESS (Admin SDK only)
#   Config       → owner only (per Firestore configs/{uid}) — see ND-3
# See schema-refactor-decisions.md for the recommended @auth expressions per
# table and the flagged open questions.
#
# ───────────────────────────────────────────────────────────────────────────
# OPEN ITEMS (collected for triage — see schema-refactor-decisions.md)
# ───────────────────────────────────────────────────────────────────────────
# ND-1  Notification.type enum values conflict with the TypeBox
#       NotificationTypeSchema ('ctaClicked'/'videoViewed'), which models a
#       different notification shape. Enum currently uses the draft's own
#       values (CHAT_MESSAGE, SYSTEM) — confirm before trusting it.
# ND-2  Chat.npc is an optional @ref (SET NULL on NPC delete), preserving
#       chat history when an NPC is deleted (matches current Firestore
#       behavior). TypeBox ChatSchema requires npcId. Confirm whether
#       NPC deletion should cascade chats instead.
# ND-3  Config table models a generic key→value store, but the Firestore
#       `configs/{uid}` collection (and TypeBox ConfigSchema) model per-user
#       settings. Pick one model.
# ND-4  Persona has no visibility field; Firestore rules allow fully public
#       read. The intended product behavior may be visibility-gated — decide
#       whether to add a visibility column.
# ND-5  AudioTrack.mood is a free-form String; no mood vocabulary is defined
#       anywhere. Candidate enum once a list exists.
# ND-6  Npc.tags, Notification.data, Config.value have no governing TypeBox
#       schema (marked # TODO inline). A human must define them.
#
# After modifying this file, regenerate the SDK with:
#   bun moon run firebase:generate     (NEVER npx firebase-tools directly)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

# Visibility of user-created content. Values mirror the `_visibilityUnion`
# TypeBox union in packages/shared/schemas (database/npc.ts, database/chat.ts).
# Order is significant for the Postgres enum — only append new values.
enum Visibility {
  PRIVATE
  PUBLIC
}

# Message author. Mirrors `_senderUnion` in
# packages/shared/schemas/src/lib/firestore/message.ts.
enum Sender {
  USER
  AI
}

# User role. Mirrors UserRoleSchema in
# packages/shared/schemas/src/lib/auth/auth.ts and the Firebase custom claim
# `userRole` ('member' | 'superAdmin').
#
# The GraphQL enum identifiers (MEMBER, SUPER_ADMIN) are the accepted SDK
# values for the role column. The sync layer must map the camelCase claim
# spellings to them ('member' → MEMBER, 'superAdmin' → SUPER_ADMIN).
# auth.token.userRole must NOT be written to the role column directly —
# reads/comparisons use the claim spelling, writes use the enum spelling.
# The SQL column keeps the schema.gql field name `role` for stability.
enum UserRole {
  MEMBER
  SUPER_ADMIN
}

# In-app notification kind. # ND-1: the draft hinted "chat_message" | "system";
# packages/shared/schemas/src/lib/firestore/notification.ts models a different
# shape (ctaClicked/videoViewed). Reconcile before trusting this enum.
enum NotificationType {
  CHAT_MESSAGE
  SYSTEM
}

# ---------------------------------------------------------------------------
# Users
# ---------------------------------------------------------------------------
# Profile data for an authenticated user. Source of truth for the SQL layer;
# mirrors Firestore `users/{uid}` where the document id is the Firebase Auth
# uid. The Firebase Auth uid is the canonical identity — User.id, the SQL
# primary key, holds that uid (defaulted from auth.uid on insert).
#
# Auth (operation level): read → USER (any authenticated user, per Firestore
# rules `allow read: if isAuthenticated()`); write → owner (id == auth.uid)
# or admin (auth.token.userRole == 'superAdmin').
type User @table(key: "id") {
  """
  Primary key. Holds the Firebase Auth uid — see ID STRATEGY above.
  @default(expr: "auth.uid") is a server-side fallback; Admin SDK writes must
  set id explicitly (auth.uid is null outside a client request).
  """
  id: String! @col(name: "id") @default(expr: "auth.uid")

  # Server-set on insert; updates must pass updatedAt_expr: "request.time".
  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")

  # Auth / profile fields
  displayName: String @col(name: "display_name")
  # Case-insensitive uniqueness: Postgres @unique is case-sensitive, so the
  # sync layer must normalize emails to lowercase before persistence (writes
  # that would insert a differently-cased duplicate are rejected at the
  # database boundary). Multiple NULLs stay legal (absent emails are allowed).
  email: String @col(name: "email") @unique
  photoURL: String @col(name: "photo_url")
  phoneNumber: String @col(name: "phone_number")
  role: UserRole! @col(name: "role") @default(value: MEMBER)

  # Optional profile details
  firstName: String @col(name: "first_name")
  lastName: String @col(name: "last_name")
  countryCode: String @col(name: "country_code")
  localeCode: String @col(name: "locale_code")

  """
  Connected Google accounts. Shape validated by UserSchema in
  packages/shared/schemas/src/lib/firestore/user.ts
  (connectedEmails: Optional(Array(String))).
  """
  connectedEmails: Any @col(name: "connected_emails")

  """
  Sign-in providers used by this account. Shape validated by UserSchema in
  packages/shared/schemas/src/lib/firestore/user.ts; provider vocabulary from
  SignInProviderSchema in packages/shared/schemas/src/lib/auth/auth.ts
  ('email' | 'google' | 'github').
  """
  signInProviders: Any @col(name: "sign_in_providers")

  # Terms acceptance timestamp.
  agreedAt: Timestamp @col(name: "agreed_at")

  # Aggregate counter.
  monthlyUploadedDuration: Int @col(name: "monthly_uploaded_duration")
}

# ---------------------------------------------------------------------------
# NPCs
# ---------------------------------------------------------------------------
# AI character definition (single-NPC chats reference this table). Source of
# truth for character metadata; mirrors Firestore `npcs/{npcId}`. Note the
# Firestore field is `creatorUid` while the SQL column is `uid` (mapped by the
# sync layer).
#
# Auth (operation level): read → PUBLIC where visibility == PUBLIC, else
# owner (uid == auth.uid) or admin; write → owner (uid == auth.uid) or admin
# (mirrors rules: isPublicDocument('visibility') || isDocumentOwner('creatorUid')).
type Npc @table(key: "id") {
  id: String! @col(name: "id")

  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")

  name: String! @col(name: "name")
  description: String @col(name: "description")
  avatarUrl: String @col(name: "avatar_url")
  personality: String @col(name: "personality")
  systemPrompt: String @col(name: "system_prompt")

  # Creator/owner. Optional: preset/system NPCs may have no owner. Column `uid`
  # references User.id (Firebase Auth uid). SET NULL if the user is deleted.
  owner: User @ref(fields: "uid", references: "id")
  uid: String @col(name: "uid")

  # Mirrors the `_visibilityUnion` TypeBox union (default 'private').
  visibility: Visibility! @col(name: "visibility") @default(value: PRIVATE)

  """
  Character sheet (D&D abilities, skills, saving throws, narrative traits).
  Shape validated by NpcSheetSchema in
  packages/shared/schemas/src/lib/firestore/npc.ts (extends
  BaseCharacterSheetSchema in database/character.ts).
  """
  stats: Any @col(name: "stats")

  # TODO: no TypeBox schema yet — needs one before this field is trustworthy.
  # FEATURES.md does not define an NPC tags shape either.
  tags: Any @col(name: "tags")
}

# ---------------------------------------------------------------------------
# Personas
# ---------------------------------------------------------------------------
# User-owned character cards defining the user's identity in conversations
# (FEATURES.md #1). Mirrors Firestore `personas/{personaId}`. Source of truth
# for persona metadata.
#
# Auth (operation level): read → PUBLIC (Firestore rules allow read for
# everyone — personas have no visibility field); write → owner (uid ==
# auth.uid) or admin. # ND-4: confirm whether personas should be
# visibility-gated like NPCs.
type Persona @table(key: "id") {
  id: String! @col(name: "id")

  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")

  name: String! @col(name: "name")
  description: String @col(name: "description")
  avatarUrl: String @col(name: "avatar_url")

  # Owner. Required: FEATURES.md PersonaData makes uid mandatory and Firestore
  # create requires the request uid. Cascade-deletes with the owning user.
  # (TypeBox PersonaSchema marks uid Optional — discrepancy to reconcile.)
  owner: User! @ref(fields: "uid", references: "id")
  uid: String! @col(name: "uid")

  """
  Persona-specific character sheet. Shape validated by PersonaSheetSchema in
  packages/shared/schemas/src/lib/firestore/persona.ts (extends
  BaseCharacterSheetSchema in database/character.ts).
  """
  traits: Any @col(name: "traits")
}

# ---------------------------------------------------------------------------
# Chats
# ---------------------------------------------------------------------------
# One user ↔ one NPC conversation (group chats are a separate future table per
# FEATURES.md #2 — do not reuse this table for them). Source of truth for chat
# metadata; message bodies live in Message. Mirrors Firestore
# `chats/{chatId}` (with the `messages` subcollection).
#
# Auth (operation level): read → owner (uid == auth.uid) OR visibility ==
# PUBLIC OR admin; write → owner (uid == auth.uid) or admin (mirrors rules).
type Chat @table(key: "id") @index(fields: ["uid", "lastMessageAt"]) {
  id: String! @col(name: "id")

  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")

  # Owner. Required: every chat belongs to a user (Firestore create enforces
  # isRequestOwner('uid')). Column `uid` references User.id. Cascade-deletes
  # with the owning user.
  owner: User! @ref(fields: "uid", references: "id")
  uid: String! @col(name: "uid")

  # ND-2: optional @ref → SET NULL if the NPC is deleted, so chat history
  # survives (current Firestore behavior — NPC deletion does not cascade).
  # TypeBox ChatSchema requires npcId; confirm whether NPC deletion should
  # instead cascade chats and their messages. Column `npc_id` references
  # Npc.id.
  npc: Npc @ref(fields: "npcId", references: "id")
  npcId: String @col(name: "npc_id")

  # Denormalised display snapshot of Npc.name / Npc.avatarUrl, kept on purpose:
  # the chat list / chat header read pattern renders without a join to Npc and
  # stays renderable after the NPC row is deleted (see ND-2). Trade-off: can
  # drift from the Npc row — the sync layer must refresh on NPC metadata
  # changes.
  npcName: String @col(name: "npc_name")
  npcAvatarUrl: String @col(name: "npc_avatar_url")

  # Mirrors the `_visibilityUnion` TypeBox union (default 'private').
  visibility: Visibility! @col(name: "visibility") @default(value: PRIVATE)

  # Aggregate counters (maintained by the sync layer / message writes).
  messageCount: Int! @col(name: "message_count") @default(value: 0)
  affection: Int! @col(name: "affection") @default(value: 0)

  # Timestamp of the last message (drives the chat list ordering index above).
  # Defaults to the row creation time so newly created chats always have a
  # sortable value; explicit last-message updates still overwrite it when a
  # chat receives messages.
  lastMessageAt: Timestamp @col(name: "last_message_at") @default(expr: "request.time")

  # Background image URL.
  backgroundImageUrl: String @col(name: "background_image_url")

  """
  Simplified in-chat character sheet snapshot. Shape validated by
  ChatSchema.stats in packages/shared/schemas/src/lib/firestore/chat.ts
  ({ hp?, ac?, level?, class?, abilities? }).
  """
  stats: Any @col(name: "stats")
}

# ---------------------------------------------------------------------------
# Messages
# ---------------------------------------------------------------------------
# A single message in a chat. Source of truth for message content in the SQL
# layer; mirrors Firestore `chats/{chatId}/messages/{messageId}`.
#
# Auth (operation level): read → owning chat is PUBLIC OR user is the chat
# owner (uid == auth.uid) OR admin; write → chat owner or admin. Access is
# derived through Message.chat — there is no per-message owner column.
#
# Removed vs the draft: `chatOwnerUid` and `chatVisibility` are dropped. They
# existed only so Firestore security rules could authorize message access in
# O(1) without a parent-chat get(); Postgres enforces the same policy by
# joining through Message.chat, so the denormalized copies are redundant here.
# If the Firestore rules still need them, they remain a Firestore-layer
# concern (out of scope for this schema).
type Message @table(key: "id") @index(fields: ["chatId", "createdAt"]) {
  id: String! @col(name: "id")

  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")

  # Owning chat. Required — cascade-deletes with the chat (matches Firestore
  # subcollection semantics). Column `chat_id` references Chat.id.
  chat: Chat! @ref(fields: "chatId", references: "id")
  chatId: String! @col(name: "chat_id")

  # Message content.
  text: String! @col(name: "text")
  sender: Sender! @col(name: "sender")

  # Edit tracking (editedBy only present when edited).
  editedAt: Timestamp @col(name: "edited_at")
  editedBy: Sender @col(name: "edited_by")

  # If this message was regenerated, points to the original message id.
  # Deliberately NOT a @ref: it is an informational pointer and the referenced
  # message may be deleted independently (regeneration chains) — a hard FK
  # would cascade or block those deletions. Revisit only if referential
  # integrity of regeneration chains becomes a requirement.
  regeneratedFrom: String @col(name: "regenerated_from")

  """
  Attachments. Shape validated by MessageSchema.attachments in
  packages/shared/schemas/src/lib/firestore/message.ts
  (Array of { type: 'image' | 'file', url, name?, mimeType?, size? }).
  """
  attachments: Any @col(name: "attachments")

  """
  Arbitrary per-message metadata. Shape validated by MessageSchema.metadata
  in packages/shared/schemas/src/lib/firestore/message.ts
  (Record<string, Unknown>).
  """
  metadata: Any @col(name: "metadata")
}

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
# In-app notification for a user. Mirrors Firestore
# `users/{uid}/notifications/{notificationId}`.
#
# Auth (operation level): owner only (recipient uid == auth.uid), read and
# write (mirrors rules: allow read, write: if isOwner(uid)).
type Notification @table(key: "id") {
  id: String! @col(name: "id")

  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")

  # Recipient. Required — cascade-deletes with the owning user. Column `uid`
  # references User.id.
  user: User! @ref(fields: "uid", references: "id")
  uid: String! @col(name: "uid") @index

  # ND-1: enum values are the draft's own hint ("chat_message" | "system");
  # reconcile with the TypeBox NotificationTypeSchema before trusting.
  type: NotificationType! @col(name: "type")

  title: String @col(name: "title")
  body: String @col(name: "body")

  # Whether the notification has been read.
  isRead: Boolean @col(name: "is_read")

  # Optional link / deep-link target.
  link: String @col(name: "link")

  # TODO: no TypeBox schema yet — needs one before this field is trustworthy.
  # NotificationSchema in packages/shared/schemas/src/lib/firestore/
  # notification.ts models a different payload (ctaClicked/videoViewed
  # marketing events), not this in-app notification payload.
  data: Any @col(name: "data")
}

# ---------------------------------------------------------------------------
# Save Slots — game save metadata (SQL Connect relational layer)
# ---------------------------------------------------------------------------
# Queryable metadata for each save slot. Source of truth for save metadata;
# the dense ECS snapshot blob lives in Firebase Cloud Storage at
# `saves/{uid}/slot_{slotNumber}.json` (storageRef), NOT in this table.
# No Firestore collection equivalent. Sync layer constructs id as
# "{uid}_{slotNumber}".
#
# Auth (operation level): owner only (uid == auth.uid) — read and write.
type SaveSlot @table(key: "id") @unique(fields: ["uid", "slotNumber"]) {
  id: String! @col(name: "id")

  # Owner. Required — cascade-deletes with the owning user. Column `uid`
  # references User.id.
  user: User! @ref(fields: "uid", references: "id")
  uid: String! @col(name: "uid")

  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")

  # Slot number (1-based; values >= 1 only). Composite @unique(uid, slotNumber)
  # above enforces one slot per number per user. Connector-layer validation and
  # the TypeBox schema must enforce the same lower bound (min: 1).
  slotNumber: Int! @col(name: "slot_number")

  # Human-readable location name for the save thumbnail.
  lastLocationName: String @col(name: "last_location_name")

  # Accumulated play time in seconds.
  playedTimeSeconds: Int @col(name: "played_time_seconds")

  # Firebase Cloud Storage path to the ECS snapshot blob.
  storageRef: String! @col(name: "storage_ref")
}

# ---------------------------------------------------------------------------
# Audio Tracks — mood-driven BGM catalog for AI Director (C-151)
# ---------------------------------------------------------------------------
# Read-only catalog of background-music tracks, consumed by the AI Director's
# music control (query GetTracksByMood). Source of truth; no Firestore
# equivalent. This is the only table with a server-generated UUID id — see ID
# STRATEGY in the file header.
#
# Auth (operation level): read → PUBLIC (catalog); write → NO_ACCESS (Admin
# SDK / seed tooling only).
type AudioTrack @table(key: "id") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")

  title: String! @col(name: "title")

  # ND-5: free-form String — no mood vocabulary is defined anywhere
  # (packages/shared/schemas/src/lib/media/music.ts uses String minLength 1).
  # Candidate enum once a mood list exists. Indexed for GetTracksByMood.
  mood: String! @col(name: "mood") @index

  storageUrl: String! @col(name: "storage_url")
}

# ---------------------------------------------------------------------------
# Configs (key-value app configuration)
# ---------------------------------------------------------------------------
# ND-3: the draft models a generic key→value store, but Firestore
# `configs/{uid}` (and TypeBox ConfigSchema) model per-user settings
# (theme/locale/notificationsEnabled/...). Decide which model this table
# should be before building on it.
#
# Auth (operation level): pending ND-3 — Firestore's configs/{uid} is
# owner-only, but this table has no uid column and no per-operation @auth can
# express an owner check yet, so enforcement is not available until the
# ownership model is resolved (see ND-3).
type Config @table(key: "id") {
  id: String! @col(name: "id")

  createdAt: Timestamp! @col(name: "created_at") @default(expr: "request.time")
  updatedAt: Timestamp! @col(name: "updated_at") @default(expr: "request.time")

  # Configuration key. Unique — two rows sharing a key would be a bug.
  key: String! @col(name: "key") @unique

  # TODO: no TypeBox schema governs this generic key→value shape. ConfigSchema
  # in packages/shared/schemas/src/lib/firestore/config.ts models a fixed
  # per-user settings object and does NOT match an arbitrary value.
  value: Any @col(name: "value")
}
