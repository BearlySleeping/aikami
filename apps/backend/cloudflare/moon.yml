$schema: 'https://moonrepo.dev/schemas/v2/project.json'

language: 'typescript'
layer: 'application'
tags:
  - 'cloudflare'
  - 'ops'

project:
  name: 'cloudflare'
  description: 'Single home for Cloudflare operations — D1, R2, DNS, and Worker management.'
  channel: '#general'
  owner: 'Core Team'

fileGroups:
  sources:
    - 'src/**/*.ts'
  configs:
    - 'package.json'
    - 'tsconfig.json'
    - 'moon.yml'
  entry:
    - 'src/cli.ts'

tasks:
  deploy:
    command: 'bun run src/cli.ts'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
    options:
      cache: false
      runInCI: true

  typecheck:
    command: 'bun run typecheck'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
    options:
      mergeArgs: 'replace'

  lint:
    command: 'bun run lint'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
    options:
      mergeArgs: 'replace'

  fix:
    command: 'bun run fix'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
    options:
      mergeArgs: 'replace'

  test:
    command: 'bun test'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
    options:
      mergeArgs: 'replace'
      runInCI: false
