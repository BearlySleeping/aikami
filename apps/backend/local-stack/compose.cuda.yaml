# apps/backend/local-stack/compose.cuda.yaml
#
# NVIDIA CUDA backend. Requires the NVIDIA Container Toolkit on the host —
# without it the `deploy.resources.reservations.devices` block produces a
# confusing error (the smoke test detects and explains it).
#
# .env:
#   COMPOSE_FILE=compose.yaml:compose.cuda.yaml
#   COMPOSE_PROFILES=text,image,voice,stt,client
#
# CUDA 13 hosts (newer drivers) can swap text to `server-cuda13` — see the
# README. The image engine uses the single published CUDA tag for both.

services:
  text:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:dff65f30ddac55cd188d0be3fea646c203b40f4d00b8f909756c79ab99f77b73
    # Podman's external `docker compose` provider silently drops the
    # `deploy.resources.reservations.devices` GPU block below (verified
    # 2026-09-08), so sd/llama containers fell back to the CPU backend even
    # though this is the CUDA override. The explicit CDI `devices` line is
    # what Podman honours; real Docker still uses the `deploy` block. Keep
    # both — each engine ignores the form it does not support.
    devices:
      - nvidia.com/gpu=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  image:
    image: ghcr.io/leejet/stable-diffusion.cpp:master-cuda@sha256:44c9ccc8495c0b75dcaa78c5678f25e973ab7f003edf001f3c21d2396b18dfb9
    # CDI device line: Podman's external compose provider ignores the
    # `deploy` GPU block below (see `text`), so without this sd-server ran
    # on the CPU backend despite the CUDA image. Keep both for Podman/Docker.
    devices:
      - nvidia.com/gpu=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # C-511 audio engine (ACE-Step). The image is CUDA-only, so the audio
  # profile is only usable here. Keep both forms — Podman's external compose
  # provider honours the CDI `devices` line, real Docker the `deploy` block.
  audio:
    devices:
      - nvidia.com/gpu=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
