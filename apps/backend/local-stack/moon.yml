# apps/backend/local-stack/moon.yml
$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'
tags:
  - 'backend'
  - 'container'
  - 'orchestration'
  - 'local-ai'

project:
  name: 'local-stack'
  description: 'Orchestration package for local AI engines (compose profiles, backend overrides, model fetcher, and Native Host Binary modes).'
  channel: '#backend'
  owner: 'Backend Team'

dependsOn:
  - 'constants'
  - 'local-ai'
  - 'schemas'
  - 'types'

fileGroups:
  configs:
    - 'compose*.yaml'
    - '.env.example'
    - 'Dockerfile*'
    - 'docker/**/Dockerfile*'
    - 'package.json'
    - 'moon.yml'
  binaries:
    - 'bin/**/*'
    - 'stack/**/*'

tasks:
  # Docker builds are heavy/host-dependent — keep them out of `moon ci`
  # (same convention as the voice/image projects).
  build:
    command: 'true'
    options:
      runInCI: false

  build-client:
    command: 'bun run build:client'
    options:
      cache: false
      runInCI: false

  test:
    command: 'bun run test'

  lint:
    command: 'bun run lint'
    options:
      runInCI: true

  up:
    command: 'docker compose up -d'
    options:
      cache: false
      runInCI: false

  up-cpu:
    command: 'docker compose -f compose.yaml -f compose.cpu.yaml up -d'
    options:
      cache: false
      runInCI: false

  up-cuda:
    command: 'docker compose -f compose.yaml -f compose.cuda.yaml up -d'
    options:
      cache: false
      runInCI: false

  fetch-models:
    command: 'bun stack/fetch_models.ts'
    options:
      cache: false
      runInCI: false

  run-native-voice:
    command: 'bash bin/run-native-tts.sh'
    options:
      cache: false
      runInCI: false

  init:
    command: 'bun stack/init.ts'
    options:
      cache: false
      runInCI: false
      # CLI-only interactive/flag-driven command; never part of `moon ci`.
      # NB: moon 2.4.6 refuses `moon run` for runInCI:false tasks, so the
      # root `stack` script drives the package.json `init` script directly.

  # C-418 Feature F: one-command installer assets.
  # bundle — compiles `stack-init` to a single-file Bun binary and packs the
  # release tarball consumed by install.sh (AC-6).
  bundle:
    command: 'sh scripts/bundle_stack.sh'
    options:
      cache: false
      runInCI: true

  # bundle-all — the full release matrix (every platform's archive), the way
  # publish-local-stack.yml builds it. Local/CI `bundle` stays host-only so a
  # PR does not compile five 95 MB binaries.
  bundle-all:
    command: 'sh scripts/bundle_stack.sh'
    env:
      AIKAMI_BUNDLE_TARGETS: 'bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64'
    options:
      cache: false
      runInCI: false

  # test-install — self-test for install.sh against a local bundle (AC-6
  # integration hook; no Docker, no network).
  test-install:
    command: 'sh scripts/install.test.sh'
    options:
      cache: false
      runInCI: true

  # test-install-windows — the same contract for install.ps1. Windows-only
  # (it needs PowerShell), so it is a developer/manual task rather than part
  # of the Linux `moon ci` run.
  test-install-windows:
    command: 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.test.ps1'
    options:
      cache: false
      runInCI: false
