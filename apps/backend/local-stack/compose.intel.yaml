# apps/backend/local-stack/compose.intel.yaml
#
# Intel / SYCL backend (Arc GPUs, recent integrated graphics).
#
# .env:
#   COMPOSE_FILE=compose.yaml:compose.intel.yaml
#   COMPOSE_PROFILES=text,image,voice,stt,client

# C-511 note: the `audio` profile (ACE-Step) is CUDA-only — its published
# image is built on nvidia/cuda with cu126 torch. Enabling `audio` here
# produces a readable failure from the service itself rather than a torch
# crash; leave it out of COMPOSE_PROFILES on this backend.

services:
  text:
    image: ghcr.io/ggml-org/llama.cpp:server-intel@sha256:a17f8d51ff8009a79dbdc085a49272e947c0f79ca7dc597ef352836ffe890854

  image:
    image: ghcr.io/leejet/stable-diffusion.cpp:master-sycl@sha256:1e42e5a5ca8fe636b3e0bb8d6b91788963fc15a941ddf25eb31644a083d0fded
