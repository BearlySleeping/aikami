# apps/backend/local-stack/compose.cpu.yaml
#
# CPU backend — explicit override for the default configuration. The base
# compose.yaml already resolves to the CPU images with no device reservation;
# this file exists so COMPOSE_FILE=compose.yaml:compose.cpu.yaml is a valid
# documented preset (check.sh renders it and asserts the same result as the
# base file alone).
#
# .env:
#   COMPOSE_FILE=compose.yaml:compose.cpu.yaml
#   COMPOSE_PROFILES=text,image,voice,stt,client

services:
  text:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:0544c0b60e53cddc27f99724454644d2a73f6e165efc481807c361e4f8a7f6d2

  image:
    image: ${AIKAMI_IMAGE_PREFIX:-ghcr.io/bearlysleeping}/aikami-sd-server:cpu
