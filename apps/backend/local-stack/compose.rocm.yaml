# apps/backend/local-stack/compose.rocm.yaml
#
# AMD ROCm backend. No ROCm sd-server image is published upstream, so the
# image engine inherits the Vulkan image (AC-1b) — ROCm is text-only here.
# ROCm images are linux/amd64 only; there is no ARM ROCm path.
#
# .env:
#   COMPOSE_FILE=compose.yaml:compose.rocm.yaml
#   COMPOSE_PROFILES=text,image,voice,stt,client
#
# Device mapping: ROCm uses the host's /dev/kfd + /dev/dri (AMD GPU), not
# the NVIDIA toolkit's gpu capability.

services:
  text:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm@sha256:da6a4434c1d17ba6870b49bd893e317eb6e3aa744b20b3af181b1ffc00fe5d37
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render

  image:
    image: ghcr.io/leejet/stable-diffusion.cpp:master-vulkan@sha256:0db025430e10f47fc74e3e8080ef97c9e2da7b86427478bb9fa25870f420ab04
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
