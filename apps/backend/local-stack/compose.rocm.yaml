# apps/backend/local-stack/compose.rocm.yaml
#
# AMD ROCm backend. No ROCm sd-server image is published upstream, so the
# image engine inherits the Vulkan image (AC-1b) — ROCm is text-only here.
# ROCm images are linux/amd64 only; there is no ARM ROCm path.
#
# .env:
#   COMPOSE_FILE=compose.yaml:compose.rocm.yaml
#   COMPOSE_PROFILES=text,image,voice,stt,client
#
# Device mapping: ROCm uses the host's /dev/kfd + /dev/dri (AMD GPU), not
# the NVIDIA toolkit's gpu capability.

# C-511 note: the `audio` profile (ACE-Step) is CUDA-only — its published
# image is built on nvidia/cuda with cu126 torch. Enabling `audio` here
# produces a readable failure from the service itself rather than a torch
# crash; leave it out of COMPOSE_PROFILES on this backend.

services:
  text:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm@sha256:d67ddc789b54a48ea30d0d36bf4c5003285bd41638a330e0a5b5d24d31a2bab6
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render

  image:
    image: ghcr.io/leejet/stable-diffusion.cpp:master-vulkan@sha256:99affe082ffa8b203398ace5c4d3c04766cc7ecacf1b696f79bf8d97738e6503
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
