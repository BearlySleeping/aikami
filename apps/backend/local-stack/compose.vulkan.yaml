# apps/backend/local-stack/compose.vulkan.yaml
#
# Vulkan backend — the universal GPU fallback. Published for both engines;
# covers AMD (non-ROCm), Intel Arc, and integrated GPUs in one override.
#
# .env:
#   COMPOSE_FILE=compose.yaml:compose.vulkan.yaml
#   COMPOSE_PROFILES=text,image,voice,stt,client

# C-511 note: the `audio` profile (ACE-Step) is CUDA-only — its published
# image is built on nvidia/cuda with cu126 torch. Enabling `audio` here
# produces a readable failure from the service itself rather than a torch
# crash; leave it out of COMPOSE_PROFILES on this backend.

services:
  text:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:8426950b380cfe192fadea0e0d3ca4f7b340d559a0fb1b88db4c444598f895ba

  image:
    image: ghcr.io/leejet/stable-diffusion.cpp:master-vulkan@sha256:47f312953bb0d5c6a7f1ba7b73ea639cc4e5c38689a42d113ece6126cb220334
