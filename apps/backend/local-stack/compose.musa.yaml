# apps/backend/local-stack/compose.musa.yaml
#
# Moore Threads MUSA backend. Both engines publish MUSA builds; the sd-server
# master-musa tag is a distinct hardware target (like master-cuda-spark), so
# it is only ever selected by this override — never auto-detected.
#
# .env:
#   COMPOSE_FILE=compose.yaml:compose.musa.yaml
#   COMPOSE_PROFILES=text,image,voice,stt,client

# C-511 note: the `audio` profile (ACE-Step) is CUDA-only — its published
# image is built on nvidia/cuda with cu126 torch. Enabling `audio` here
# produces a readable failure from the service itself rather than a torch
# crash; leave it out of COMPOSE_PROFILES on this backend.

services:
  text:
    image: ghcr.io/ggml-org/llama.cpp:server-musa@sha256:b3684c69eea3edc5f35c98b9a285946aee6722a755538f5abfb9e300b408f1bb

  image:
    image: ghcr.io/leejet/stable-diffusion.cpp:master-musa@sha256:662d3cd82d96100a2aa3db9887f33a5c0d558a124fef28797780e15bbe71cc33
