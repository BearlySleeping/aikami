# apps/backend/local-stack/docker/client/nginx.conf
# nginx server block for the static Aikami client SPA.
# Port 5274 is the Aikami-allocated web port (development_ports.ts, C-390
# AC-11) — not Nordclaw's 3000–3009 range.
server {
    listen 5274;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry document
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Never cache the runtime engine config — topology changes must take
    # effect without a hard reload (C-389)
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
