# apps/backend/local-stack/compose.yaml
#
# Aikami local AI stack — publishable compose topology (C-390).
#
# Modality → Compose profile; backend → Compose override file. All variation
# lives in .env, which Compose reads automatically:
#
#   COMPOSE_PROFILES=text,image,voice,stt,client
#   COMPOSE_FILE=compose.yaml:compose.cuda.yaml
#
# The user's runtime command is therefore plain `docker compose up -d` with
# no flags. Override files carry the `deploy` device reservations and the
# backend-specific image tags; this base file carries everything invariant.
#
# Hardware backends (override files): cpu, cuda, rocm, vulkan, intel, musa.
# 'metal' deliberately has no compose override — on macOS the setup emits the
# native plan (bin/run-native-*.sh) and only the client container runs,
# because Docker Desktop provides no Metal passthrough.
#
# Ports (from packages/shared/constants/src/lib/development_ports.ts):
#   text=11434  image=8188  voice=8089  stt=8087  client=5274
# Host 8080 is abandoned — it belongs to Nordclaw's Firestore emulator.

name: aikami-local-stack

x-model-volume: &model-volume
  # Named volume by default; MODELS_PATH selects a bind mount instead (AC-13).
  type: volume
  source: aikami-models
  target: /models
  volume:
    nocopy: true

services:
  # ── One-shot model fetcher (AC-6/AC-7) ────────────────────────────────
  # Populates the shared model volume from models.manifest.json with SHA-256
  # verification and Range-based resume. Exits 0 even when individual
  # downloads fail (non-fatal) so one dead mirror cannot block other engines.
  # Engines wait on its successful exit via
  # depends_on: { condition: service_completed_successfully } — a health
  # check cannot run on an exited container, so this is the correct gate.
  model-fetcher:
    profiles: ["text", "image", "voice", "stt"]
    # Pulls the published image by default (Compose's default pull_policy
    # only pulls when missing, never rebuilds); `docker compose build
    # model-fetcher` builds from docker/fetcher/Dockerfile locally instead —
    # useful when editing fetch_models.ts or models.manifest.json.
    image: ${AIKAMI_IMAGE_PREFIX:-ghcr.io/bearlysleeping}/aikami-model-fetcher:${LOCAL_STACK_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/fetcher/Dockerfile
    command:
      - /bin/sh
      - -c
      - |
        bun /app/stack/fetch_models.ts
    environment:
      COMPOSE_PROFILES: "${COMPOSE_PROFILES:-}"
      MODELS_PATH: /models
      AIKAMI_ACCEPT_LICENSES: "${AIKAMI_ACCEPT_LICENSES:-}"
      TEXT_MODEL: "${TEXT_MODEL:-}"
      IMAGE_MODEL: "${IMAGE_MODEL:-}"
      # C-393: STT entries are tier-selected — only the chosen streaming +
      # batch models (plus the Silero VAD model) are fetched, not every
      # entry of the modality.
      STT_STREAM_MODEL: "${STT_STREAM_MODEL:-}"
      STT_BATCH_MODEL: "${STT_BATCH_MODEL:-}"
      # Named-volume path: hand the populated tree to the engine uid (voice
      # runs as 1000) so non-root engines can write /models. The
      # compose.models-path.yaml override sets this to 0 to keep the user's
      # host bind tree untouched (AC-13).
      MODELS_CHOWN: "${MODELS_CHOWN:-1}"
    volumes:
      - *model-volume
    restart: "no"

  # ── Text engine — llama.cpp server (OpenAI-compatible /v1) ─────────────
  text:
    profiles: ["text"]
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:0544c0b60e53cddc27f99724454644d2a73f6e165efc481807c361e4f8a7f6d2
    ports:
      - "127.0.0.1:${TEXT_PORT:-11434}:11434"
    command:
      - --model
      - /models/text/${TEXT_MODEL:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "11434"
      - --threads
      - "${TEXT_THREADS:--1}"
    volumes:
      - *model-volume
    depends_on:
      model-fetcher:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -fsS http://127.0.0.1:11434/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── Image engine — stable-diffusion.cpp sd-server (AC-4 model list) ────
  # Upstream publishes no CPU sd-server image, so the base file resolves to
  # our built aikami-sd-server:cpu (AC-3); backend overrides swap in the
  # published leejet variants. The sd.cpp images ship `/sd-cli` as their
  # entrypoint, so the command must run `/sd-server` explicitly (verified
  # 2026-08-14).
  #
  # Two invocation shapes, chosen by whether IMAGE_DIFFUSION_MODEL is set
  # (env_writer.ts writes it only when the selected model has companions):
  #   single-file  (e.g. SD1.5, a full checkpoint) — `--model`.
  #   multi-file   (e.g. Anima — diffusion weights ship without a VAE or
  #                text encoder) — `--diffusion-model` + `--vae`/`--llm`/
  #                `--clip_l`/`--clip_g`/`--t5xxl`, whichever are set.
  # A shell entrypoint is needed to branch on that at container start; the
  # sd.cpp images still ship /sd-cli as ENTRYPOINT so /sd-server must be
  # invoked explicitly either way (C-392 verified).
  image:
    profiles: ["image"]
    image: ${AIKAMI_IMAGE_PREFIX:-ghcr.io/bearlysleeping}/aikami-sd-server:cpu
    entrypoint: /bin/sh
    ports:
      - "127.0.0.1:${IMAGE_PORT:-8188}:8188"
    command:
      - -c
      - |
        set -e
        # Every IMAGE_-prefixed token below is resolved by docker compose
        # from .env at config-render time (same mechanism the single-line
        # --model form used before) -- by the time this script runs in the
        # container these are already plain literal text, not a runtime env
        # lookup. Deliberately not copied into lowercase shell variables
        # first: compose interpolation also matches bare dollar-prefixed
        # shell references, which would silently blank them out before the
        # container ever starts. (Keep this comment free of a dollar sign
        # followed by a brace or asterisk -- compose interpolates comments
        # inside this block too and a malformed pattern fails config render.)
        # refresh_lora_cache recursively walks this dir on every job; with
        # no --lora-model-dir sd-server defaults to the container root and
        # dies with EPERM when it reaches /proc/1/map_files (C-392 verified).
        set -- --listen-ip 0.0.0.0 --listen-port 8188 --lora-model-dir /models/image
        if [ -n "${IMAGE_DIFFUSION_MODEL:-}" ]; then
          set -- "$$@" --diffusion-model "/models/image/${IMAGE_DIFFUSION_MODEL:-}"
          [ -n "${IMAGE_VAE_MODEL:-}" ] && set -- "$$@" --vae "/models/image/${IMAGE_VAE_MODEL:-}"
          [ -n "${IMAGE_LLM_MODEL:-}" ] && set -- "$$@" --llm "/models/image/${IMAGE_LLM_MODEL:-}"
          [ -n "${IMAGE_CLIP_L_MODEL:-}" ] && set -- "$$@" --clip_l "/models/image/${IMAGE_CLIP_L_MODEL:-}"
          [ -n "${IMAGE_CLIP_G_MODEL:-}" ] && set -- "$$@" --clip_g "/models/image/${IMAGE_CLIP_G_MODEL:-}"
          [ -n "${IMAGE_T5XXL_MODEL:-}" ] && set -- "$$@" --t5xxl "/models/image/${IMAGE_T5XXL_MODEL:-}"
        else
          set -- "$$@" --model "/models/image/${IMAGE_MODEL:-stable-diffusion-v1-5-pruned-emaonly-q4_0.gguf}"
        fi
        exec /sd-server "$$@"
    volumes:
      - *model-volume
    depends_on:
      model-fetcher:
        condition: service_completed_successfully
    healthcheck:
      # Neither curl nor wget ships in the upstream leejet/stable-diffusion.cpp
      # images (verified 2026-08-17 against master-cuda) — bash does, and its
      # /dev/tcp pseudo-device can do a real HTTP request without either.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8188 && printf 'GET /sdapi/v1/sd-models HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── Voice engine — sherpa-onnx (TTS /v1/audio/speech, optional STT) ───
  # C-393: with the `stt` profile, the same container hosts the streaming
  # websocket + capabilities + health + batch proxy (stt_server.py) on
  # $STT_PORT and the whisper.cpp batch engine on the internal $WHISPER_PORT
  # (never published). STT is opt-in: ENABLE_STT defaults false (AC-7) and
  # the `stt` profile is not part of the shipped COMPOSE_PROFILES.
  voice:
    profiles: ["voice", "stt"]
    # Pulls the published image by default; `docker compose build voice`
    # builds from docker/voice/Dockerfile.sherpa locally instead.
    image: ${AIKAMI_IMAGE_PREFIX:-ghcr.io/bearlysleeping}/aikami-voice:${LOCAL_STACK_VERSION:-latest}
    build:
      context: ./docker/voice
      dockerfile: Dockerfile.sherpa
    ports:
      - "127.0.0.1:${TTS_PORT:-8089}:8089"
    environment:
      TTS_PORT: "8089"
      STT_PORT: "8087"
      WHISPER_PORT: "8091"
      ENABLE_STT: "${ENABLE_STT:-false}"
      # The voice container reads its models from the shared volume (the
      # fetcher pre-populates it); the entrypoint skips its own download when
      # the model directory is already present.
      KOKORO_DIR: "/models/tts/kokoro-multi-lang-v1_0"
      # C-393 engine + tier selection (manifest targetPaths under /models).
      STT_STREAM_ENGINE: "${STT_STREAM_ENGINE:-moonshine}"
      STT_BATCH_ENGINE: "${STT_BATCH_ENGINE:-whisper-cpp}"
      STT_STREAM_MODEL: "${STT_STREAM_MODEL:-stt/sherpa-onnx-moonshine-tiny-en-int8}"
      STT_BATCH_MODEL: "${STT_BATCH_MODEL:-stt/whisper-tiny/ggml-tiny.bin}"
      STT_VAD_MODEL: "${STT_VAD_MODEL:-stt/silero_vad.onnx}"
      STT_ALLOWED_ORIGINS: "${STT_ALLOWED_ORIGINS:-http://localhost:5274,http://127.0.0.1:5274,tauri://localhost,http://tauri.localhost,https://tauri.localhost}"
      # The container must accept WS from the compose network; the host
      # publish binding above is loopback-only (AC-11).
      STT_BIND_ADDRESS: "0.0.0.0"
      STT_VAD_THRESHOLD: "${STT_VAD_THRESHOLD:-0.5}"
      STT_VAD_MIN_SPEECH_MS: "${STT_VAD_MIN_SPEECH_MS:-250}"
      STT_VAD_MIN_SILENCE_MS: "${STT_VAD_MIN_SILENCE_MS:-500}"
      STT_VAD_MAX_SPEECH_MS: "${STT_VAD_MAX_SPEECH_MS:-30000}"
    volumes:
      - *model-volume
    depends_on:
      model-fetcher:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          curl -fsS http://127.0.0.1:8089/health >/dev/null 2>&1 || exit 1
          if [ "${ENABLE_STT:-false}" = "true" ]; then
            curl -fsS http://127.0.0.1:8087/health >/dev/null 2>&1 || exit 1
          fi
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── Client — the game client/app, prebuilt SPA behind nginx (opt-in
  # `client` profile; named `web` before it was renamed — this isn't a
  # generic "web" service, it's the Aikami client) ────────────────────────
  # Tauri users and dist-servers start no client container. The runtime
  # engine config.json (AC-9) is generated inside the container at start by
  # docker/client/generate_config.sh from the env vars below (defaulting to
  # the standard local-stack ports), so one image works across any topology
  # with zero rebuild and no bind mount.
  client:
    profiles: ["client"]
    # Pulls the published image by default; `docker compose build client`
    # builds from Dockerfile.client locally instead (needs `bun run
    # build:client` run first to stage .build/client).
    image: ${AIKAMI_IMAGE_PREFIX:-ghcr.io/bearlysleeping}/aikami-client:${LOCAL_STACK_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "127.0.0.1:${CLIENT_PORT:-5274}:5274"
    environment:
      LLM_ENDPOINT: "${LLM_ENDPOINT:-}"
      IMAGE_ENDPOINT: "${IMAGE_ENDPOINT:-}"
      VOICE_ENDPOINT: "${VOICE_ENDPOINT:-}"
      STT_ENDPOINT: "${STT_ENDPOINT:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5274/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ── Advanced: Ollama (drop-in on the text port) ────────────────────────
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama@sha256:acc1d61dc30525ecbe11c811462637f474ce9b1c8db80321d1cee81e3ffc7894
    ports:
      - "127.0.0.1:${TEXT_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -fsS http://127.0.0.1:11434/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ── Advanced: ComfyUI (drop-in on the image port) ──────────────────────
  comfyui:
    profiles: ["comfyui"]
    image: yanwk/comfyui-boot:cu130-slim-v2@sha256:430aa46ece07c8aff58d02f5554a0a6feda3035a8d0af57ec50041c9b4b589ba
    ports:
      - "127.0.0.1:${IMAGE_PORT:-8188}:8188"
    volumes:
      - comfyui-models:/workspace/app/models
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -fsS http://127.0.0.1:8188/system_stats >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  aikami-models:
    name: aikami-models
  ollama-models:
    name: aikami-ollama-models
  comfyui-models:
    name: aikami-comfyui-models
