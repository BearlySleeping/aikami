$schema: 'https://moonrepo.dev/schemas/v2/project.json'

language: 'typescript'
layer: 'application'
tags:
  - 'e2e'
  - 'playwright'
  - 'application'

toolchains:
  javascript: false

project:
  name: 'e2e'
  description: 'Unified E2E Playwright tests for PWA, Game, and AI services.'
  channel: '#frontend'
  owner: 'Frontend Team'

dependsOn:
  - 'constants'
  - 'types'

fileGroups:
  sources:
    - 'src/**/*'
  configs:
    - 'package.json'
    - 'tsconfig.json'
    - 'playwright.config.ts'
  tests:
    - 'tests/**/*'
    - 'playwright.config.ts'

tasks:
  dev:
    command: 'echo "e2e has no dev server — use moon run e2e:test"'
  build:
    command: 'echo "e2e has no build — use moon run e2e:test"'
  test:
    command: 'bun run test'
    options:
      # Excluded from default CI graph: needs Playwright browsers + running dev
      # server — slow and flaky under cold cache. Run via workflow_dispatch
      # with include-heavy=true, or locally with `bun run test`.
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
  test-client:
    command: 'bun run test:client'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
  test-game:
    command: 'bun run test:game'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
  # C-530: the Hub functional lane. `playwright.config.ts` already defines the
  # `hub` project; this task only gives it a name the contract can point at.
  # The positive publish → approve → discover journey needs Worker bindings, so
  # run it against the `hub-worker` service (wrangler dev --local, port 5278)
  # after `bun moon run hub:build` and `bun moon run hub:db-migrate-local`.
  test-hub:
    command: 'bun run test:hub'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
  release-gate:
    command: 'bun run test:release-gate'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
      - 'src/error_allowlist.ts'
      - 'src/fixtures/engine_replay.ts'
  run-visual-tests:
    command: 'bun run src/visual/runner.ts'
    options:
      runInCI: false
    inputs:
      - '@group(sources)'
  lpc-smoke:
    command: 'bun run scripts/lpc_smoke.ts'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
  # Issue #382 AC-1: the reproducible before/after AI baseline. Needs a running
  # client and a reachable text provider, so it is never in the CI graph.
  #
  # The committed artifact is docs/research/audits/382-ai-baseline-report.md. Each run
  # writes raw per-call data to .evidence/382-baseline/<label>/, which is
  # gitignored and never published.
  bench-ai-baseline:
    command: 'bun run scripts/ai_baseline_bench.ts'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
      - 'scripts/ai_baseline_bench.ts'
  # Asks the provider directly what the C-401 call-2 budget is spent on, and
  # whether the reasoning channel can be disabled on the route the client uses.
  # No browser and no client: the wire log cannot answer this, because a call
  # that is cut off at its deadline never receives a body to read tokens from.
  probe-ai-envelope-thinking:
    command: 'bun run probe:ai-envelope-thinking'
    options:
      runInCI: false
    inputs:
      - '@group(sources)'
      - 'scripts/ai_envelope_thinking_probe.ts'
  test-site:
    command: 'bun run test:site'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
  test-site-a11y:
    command: 'bun run test:site:a11y'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
