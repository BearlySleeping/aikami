$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'
tags:
  - 'e2e'
  - 'playwright'
  - 'application'

toolchains:
  javascript: false

project:
  name: 'e2e'
  description: 'Unified E2E Playwright tests for PWA, Game, and AI services.'
  channel: '#frontend'
  owner: 'Frontend Team'

dependsOn:
  - 'constants'
  - 'types'

fileGroups:
  sources:
    - 'src/**/*'
  configs:
    - 'package.json'
    - 'tsconfig.json'
    - 'playwright.config.ts'
  tests:
    - 'tests/**/*'
    - 'playwright.config.ts'

tasks:
  dev:
    command: 'echo "e2e has no dev server — use moon run e2e:test"'
  build:
    command: 'echo "e2e has no build — use moon run e2e:test"'
  test:
    command: 'bun run test'
    options:
      # Excluded from default CI graph: needs Playwright browsers + running dev
      # server — slow and flaky under cold cache. Run via workflow_dispatch
      # with include-heavy=true, or locally with `bun run test`.
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
  test-client:
    command: 'bun run test:client'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
  test-game:
    command: 'bun run test:game'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
  release-gate:
    command: 'bun run test:release-gate'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
      - 'src/error_allowlist.ts'
      - 'src/fixtures/engine_replay.ts'
  run-visual-tests:
    command: 'bun run src/visual/runner.ts'
    options:
      runInCI: false
    inputs:
      - '@group(sources)'
  lpc-smoke:
    command: 'bun run scripts/lpc_smoke.ts'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
  test-site:
    command: 'bun run test:site'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
  test-site-a11y:
    command: 'bun run test:site:a11y'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
  test-site-visual:
    command: 'bun run test:site:visual'
    options:
      runInCI: false
    inputs:
      - '@group(tests)'
      - '@group(sources)'
