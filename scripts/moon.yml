$schema: 'https://moonrepo.dev/schemas/v2/project.json'

language: 'typescript'
layer: 'application'
tags:
  - 'scripts'
  - 'ci'
  - 'ops'

project:
  name: 'scripts'
  description: 'Monorepo scripts for CI, setup, developer onboarding, and operations.'
  channel: '#general'
  owner: 'Core Team'

fileGroups:
  sources:
    - 'src/lib/**/*.ts'
  configs:
    - 'package.json'
    - 'tsconfig.json'
    - 'moon.yml'
  entry:
    - 'src/index.ts'
