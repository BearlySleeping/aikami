$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'
tags:
  - 'scripts'
  - 'ci'
  - 'ops'

project:
  name: 'scripts'
  description: 'Monorepo scripts for CI, setup, developer onboarding, and operations.'
  channel: '#general'
  owner: 'Core Team'

fileGroups:
  sources:
    - 'src/lib/**/*.ts'
  configs:
    - 'package.json'
    - 'tsconfig.json'
    - 'moon.yml'
  entry:
    - 'src/index.ts'

tasks:
  test:
    command: 'bun test'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(entry)'
    options:
      mergeArgs: 'replace'

  typecheck:
    command: 'bun run typecheck'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(entry)'
    options:
      mergeArgs: 'replace'

  lint:
    command: 'bun run lint'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(entry)'
    options:
      mergeArgs: 'replace'

  fix:
    command: 'bun run fix'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(entry)'
    options:
      mergeArgs: 'replace'

  run:
    command: 'bun run start'
    options:
      cache: false
      runInCI: false

  lint-contracts:
    command: 'bun run lint-contracts'
    inputs:
      - 'src/lib/ops/lint_contracts.ts'
    options:
      cache: false
      runInCI: true

  # C-394 AC-4: structural invariants of the server data plane (I-1 source
  # level + I-9). Runs in moon ci — the built-bundle half of I-1 is proven
  # by hub:build + a grep of build/client (documented in AC-4 evidence).
  guard-data-plane:
    command: 'bun run src/lib/ops/guard_data_plane.ts'
    inputs:
      - 'src/lib/ops/guard_data_plane.ts'
      - 'apps/frontend/hub/src/**/*'
      - 'packages/backend/database/**/*'
    options:
      cache: false
      runInCI: true
