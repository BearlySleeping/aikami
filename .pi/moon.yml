$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'tool'
tags:
  - 'pi'
  - 'tools'
  - 'agent'

project:
  name: 'pi'
  description: 'Pi coding agent configuration, skills, extensions, and scripts.'
  channel: '#general'
  owner: 'Core Team'

fileGroups:
  sources:
    - 'scripts/**/*.ts'
    - 'skills/**/*.md'
    - 'skills/**/*.ts'
    - 'extensions/**/*.ts'
    - 'generated-skills/**/*.{md,ts}'
    - 'runners/**/*.ts'
  configs:
    - 'package.json'
    - 'tsconfig.json'
    - 'moon.yml'
    - 'mcp.json'
    - 'settings.json'
  entry:
    - 'scripts/update_skills.ts'

tasks:
  test:
    command: 'bun run test'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
    options:
      mergeArgs: 'replace'
      runInCI: false

  # C-468: the extension registration suite, run credential-free against a
  # recording pi stand-in — no live Herdr server, cloud credentials or paid
  # model. Same command as `test`, split out under an explicit CI-facing
  # name because `test` stays runInCI: false for local convenience while
  # this is the deterministic surface the three-OS automation-unit workflow
  # (and moon ci) actually gates on.
  automation-unit:
    command: 'bun run test'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
    options:
      mergeArgs: 'replace'
      runInCI: true

  typecheck:
    command: 'bun run typecheck'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(entry)'
    options:
      mergeArgs: 'replace'

  # args/env mirror the inherited `lint` task in .moon/tasks/all.yml — this
  # task replaces it wholesale, so the reporter switch has to be repeated here.
  lint:
    command: 'bun run lint'
    args: ['--reporter=$AIKAMI_BIOME_REPORTER']
    env:
      AIKAMI_BIOME_REPORTER: 'default'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(entry)'
    options:
      mergeArgs: 'replace'

  fix:
    command: 'bun run fix'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(entry)'
    options:
      mergeArgs: 'replace'
