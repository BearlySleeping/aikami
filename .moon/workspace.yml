# .moon/workspace.yml
$schema: "https://moonrepo.dev/schemas/v2/workspace.json"

projects:
  pi: ".pi"

  # Scripts
  scripts: "scripts"

  # App IDs
  client: "apps/frontend/client"
  site: "apps/frontend/site"
  docs: "apps/frontend/docs"
  hub: "apps/frontend/hub"
  e2e: "apps/e2e"
  worker: "apps/backend/worker"
  voice: "apps/backend/voice"
  image: "apps/backend/image"
  text: "apps/backend/text"
  local-stack: "apps/backend/local-stack"
  cloudflare: "apps/backend/cloudflare"

  # Shared Packages
  constants: "packages/shared/constants"
  schemas: "packages/shared/schemas"
  parser: "packages/shared/parser"
  types: "packages/shared/types"
  logger: "packages/shared/logger"
  utils: "packages/shared/utils"
  mocks: "packages/shared/mocks"
  local-ai: "packages/shared/local-ai"
  lpc: "packages/shared/lpc"

  # Backend Packages
  backend-chat: "packages/backend/chat"
  backend-discord-bot: "packages/backend/discord-bot"
  backend-configs: "packages/backend/configs"
  backend-database: "packages/backend/database"
  backend-utils: "packages/backend/utils"
  backend-auth: "packages/backend/auth"
  backend-svelte-kit: "packages/backend/svelte-kit"
  backend-project-ai: "packages/backend/project-ai"

  # Frontend Packages
  frontend-engine: "packages/frontend/engine"
  frontend-services: "packages/frontend/services"
  frontend-utils: "packages/frontend/utils"
  frontend-ai-gateway: "packages/frontend/ai-gateway"
  frontend-local-runtime: "packages/frontend/local-runtime"
  frontend-storage: "packages/frontend/storage"
  frontend-configs: "packages/frontend/configs"
  frontend-theme: "packages/frontend/theme"
  frontend-preview: "packages/frontend/preview"

vcs:
  provider: "github"
  defaultBranch: "main"
  remoteCandidates: ["origin"]
  # 🔴 TWO RULES FOR EVERY COMMAND IN THIS BLOCK.
  #
  # 1. No shell syntax. Commands are copied VERBATIM into the generated hook,
  #    and moon generates PowerShell on Windows / bash on POSIX. `[ -x ... ]`,
  #    `&&` and `if` are parse errors on Windows contributors' machines.
  #    Conditionals belong inside the script — see ops/sync_workspace.ts,
  #    which also documents why `moon sync` must NOT run in worktrees.
  #
  # 2. 🔴 Only reference an entrypoint that exists in EVERY tree, including
  #    old branches and worktrees created before the command was added.
  #    `core.hooksPath` is ONE absolute path in the main checkout shared by
  #    every worktree, but `bun run <name>` resolves against whatever
  #    package.json that worktree has checked out. So a hook naming a NEWLY
  #    added script fails in every pre-existing tree.
  #
  #    2026-09-03: adding `pre-push: bun run guard-workspace-boundary` broke
  #    the push for all four in-flight contract worktrees at once — they were
  #    branched before the script existed, so `bun run` exited non-zero and
  #    aborted the push on work that had already passed verification.
  #
  #    `pre-commit` is safe because `bun run pre-commit` predates every live
  #    branch: an old tree runs its own older pre_commit.ts (no boundary
  #    guard, no error) while a current tree gets the guard. Degrading to
  #    "older behaviour" is fine; failing the hook outright is not. Adding a
  #    NEW hook name is only safe once every active branch carries the script.
  #
  #    This is why `post-merge` / `post-checkout` are NOT declared here. They
  #    run `moon sync`, and a failure there is NOT merely cosmetic: a non-zero
  #    post-checkout makes `git checkout` ITSELF exit non-zero, so every
  #    `git checkout && …` and every execFileSync git call breaks in any tree
  #    lacking the script — including a developer checking out an older
  #    branch in the main repo. The previous inline-shell form had the same
  #    defect on Windows, where moon emits PowerShell and the POSIX `if`
  #    was a parse error.
  #
  #    🔴 They are not gone, though — they live as HAND-WRITTEN, committed
  #    files at .moon/hooks/post-checkout and .moon/hooks/post-merge, which a
  #    developer who just clones the repo gets on their first `bun install`
  #    (postinstall → `moon sync` → core.hooksPath). Writing them by hand is
  #    the whole point: moon's generated template opens `set -eo pipefail`,
  #    while those files carry no `set -e`, swallow their output and `exit 0`
  #    unconditionally — so an old tree degrades to doing nothing instead of
  #    failing a checkout. `moon sync` leaves undeclared files in this
  #    directory alone, and a branch predating them simply doesn't have them,
  #    so git doesn't run them.
  #
  #    🔴 Do NOT "tidy up" by moving them into this block. That reintroduces
  #    `set -eo pipefail` and the broken-checkout bug in one edit.
  #    scripts/src/lib/ops/__tests__/git_hooks.test.ts fails if you do.
  #
  #    `pipeline.syncProjects` / `syncWorkspace` below still re-sync on every
  #    `moon run`, and `bun run sync-workspace` remains for a manual sync.
  hooks:
    pre-commit:
      - "bun run pre-commit"

constraints:
  enforceLayerRelationships: false

pipeline:
  cacheLifetime: "7 days"
  autoCleanCache: true
  inheritColorsForPipedTasks: true
  installDependencies: ["bun"]
  syncProjects: true
  syncWorkspace: true

hasher:
  walkStrategy: "vcs"
  optimization: "accuracy"
  warnOnMissingInputs: true
  ignoreMissingPatterns:
    - "**/.env"
    - "**/vite.config.ts"
    - "**/tsconfig*.json"

telemetry: false
