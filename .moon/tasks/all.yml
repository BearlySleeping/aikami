# =============================================================================
# Global Inherited Tasks (All Projects)
# =============================================================================
# Tasks defined here are inherited by EVERY project in the workspace.
# Projects can override, extend, or exclude them via:
#   workspace:
#     inheritedTasks:
#       exclude: ['test']
#
# All tasks use "bun run <name>" to defer to each project's package.json
# scripts. This makes them universally inheritable — projects control the
# actual command via their scripts, while moon handles caching, inputs,
# dependency ordering, and CI gating.
# =============================================================================

$schema: "https://moonrepo.dev/schemas/tasks.json"

# ============================================================
# File Groups
# ============================================================
# Reusable file collections referenced by tasks across all projects.
# Paths without a leading "/" are relative to the inheriting project's root.
# Paths with a leading "/" are relative to the workspace root.
# ============================================================
fileGroups:
  # Project source code
  sources:
    - "src/**/*"

  # Project-level config files
  configs:
    - "package.json"
    - "tsconfig.json"
    - "moon.yml"

  # Workspace-level root configs (shared across all projects)
  root-configs:
    - "/package.json"
    - "/bun.lock"
    - "/biome.json"

  # CI/CD and deployment pipeline files
  deployment:
    - "/scripts/src/lib/deploy/deployment_config.ts"
    - "/bun.lock"
    - "/package.json"

  # Test files
  tests:
    - "tests/**/*"
    - "**/*.test.{ts,js}"
    - "**/*.spec.{ts,js}"
    - "**/__tests__/**/*"

  # Static assets and styles
  assets:
    - "static/**/*"
    - "public/**/*"
    - "assets/**/*"
    - "**/*.css"
    - "**/*.scss"

# ============================================================
# Tasks
# ============================================================
tasks:
  # ------------------------------------------------------------------
  # Lint
  # Runs the project's linter. All projects expose `bun run lint`.
  # ------------------------------------------------------------------
  lint:
    command: "bun"
    args: ["run", "lint"]
    inputs:
      - "@group(sources)"
      - "@group(configs)"
      - "@group(root-configs)"
    options:
      cache: true
      runInCI: true
      runDepsInParallel: true

  # ------------------------------------------------------------------
  # Format Check
  # Checks formatting without writing changes. Not run in CI — formatting
  # is enforced locally by the `moon sync hooks` pre-commit hook (runs
  # `moon run :fix`), so a format-only failure should never reach a PR.
  # Still runnable on demand via `moon run :format` / `moon check`.
  # ------------------------------------------------------------------
  format:
    command: "bun"
    args: ["run", "format"]
    inputs:
      - "@group(sources)"
      - "@group(configs)"
      - "@group(root-configs)"
    options:
      cache: true
      runInCI: false

  # ------------------------------------------------------------------
  # Type Check
  # Runs TypeScript (or project-specific) type checking.
  # ------------------------------------------------------------------
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    inputs:
      - "@group(sources)"
      - "@group(configs)"
      - "@group(root-configs)"
      - "/packages/shared/*/src/**/*"
      - "/packages/frontend/*/src/**/*"
      - "/packages/backend/*/src/**/*"
    options:
      cache: true
      runInCI: true

  # ------------------------------------------------------------------
  # Lint + Format Fix
  # Auto-fixes lint and formatting issues in place.
  # ------------------------------------------------------------------
  fix:
    command: "bun"
    args: ["run", "fix"]
    inputs:
      - "@group(sources)"
      - "@group(configs)"
      - "@group(root-configs)"
    options:
      cache: false
      runInCI: false
      affectedFiles: true

  # ------------------------------------------------------------------
  # Validate
  # Meta-task: runs lint + typecheck in sequence. Format is deliberately
  # excluded — it's enforced locally by the pre-commit hook (`moon sync
  # hooks`), not re-checked in CI. Run `moon run :format` directly if you
  # need to check it on demand.
  # ------------------------------------------------------------------
  validate:
    deps:
      - "~:lint"
      - "~:typecheck"
    options:
      cache: false
      runInCI: true
      internal: true

  # Structural guards for frontend View, ViewModel, and service conventions.
  # Kept out of CI until the existing convention backlog is cleared.
  guard-mvvm-conventions:
    command: "bun run src/lib/ops/guard_mvvm_conventions.ts"
    inputs:
      - "/scripts/src/lib/ops/guard_mvvm_conventions.ts"
      - "/apps/frontend/client/src/**/*_view.svelte"
      - "/apps/frontend/client/src/**/*_view_model.svelte.ts"
      - "/apps/frontend/hub/src/**/*_view.svelte"
      - "/apps/frontend/hub/src/**/*_view_model.svelte.ts"
    options:
      cache: false
      runInCI: false

  guard-service-conventions:
    command: "bun run src/lib/ops/guard_service_conventions.ts"
    inputs:
      - "/scripts/src/lib/ops/guard_service_conventions.ts"
      - "/apps/frontend/client/src/lib/services/**/*_service.svelte.ts"
    options:
      cache: false
      runInCI: false
