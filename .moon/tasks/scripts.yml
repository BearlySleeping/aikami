$schema: 'https://moonrepo.dev/schemas/v2/tasks.json'

inheritedBy:
  tag: 'scripts'

tasks:
  # Aggregates every guard-* structural check into one target: `bun run
  # guard` (root), `moon run scripts:guard`, or `moon run :guard` (only this
  # project defines it, so the wildcard just runs it here). All of them live
  # in this project because their `bun run src/lib/ops/guard_*.ts` commands
  # are relative to it, even though most scan apps/frontend/client and
  # apps/frontend/hub, not scripts' own source.
  guard:
    deps:
      - '~:guard-mvvm-conventions'
      - '~:guard-service-conventions'
      - '~:guard-service-mock-coverage'
      - '~:guard-image-component'
      - '~:guard-data-plane'
      - '~:guard-type-safety'
      - '~:guard-orphaned-capability'
      - '~:guard-test-boundary'
      - '~:guard-view-model-composition'
      - '~:guard-source-file-size'
    options:
      cache: false
      runInCI: true

  test:
    command: 'bun test'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(entry)'
    options:
      mergeArgs: 'replace'
      runInCI: false

  # C-468: the deterministic, credential-free subset of `scripts` unit
  # tests — contract-pipeline stage logic, herdr session bookkeeping, and
  # the Bun/Node runtime boundary — scoped narrowly so this stays fast and
  # never blanket-enables the rest of scripts' tests (many need live
  # network/AI/cloud access and are intentionally excluded from CI).
  # `inputs` lists only the directories this actually exercises so moon's
  # affected-detection — and the three-OS workflow's path filter — skip an
  # unrelated diff (e.g. docs-only changes) entirely.
  automation-unit:
    command: 'bun run test:automation-unit'
    inputs:
      - 'src/lib/agents/contract_pipeline/**/*'
      - 'src/lib/agents/evaluation/**/*'
      - 'src/lib/herdr/**/*'
      - 'src/lib/env/**/*'
      - 'src/lib/ops/guard_service_mock_coverage.test.ts'
      - 'src/lib/ops/legacy_service_scope.ts'
      - 'src/lib/ops/__tests__/guard_source_file_size.test.ts'
      - 'src/lib/ops/guard_source_file_size.ts'
      - 'src/lib/ops/guard_source_file_size_helpers.ts'
      - 'src/lib/ops/guard_source_file_size_output.ts'
      - 'src/lib/ops/guard_source_file_size_baseline.json'
      - 'src/lib/ops/guard_source_file_size_exceptions.json'
      - '@group(configs)'
    options:
      mergeArgs: 'replace'
      runInCI: true

  typecheck:
    command: 'bun run typecheck'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(entry)'
    options:
      mergeArgs: 'replace'

  # args/env mirror the inherited `lint` task in .moon/tasks/all.yml — this
  # task replaces it wholesale, so the reporter switch has to be repeated here.
  lint:
    command: 'bun run lint'
    args: ['--reporter=$AIKAMI_BIOME_REPORTER']
    env:
      AIKAMI_BIOME_REPORTER: 'default'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(entry)'
    options:
      mergeArgs: 'replace'

  fix:
    command: 'bun run fix'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '@group(entry)'
    options:
      mergeArgs: 'replace'

  run:
    command: 'bun run start'
    options:
      cache: false
      runInCI: false

  # C-475 AC-5: agent guidance drift checks — manifest coverage, reference
  # resolution, canonical example structure, and generator reproducibility.
  # Runs in moon ci. No network, AI, or service dependencies.
  validate-agent-guidance:
    command: 'bun run src/lib/ops/validate_agent_guidance.ts'
    inputs:
      - 'src/lib/ops/validate_agent_guidance.ts'
      - 'src/lib/ops/generate_context.ts'
      - 'src/lib/herdr/session.ts'
      - '/AGENTS.md'
      - '/.claude/CLAUDE.md'
      - '/.context/**/*'
      - '/.pi/README.md'
      - '/.pi/settings.json'
      - '/.pi/extensions/**/*.ts'
      - '/.pi/guidance/**/*'
      - '/.pi/runners/**/*'
      - '/.pi/scripts/**/*.ts'
      - '/.pi/prompts/**/*.md'
      - '/.pi/skills/**/*'
      - '/.pi/generated-skills/**/*'
      - 'src/lib/agents/**/*.ts'
    options:
      cache: false
      runInCI: true

  lint-contracts:
    command: 'bun run lint-contracts'
    inputs:
      - 'src/lib/ops/lint_contracts.ts'
    options:
      cache: false
      runInCI: true

  # C-394 AC-4: structural invariants of the server data plane (I-1 source
  # level + I-9). Runs in moon ci — the built-bundle half of I-1 is proven
  # by hub:build + a grep of build/client (documented in AC-4 evidence).
  guard-data-plane:
    command: 'bun run src/lib/ops/guard_data_plane.ts'
    inputs:
      - 'src/lib/ops/guard_data_plane.ts'
      - '/apps/frontend/hub/src/**/*'
      - '/packages/backend/database/**/*'
      - '!/packages/backend/database/node_modules/**'
    options:
      cache: false
      runInCI: true

  # Structural guards for frontend View, ViewModel, and service conventions
  # (.pi/skills/svelte-conventions/SKILL.md).
  guard-mvvm-conventions:
    command: 'bun run src/lib/ops/guard_mvvm_conventions.ts'
    inputs:
      - 'src/lib/ops/guard_mvvm_conventions.ts'
      - 'src/lib/ops/guard_mvvm_conventions_baseline.json'
      - '/apps/frontend/client/src/**/*_view.svelte'
      - '/apps/frontend/client/src/**/*_view_model.svelte.ts'
      - '/apps/frontend/hub/src/**/*_view.svelte'
      - '/apps/frontend/hub/src/**/*_view_model.svelte.ts'
    options:
      cache: false
      runInCI: true

  guard-service-conventions:
    command: 'bun run src/lib/ops/guard_service_conventions.ts'
    inputs:
      - 'src/lib/ops/guard_service_conventions.ts'
      - 'src/lib/ops/guard_service_conventions_baseline.json'
      - '/apps/frontend/client/src/lib/services/**/*_service.svelte.ts'
      - '/apps/frontend/hub/src/lib/client/services/**/*_service.svelte.ts'
    options:
      cache: false
      runInCI: true

  # Every '$services' barrel export must have a matching key in
  # test_preload.ts's localServicesMockBase() — the regression class behind
  # PRs #241, #243, and the C-466/C-467 test-infra fix (2026-09-05).
  #
  # Scoped to guard_service_mock_coverage_legacy.json: the explicit, shrinking
  # inventory of $services exports the legacy preload still requires. Migrated
  # features inject capabilities instead and never appear here. The dependency
  # scan over apps/frontend/client/src seeds/drifts the inventory; it walks the
  # client graph, so the client source is an input.
  guard-service-mock-coverage:
    command: 'bun run src/lib/ops/guard_service_mock_coverage.ts'
    inputs:
      - 'src/lib/ops/guard_service_mock_coverage.ts'
      - 'src/lib/ops/guard_service_mock_coverage_legacy.json'
      - 'src/lib/ops/legacy_service_scope.ts'
      - '/apps/frontend/client/src/**/*'
    options:
      cache: false
      runInCI: true

  # Enforces the shared <Image> component ($components) over raw <img> tags
  # (C-455) — see .pi/skills/aikami-ui/SKILL.md.
  guard-image-component:
    command: 'bun run src/lib/ops/guard_image_component.ts'
    inputs:
      - 'src/lib/ops/guard_image_component.ts'
      - '/apps/frontend/client/src/**/*.svelte'
      - '/apps/frontend/hub/src/**/*.svelte'
      - '/packages/frontend/components/src/lib/image/image.svelte'
    options:
      cache: false
      runInCI: true

  # C-400 AC-5: content-pack NPC appearance indices must stay within the
  # generated LPC catalog (and head slots must resolve to head/heads/*
  # assets). Runs in moon ci so invalid appearance data fails the build.
  validate-content:
    command: 'bun run src/lib/ops/validate_content_appearance.ts'
    inputs:
      - 'src/lib/ops/validate_content_appearance.ts'
      - '/apps/frontend/client/static/content-packs/**/*'
      - '/apps/frontend/client/src/lib/data/lpc_asset_catalog_generated.ts'
    options:
      cache: false
      runInCI: true

  # Ratchet guard on the type-safety escape hatches (as unknown as / as any /
  # @ts-ignore). Counts may only go down; see guard_type_safety_baseline.json.
  guard-type-safety:
    command: 'bun run src/lib/ops/guard_type_safety.ts'
    inputs:
      - 'src/lib/ops/guard_type_safety.ts'
      - 'src/lib/ops/guard_type_safety_helpers.ts'
      - 'src/lib/ops/guard_type_safety_baseline.json'
      - '/apps/**/*'
      - '!/apps/**/node_modules/**'
      - '!/apps/**/.svelte-kit/**'
      - '!/apps/**/dist/**'
      - '!/apps/**/build/**'
      - '/packages/**/*'
      - '!/packages/**/node_modules/**'
      - '!/packages/**/dist/**'
      - '!/packages/**/build/**'
      - '/.pi/**/*'
      - '!/.pi/generated-skills/**'
    options:
      cache: false
      runInCI: true

  # ViewModel composition-boundary ratchet: a *_view_model.svelte.ts must not
  # import the `$services` barrel or the aggregate `@aikami/frontend/services`
  # root at runtime. See guard_view_model_composition_baseline.json.
  guard-view-model-composition:
    command: 'bun run src/lib/ops/guard_view_model_composition.ts'
    inputs:
      - 'src/lib/ops/guard_view_model_composition.ts'
      - 'src/lib/ops/guard_view_model_composition_baseline.json'
      - '/apps/frontend/client/src/lib/views/**/*'
    options:
      cache: false
      runInCI: true

  # Pragmatic source-file-size guard: flags new oversized modules (production
  # hard limit 800, tests 1500), warns above 500/800, and ratchets existing
  # debt via guard_source_file_size_baseline.json. Exceptions are reviewed in
  # guard_source_file_size_exceptions.json. In CI, BASE_REF lets the guard
  # reject unauthorized baseline expansion against the trusted base revision.
  guard-source-file-size:
    command: 'bun run src/lib/ops/guard_source_file_size.ts'
    inputs:
      - 'src/lib/ops/guard_source_file_size.ts'
      - 'src/lib/ops/guard_source_file_size_helpers.ts'
      - 'src/lib/ops/guard_source_file_size_output.ts'
      - 'src/lib/ops/guard_source_file_size_baseline.json'
      - 'src/lib/ops/guard_source_file_size_exceptions.json'
      - '/apps/**/*'
      - '!/apps/**/node_modules/**'
      - '!/apps/**/.svelte-kit/**'
      - '!/apps/**/dist/**'
      - '!/apps/**/build/**'
      - '/packages/**/*'
      - '!/packages/**/node_modules/**'
      - '!/packages/**/dist/**'
      - '!/packages/**/build/**'
      - '/scripts/**/*'
      - '!/scripts/**/node_modules/**'
      - '!/scripts/**/dist/**'
      - '!/scripts/**/build/**'
      - '/.pi/**/*'
      - '!/.pi/generated-skills/**'
    options:
      cache: false
      runInCI: true

  # Production source must not import test helpers (test_preload.ts,
  # feature testing/ fixtures, *.test.ts). Shipping code cannot depend on
  # test scaffolding; see guard_test_boundary.ts.
  guard-test-boundary:
    command: 'bun run src/lib/ops/guard_test_boundary.ts'
    inputs:
      - 'src/lib/ops/guard_test_boundary.ts'
      - '/apps/**/src/**/*'
      - '/packages/**/src/**/*'
    options:
      cache: false
      runInCI: true

  # C-429 AC-5: LPC sheet coverage audit — deterministic alpha inspection.
  # Runs on changes to the collector, the LPC asset tree, the baseline, or
  # the geometry resolver. Exits non-zero on regressions.
  audit-lpc-coverage:
    command: 'bun run src/lib/ops/audit_lpc_coverage.ts'
    inputs:
      - 'src/lib/ops/audit_lpc_coverage.ts'
      - '/apps/frontend/client/static/game-data/lpc/**/*'
      - '/apps/frontend/client/static/game-data/lpc_coverage_baseline.json'
      - '/apps/frontend/client/static/game-data/asset_hashes.json'
      - '/packages/frontend/engine/src/rendering/lpc_sheet_geometry.ts'
    options:
      cache: false
      runInCI: true
