# .github/zizmor.yml
# zizmor configuration — deliberately accepted findings, each with a rationale.
#
# Prefer inline `# zizmor: ignore[rule] — reason` comments on the offending
# step over entries here: they live next to the code they excuse and cannot
# go stale. This file is for policies and for whole-file exemptions that would
# otherwise need to be repeated on a dozen steps.
#
# 🔴 Never add `file.yml:LINE` entries. Line numbers silently drift on the
# next edit, turning a suppression into either a false pass on an unrelated
# step or a surprise CI failure. Use a policy or an inline comment.
#
# See https://docs.zizmor.sh/configuration/ for full documentation.

rules:
  # ── unpinned-uses ──────────────────────────────────────────────────
  # Declarative pinning policy, replacing the old per-line ignore list.
  #   ref-pin  = a tag or branch ref is required (`@v7`)
  #   hash-pin = a full commit SHA is required (`@3d3c42e…`)
  #
  # C-440 AC-4: Renovate pins third-party actions to SHAs. Until its first
  # pinning run has swept every workflow, a tag ref is the accepted floor
  # repo-wide — a SHA already satisfies `ref-pin`, so the workflows Renovate
  # has already pinned stay pinned and nothing regresses.
  #
  # 👉 Once Renovate has swept everything, tighten `"*"` to `hash-pin` and
  #    leave `actions/*` at `ref-pin` (first-party, exempt per C-440).
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        "*": ref-pin

  # ── cache-poisoning ────────────────────────────────────────────────
  # release.yml uses actions/cache and Swatinem/rust-cache for build
  # performance. Those caches are scoped by branch and workflow, and the
  # workflow only runs on trusted events (release publish, push to main,
  # manual dispatch). Low risk; disabling caching is expensive.
  cache-poisoning:
    ignore:
      - "release.yml"

  # ── artipacked ─────────────────────────────────────────────────────
  # Workflows that genuinely need git credentials on the runner.
  #
  # ⚠️ release.yml is a blanket exemption covering ~10 checkout steps, but
  # only the ones that `git push` / upload release assets actually need
  # credentials. Worth narrowing to per-step inline ignores plus
  # `persist-credentials: false` everywhere else — tracked as follow-up.
  artipacked:
    ignore:
      - "release.yml"  # needs credentials for gh release upload and git push
      - "update-compose-digests.yml"  # needs credentials for git push
