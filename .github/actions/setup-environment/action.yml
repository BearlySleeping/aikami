# ======================================================================================
# Composite Action: Setup Deploy Environment
# ======================================================================================
#
# Shared setup for release/deploy jobs. Every input defaults to "off" so each
# job opts INTO only what it actually needs instead of every job paying for
# every tool (Node, Docker registry auth, Bun/Moon caches).
#
# GCP auth was removed in C-441 (SOPS/age replaced GCP Secret Manager as the
# secrets backend) — no job needs a GCP credential anymore.
#
# Assumes `actions/checkout` already ran — checkout is deliberately NOT
# included here so callers control fetch-depth / ref per job.
name: "Setup Deploy Environment"
description: "Bun (+ optional Node), optional Docker registry auth, optional Bun/Moon build cache — only what the calling job needs."

inputs:
  bun-version:
    description: 'Bun version to install. Leave empty (the default) to read `.bun-version` at the repo root — that file is the single source of truth, shared with proto/moon. Only set this to deliberately test a different version.'
    required: false
    default: ""

  node:
    description: 'Set to "true" to also install Node.js. Only jobs that shell out to Node-dependent tooling need this — Cloud Run and desktop legs run entirely on Bun.'
    required: false
    default: "false"
  node-version:
    description: "Node.js version, only used when node = true."
    required: false
    default: "24.x"

  install-deps:
    description: 'Set to "true" to run `bun install --frozen-lockfile`. Only needed by jobs that invoke moon or the full deploy orchestrator (scripts/src/lib/deploy/index.ts) — those pull in real npm deps. CI-only planning/decision scripts (ci_planning.ts, resolve_plan.ts) do not.'
    required: false
    default: "false"

  moon-cache:
    description: 'Set to "true" to restore/save the shared Bun install + Moon build cache. Skip for jobs that never invoke moon (docker-release, reuse legs, planning jobs) — restoring an unused cache just costs time.'
    required: false
    default: "false"
  moon-cache-save:
    description: 'Set to "false" to RESTORE the Moon build cache without writing it back. Saving the rolling SHA-keyed entry costs ~20s of post-job time on every single run — even a no-op one — and each PR branch writes an entry that only that PR can ever read, while still competing for the repo-wide 10 GB budget. PR gates should restore-only; trusted main/release runs save so there is always a warm entry to restore from.'
    required: false
    default: "true"

  docker-registry:
    description: 'Set to a registry host (e.g. "europe-west1-docker.pkg.dev") to run `gcloud auth configure-docker` against it. Empty = skip.'
    required: false
    default: ""

  sops:
    description: 'Set to "true" to install the pinned sops CLI (C-441 secrets — decrypt_secrets.ts / encrypt_secrets.ts shell out to it). GitHub-hosted runners don''t ship it. Only jobs that decrypt/encrypt secrets need this.'
    required: false
    default: "false"
  sops-version:
    description: "sops version to install. Keep in sync with the version used locally (see flake.nix)."
    required: false
    default: "3.13.3"

runs:
  using: "composite"
  steps:
    # Version comes from `.bun-version` unless a caller overrides it. That
    # same file is what proto (and therefore moon's bun toolchain) detects, so
    # the runner's bun and moon's bun can never drift apart.
    - name: 🥖 Setup Bun
      uses: oven-sh/setup-bun@v2 # zizmor: ignore[unpinned-uses] to be pinned to SHA by Renovate (C-440 AC-4)
      with:
        bun-version: ${{ inputs.bun-version }}
        bun-version-file: ${{ inputs.bun-version == '' && '.bun-version' || '' }}

    - name: 📦 Setup Node.js
      if: inputs.node == 'true'
      uses: actions/setup-node@v6 # zizmor: ignore[unpinned-uses] actions/* are exempt per C-440
      with:
        node-version: ${{ inputs.node-version }}

    # Bun install cache: content-addressed by the lockfile. A hit means
    # it's complete — no need for a rolling key.
    - name: 🥟 Restore Bun dependency cache
      if: inputs.moon-cache == 'true'
      uses: actions/cache@v6 # zizmor: ignore[unpinned-uses] actions/* are exempt per C-440
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-

    # Moon build cache: uses a rolling key (SHA-based) so it's written
    # fresh per run and restored from the most recent successful run.
    # Scoped by workflow to avoid release-pipeline caches crowding out
    # PR-gate caches (GitHub's 10 GB Actions cache is shared repo-wide and
    # LRU-evicted — an oversized entry here evicts the docker buildx caches).
    #
    # 🔴 Only `states` and `outputs` are cached, NOT all of `.moon/cache`.
    # `.moon/cache/hashes` is 88% of the directory (458 MB of 523 MB locally,
    # 2079 debug manifests — `client:tauri-build` alone writes a 2 MB manifest
    # because it hashes 13,547 input files from `static/**`). Those manifests
    # only feed `moon query hash` / `hash-diff` diagnostics. A cache HIT is
    # decided by recomputing the hash from inputs and matching it against
    # `states/<project>/<task>/lastRun.json` + `outputs/<hash>.tar.gz`.
    # If that reading were ever wrong, the failure mode is a cache MISS
    # (slower) — never a stale or incorrect result, because moon recomputes
    # the hash from the real inputs on every run regardless.
    # Two variants of the same cache, selected by `moon-cache-save`, because
    # `actions/cache` has no "restore but do not save" switch — the save is an
    # implicit post step that registers itself whenever the action runs.
    - name: 🌙 Restore Moon build cache (read-write)
      if: inputs.moon-cache == 'true' && inputs.moon-cache-save == 'true'
      uses: actions/cache@v6 # zizmor: ignore[unpinned-uses] actions/* are exempt per C-440
      with:
        path: |
          .moon/cache/states
          .moon/cache/outputs
        key: ${{ runner.os }}-${{ runner.arch }}-moon-${{ github.workflow }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-moon-${{ github.workflow }}-
          ${{ runner.os }}-${{ runner.arch }}-moon-

    - name: 🌙 Restore Moon build cache (read-only)
      if: inputs.moon-cache == 'true' && inputs.moon-cache-save != 'true'
      uses: actions/cache/restore@v6 # zizmor: ignore[unpinned-uses] actions/* are exempt per C-440
      with:
        path: |
          .moon/cache/states
          .moon/cache/outputs
        key: ${{ runner.os }}-${{ runner.arch }}-moon-${{ github.workflow }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-moon-${{ github.workflow }}-
          ${{ runner.os }}-${{ runner.arch }}-moon-

    - name: 📦 Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: bun install --frozen-lockfile

    # Prune the RESTORED cache before this job adds to it. The moon cache key
    # is rolling (SHA-based), so without this the entry grows monotonically
    # run over run and eventually starts evicting other workflows' caches out
    # of the shared 10 GB repo budget. Pruning here — rather than after the
    # job — works because actions/cache saves in a post step, so whatever is
    # on disk at the end is what gets stored.
    #
    # Never fatal: a stale-cache cleanup failing must not fail the build.
    - name: 🧹 Prune stale moon cache entries
      if: inputs.moon-cache == 'true' && inputs.moon-cache-save == 'true' && inputs.install-deps == 'true'
      shell: bash
      run: bun moon clean --lifetime '7 days' || echo "moon clean failed — continuing with an unpruned cache"

    # Force moon to use the globally installed bun (from setup-bun) instead
    # of provisioning its own via proto. Without this, moon's toolchain sees
    # `bun: version: "latest"` in .moon/toolchains.yml and downloads a
    # different bun than the pinned version above.
    - name: 🌙 Force moon to use global tools
      shell: bash
      run: echo "MOON_TOOLCHAIN_FORCE_GLOBALS=true" >> "$GITHUB_ENV"
    - name: 🐳 Configure Docker for Artifact Registry
      if: inputs.docker-registry != ''
      shell: bash
      env:
        REGISTRY: ${{ inputs.docker-registry }}
      run: gcloud auth configure-docker "$REGISTRY" --quiet

    # cosign verifies the downloaded sops binary below wasn't tampered with
    # in transit or substituted by a compromised release — this installs a
    # CI credential (decrypts every production secret), so an unverified
    # binary download here is a real supply-chain risk, not a theoretical one.
    - name: 🔏 Install cosign
      if: inputs.sops == 'true'
      uses: sigstore/cosign-installer@v3 # zizmor: ignore[unpinned-uses] to be pinned to SHA by Renovate (C-440 AC-4)

    # Cross-platform because desktop build legs run on linux/windows/macos
    # (see ci_planning.ts PLATFORM_DEFAULTS) and each decrypts secrets.
    # macos-latest / windows-latest are both arm64/amd64 respectively as of
    # this writing — resolved dynamically from runner.os/runner.arch rather
    # than hardcoded, so a future runner-image architecture change doesn't
    # silently pick the wrong asset.
    #
    # Verification chain: cosign confirms sops-vX.Y.Z.checksums.txt was
    # actually signed by getsops/sops's own release workflow (keyless
    # sigstore signing — certificate identity pinned to that exact repo +
    # workflow, issued by GitHub's OIDC token endpoint), THEN the
    # downloaded binary's sha256 is checked against the value inside that
    # now-verified checksums file. Either step failing aborts before the
    # binary is ever placed on PATH.
    - name: 🔐 Install sops (checksum + signature verified)
      if: inputs.sops == 'true'
      shell: bash
      env:
        SOPS_VERSION: ${{ inputs.sops-version }}
        # Git Bash on windows-latest runners mangles backslash-escaped
        # characters when an argument is forwarded to a native (non-MSYS)
        # .exe — cosign.exe's --certificate-identity-regexp arrives with
        # every `\.` rewritten to `/.`, which cosign then rejects as a
        # non-matching identity. MSYS2_ARG_CONV_EXCL='*' disables that
        # argv-conversion heuristic for this step; no-op on Linux/macOS.
        MSYS2_ARG_CONV_EXCL: '*'
      run: |
        set -euo pipefail
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)     ASSET="sops-v${SOPS_VERSION}.linux.amd64" ;;
          Linux-ARM64)   ASSET="sops-v${SOPS_VERSION}.linux.arm64" ;;
          macOS-X64)     ASSET="sops-v${SOPS_VERSION}.darwin.amd64" ;;
          macOS-ARM64)   ASSET="sops-v${SOPS_VERSION}.darwin.arm64" ;;
          Windows-X64)   ASSET="sops-v${SOPS_VERSION}.amd64.exe" ;;
          Windows-ARM64) ASSET="sops-v${SOPS_VERSION}.arm64.exe" ;;
          *)
            echo "❌ Unsupported runner ${{ runner.os }}-${{ runner.arch }} for sops install"
            exit 1
            ;;
        esac

        BASE_URL="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}"
        WORKDIR="${RUNNER_TEMP}/sops-install"
        mkdir -p "$WORKDIR"
        cd "$WORKDIR"

        curl -sSfL -o "$ASSET" "${BASE_URL}/${ASSET}"
        curl -sSfL -o checksums.txt "${BASE_URL}/sops-v${SOPS_VERSION}.checksums.txt"
        curl -sSfL -o checksums.sigstore.json "${BASE_URL}/sops-v${SOPS_VERSION}.checksums.sigstore.json"

        cosign verify-blob \
          --certificate-identity-regexp "^https://github\.com/getsops/sops/\.github/workflows/release\.yml@refs/tags/v${SOPS_VERSION}\$" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          --bundle checksums.sigstore.json \
          checksums.txt

        EXPECTED=$(grep " ${ASSET}\$" checksums.txt | awk '{print $1}')
        if [ -z "$EXPECTED" ]; then
          echo "❌ ${ASSET} not listed in verified checksums.txt"
          exit 1
        fi
        ACTUAL=$(sha256sum "$ASSET" | awk '{print $1}')
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "❌ Checksum mismatch for ${ASSET}: expected $EXPECTED, got $ACTUAL"
          exit 1
        fi

        if [ "${{ runner.os }}" = "Windows" ]; then
          cp "$ASSET" "${RUNNER_TEMP}/sops.exe"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
        else
          sudo cp "$ASSET" /usr/local/bin/sops
          sudo chmod +x /usr/local/bin/sops
        fi
