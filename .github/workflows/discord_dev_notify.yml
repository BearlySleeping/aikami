name: Discord Dev Notifications

# Posts a "PR merged" summary to #merged — separate from release.yml's
# notify-discord job (that's release announcements, this is "here's what
# shipped" for day-to-day merges). See scripts/src/lib/deploy/discord_dev_notify.ts.
#
# TASK 4 narrowed this to `pull_request: [closed]` only (was
# opened/closed/reopened for both PRs and issues): the #pull-requests
# firehose covering every PR action — including ones from forks, which this
# workflow can't see secrets for either way — is now GitHub's own native
# Discord integration (TASK 4d's setup checklist), not this workflow. This
# one only needs to fire once, when a PR actually merges, to post the
# curated summary to #merged.
#
# Deliberately plain `pull_request` (not `pull_request_target`): secrets
# aren't available to workflows triggered by a PR from a fork, so a merged
# fork PR just silently doesn't get a #merged summary
# (discord_dev_notify.ts no-ops without WORKER_NOTIFY_SECRET). That gap is
# now acceptable in a way it wasn't before TASK 4d — #pull-requests' native
# integration already shows that PR's full lifecycle (including its merge)
# regardless of fork origin, so #merged missing a fork-authored entry is a
# curation gap, not a visibility gap. `pull_request_target` remains the
# wrong tool to close it even so, since it's easy to misuse later.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
jobs:
  notify:
    name: Announce Merged PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2 # zizmor: ignore[unpinned-uses] to be pinned to SHA by Renovate (C-440 AC-4)
        with:
          bun-version-file: .bun-version

      - name: Announce merged PR
        shell: bash
        run: bun scripts/src/lib/deploy/discord_dev_notify.ts
        env:
          WORKER_NOTIFY_SECRET: ${{ secrets.WORKER_NOTIFY_SECRET }}
          GH_NUMBER: ${{ github.event.pull_request.number }}
          GH_TITLE: ${{ github.event.pull_request.title }}
          GH_URL: ${{ github.event.pull_request.html_url }}
          GH_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_FILES_CHANGED: ${{ github.event.pull_request.changed_files }}
          GH_ADDITIONS: ${{ github.event.pull_request.additions }}
          GH_DELETIONS: ${{ github.event.pull_request.deletions }}
          GH_MERGE_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.merge_commit_sha }}
