name: PR Checks

# Now that cloudbuild.yaml is retired, this workflow is the sole home for
# PR validation. Runs `moon ci` against the base branch — lint, format,
# typecheck, and unit tests for everything affected by the PR's diff.
# Never deploys anything.
#
# Workflow/action linting lives in workflow-lint.yml (path-gated on
# `.github/**`), not here.
#
# Expensive suites (Tauri desktop build, E2E/Playwright tests) are excluded
# from the default graph via `runInCI: false` in their respective moon.yml
# files. To run them on demand, use workflow_dispatch with include-heavy=true
# or add the "run-heavy" label to a PR.
#
# Failure reporting: `moon ci` streams ~300 targets' native output into one
# multi-thousand-line log, so the step that runs it deliberately does NOT
# decide the job's fate. It is captured with `tee` and handed to
# scripts/src/lib/ci/report.ts, which parses every tool's diagnostics
# (biome, tsc/tsgo, svelte-check, the guard scripts, bun test) into one
# structured set and emits three things: inline PR annotations, a grouped
# job summary, and a sticky PR comment carrying a copy-pasteable
# "🤖 Prompt for AI agents" block. A final step then fails the job off the
# moon step's own outcome — so a parser bug can never flip a red build green.
on:
  push:
    branches: [main]
  pull_request:
    # `reopened` and `ready_for_review` matter because draft PRs are skipped
    # below — without them, marking a PR ready would never trigger the gate.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      include-heavy:
        description: "Run heavy suites (Tauri build + E2E tests) in addition to the default check"
        type: boolean
        default: false

concurrency:
  # Unlike the release workflow, it's safe (and desirable) to cancel a
  # stale in-progress check when a new commit lands on the same PR — or on
  # main, where only the tip commit's result is interesting.
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Moon CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only for the sticky PR comment. Scoped to this job so the heavy
      # matrix — which reports to the job summary alone — cannot write to a PR.
      # A fork PR gets a read-only token regardless; that comment step is
      # skipped there and the job summary still carries the whole report.
      pull-requests: write
    # Gate the whole JOB, not just the moon step. The `labeled` event
    # re-triggers this workflow on every label change; skipping only the step
    # still paid for a runner, a full-history checkout and a `bun install`
    # (~55s) to do nothing. Drafts are skipped entirely — `ready_for_review`
    # brings them back.
    if: >-
      github.event.pull_request.draft != true &&
      (github.event.action != 'labeled' ||
       contains(github.event.pull_request.labels.*.name, 'run-heavy'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # moon needs history to diff against the base branch.
          # (A `filter: blob:none` partial clone would shave ~3s off the
          # measured 5s checkout, but changes how moon's git diff resolves
          # blobs for rename detection. Not worth the behavioural risk for 3s.)
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          moon-cache: "true"
          install-deps: "true"
          # Restore-only on PRs. The moon cache key is rolling (SHA-based), so
          # it is written on EVERY run — ~20s of post-job time even when moon
          # had nothing to do — and a PR branch's entry is readable only by
          # that same PR while still competing for the repo-wide 10 GB budget.
          # Pushes to main keep saving, so PRs always have a warm entry to
          # restore from via the `-moon-<workflow>-` restore-key prefix.
          moon-cache-save: ${{ github.event_name == 'push' && 'true' || 'false' }}

      - name: Run Moon CI (default check)
        id: moon
        # 🔴 The gate's verdict comes from this step's `outcome`, applied by
        # the "Enforce Moon CI result" step at the end. Letting it fail the
        # job here would skip the reporting steps and leave the PR with
        # nothing but "Process completed with exit code 1".
        continue-on-error: true
        env:
          # For pull_request events, diff against the target branch.
          # For push/workflow_dispatch, diff against main (no PR context).
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          # Astro sites need these for static builds
          PUBLIC_APP_ID: site
          PUBLIC_MODE: development
          # 🔴 report.ts is the SINGLE annotator. Two things make that true:
          #   - AIKAMI_CI_ANNOTATIONS=off mutes gha_annotate.ts (the guards and
          #     typecheck_svelte.ts), which would otherwise emit `::error`
          #     workflow commands that moon re-prints un-prefixed in its REVIEW
          #     block, giving GitHub a second annotation for the same problem.
          #   - biome runs with `concise`, NOT `github`, for the same reason —
          #     the github reporter emits those same workflow commands.
          # Everything therefore reaches GitHub exactly once, through the
          # parsed, deduped set. `concise` also collapses biome's code frames
          # to one line per diagnostic, which shortens the log considerably.
          AIKAMI_CI_ANNOTATIONS: "off"
          AIKAMI_BIOME_REPORTER: concise
        run: |
          set -o pipefail
          bun moon ci --base="origin/$BASE_REF" 2>&1 | tee "$RUNNER_TEMP/moon-ci.log"

      # `always()` rather than `failure()` so a green run refreshes a stale
      # red comment. Skipped on cancellation: a half-written log would be
      # reported as a genuine failure.
      - name: Build failure report
        if: always() && steps.moon.outcome != 'cancelled'
        env:
          # For a pull_request event GITHUB_SHA is the ephemeral merge commit,
          # which has no browsable blob URL — permalinks must use the head SHA.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_STATUS: ${{ steps.moon.outcome }}
        run: |
          bun run scripts/src/lib/ci/report.ts \
            --log "$RUNNER_TEMP/moon-ci.log" \
            --status "$CHECK_STATUS" \
            --annotate \
            --summary "$GITHUB_STEP_SUMMARY" \
            --comment "$RUNNER_TEMP/pr-comment.md"

      # Fork PRs carry a read-only token, so skip rather than fail loudly on a
      # 403 nobody can act on. Never fatal either way — a missing comment must
      # not turn a passing gate red.
      - name: Update sticky PR comment
        if: >-
          always() &&
          steps.moon.outcome != 'cancelled' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHECK_STATUS: ${{ steps.moon.outcome }}
        run: bun run scripts/src/lib/ci/post_pr_comment.ts --body "$RUNNER_TEMP/pr-comment.md"

      - name: Enforce Moon CI result
        if: steps.moon.outcome != 'success'
        run: |
          echo "moon ci failed — see the job summary above for the parsed diagnostics."
          exit 1

  # Heavy suites run as their own job so they execute IN PARALLEL with the
  # default gate (previously they were extra steps that only started after
  # moon ci finished), and as a matrix so the Tauri build and the Playwright
  # run do not serialize behind each other either.
  heavy:
    name: Heavy — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.include-heavy) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft != true &&
       contains(github.event.pull_request.labels.*.name, 'run-heavy'))
    strategy:
      fail-fast: false # one suite failing should not hide the other's result
      matrix:
        suite: [client:tauri-build, e2e:test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          moon-cache: "true"
          install-deps: "true"
          moon-cache-save: "false" # heavy runs are label/dispatch-triggered, never the warm-cache source

      # Only the e2e leg needs these; the Tauri leg shares the job definition.
      #
      # herdr is deliberately NOT used here. It is a nix flake input (a Rust
      # binary), so a runner would have to install nix or build it just to get
      # it on PATH — and everything herdr is good at (detachable panes that
      # outlive a client, named tabs an agent can read back, one workspace per
      # contract) is worth nothing to a one-shot job that dies with the
      # runner. Playwright's own `webServer` block starts the same servers,
      # polls them for readiness and tears them down; see
      # apps/e2e/playwright.config.ts.
      - name: Install Playwright browsers
        if: matrix.suite == 'e2e:test'
        run: bunx playwright install --with-deps chromium firefox

      # The e2e servers serve BUILT output, so build before Playwright starts
      # them. Through moon, so these hit the same cache the gate warmed.
      # hub:db-migrate-local creates the local D1 the hub worker binds to —
      # without it every hub /api route 500s.
      - name: Build apps under test
        if: matrix.suite == 'e2e:test'
        env:
          PUBLIC_APP_ID: site
          PUBLIC_MODE: development
        run: bun moon run client:build site:build hub:build hub:db-migrate-local

      - name: Run ${{ matrix.suite }}
        id: suite
        continue-on-error: true
        env:
          SUITE: ${{ matrix.suite }}
          AIKAMI_CI_ANNOTATIONS: "off"
          AIKAMI_BIOME_REPORTER: concise
        run: |
          set -o pipefail
          bun moon run "$SUITE" 2>&1 | tee "$RUNNER_TEMP/moon-heavy.log"

      # Job summary only, no PR comment: both matrix legs would race for the
      # same sticky comment and clobber each other's body.
      - name: Build failure report
        if: always() && steps.suite.outcome != 'cancelled'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_STATUS: ${{ steps.suite.outcome }}
        run: |
          bun run scripts/src/lib/ci/report.ts \
            --log "$RUNNER_TEMP/moon-heavy.log" \
            --status "$CHECK_STATUS" \
            --annotate \
            --summary "$GITHUB_STEP_SUMMARY"

      # Traces, screenshots and video are the whole reason a failed e2e run is
      # debuggable after the fact — the report parser can only see stdout.
      - name: Upload Playwright artifacts
        if: always() && matrix.suite == 'e2e:test' && steps.suite.outcome != 'success'
        uses: actions/upload-artifact@v5 # zizmor: ignore[unpinned-uses] actions/* are exempt per C-440
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Enforce ${{ matrix.suite }} result
        if: steps.suite.outcome != 'success'
        run: exit 1
