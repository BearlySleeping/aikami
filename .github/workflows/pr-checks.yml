name: PR Checks

# Now that cloudbuild.yaml is retired, this workflow is the sole home for
# PR validation. Runs `moon ci` against the base branch — lint, format,
# typecheck, and unit tests for everything affected by the PR's diff.
# Never deploys anything.
#
# Expensive suites (Tauri desktop build, E2E/Playwright tests) are excluded
# from the default graph via `runInCI: false` in their respective moon.yml
# files. To run them on demand, use workflow_dispatch with include-heavy=true
# or add the "run-heavy" label to a PR.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      include-heavy:
        description: 'Run heavy suites (Tauri build + E2E tests) in addition to the default check'
        type: boolean
        default: false

concurrency:
  # Unlike the release workflow, it's safe (and desirable) to cancel a
  # stale in-progress check when a new commit lands on the same PR.
  group: pr-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # actionlint v1.7.7 — static analysis for GitHub Actions workflows
      # https://github.com/rhysd/actionlint
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1.7.7
        with:
          actionlint_flags: "-color"
          # shellcheck is required for AC-2: shell defects in run: blocks
          # actionlint silently skips shell analysis when shellcheck is absent
          shellcheck_flags: "-x"
          fail_level: error
          filter_mode: no_filter
          reporter: github-pr-check

      # zizmor v1.29.0 — security audit for GitHub Actions workflows
      # https://github.com/woodruffw/zizmor
      - name: Install zizmor
        run: pip install zizmor==1.29.0

      - name: Run zizmor
        run: zizmor --pedantic .github/

  validate:
    name: Moon CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # moon needs history to diff against the base branch

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          moon-cache: "true"
          install-deps: "true"

      # Skip the default check when only a label was added (the labeled event
      # re-triggers the workflow; only run-heavy should re-run the full gate).
      - name: Run Moon CI (default check)
        if: ${{ github.event.action != 'labeled' || contains(github.event.pull_request.labels.*.name, 'run-heavy') }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          # For pull_request events, diff against the target branch.
          # For workflow_dispatch, diff against main (no PR context).
          bun moon ci --base="origin/$BASE_REF"

      - name: Run heavy suites (Tauri build + E2E)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.include-heavy) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-heavy')) }}
        run: |
          bun moon run client:tauri-build
          bun moon run e2e:test
