name: PR Checks

# Now that cloudbuild.yaml is retired, this workflow is the sole home for
# PR validation. Runs `moon ci` against the base branch — lint, format,
# typecheck, and unit tests for everything affected by the PR's diff.
# Never deploys anything.
#
# Expensive suites (Tauri desktop build, E2E/Playwright tests) are excluded
# from the default graph via `runInCI: false` in their respective moon.yml
# files. To run them on demand, use workflow_dispatch with include-heavy=true.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include-heavy:
        description: 'Run heavy suites (Tauri build + E2E tests) in addition to the default check'
        type: boolean
        default: false

concurrency:
  # Unlike the release workflow, it's safe (and desirable) to cancel a
  # stale in-progress check when a new commit lands on the same PR.
  group: pr-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Moon CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # moon needs history to diff against the base branch

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Restore Bun & Moon build caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .moon/cache
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/moon.yml', '**/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Moon CI (default check)
        run: |
          export MOON_TOOLCHAIN_FORCE_GLOBALS=true
          # For pull_request events, diff against the target branch.
          # For workflow_dispatch, diff against main (no PR context).
          BASE="origin/${{ github.event.pull_request.base.ref || 'main' }}"
          bun moon ci --base="$BASE"

      - name: Run heavy suites (Tauri build + E2E)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include-heavy == 'true' }}
        run: |
          export MOON_TOOLCHAIN_FORCE_GLOBALS=true
          bun moon run client:tauri-build
          bun moon run e2e:test
