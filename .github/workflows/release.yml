name: Release

# ── Config ──────────────────────────────────────────────────────────────
# DEPLOY_APPS controls which apps this pipeline touches:
#   "client-tauri"                      → desktop release only (default)
#   "client client-tauri site firebase" → desktop + web + backend
#   "all"                                → everything in DEPLOYABLE_APPS
#
# Triggers:
#   release: published  → real production cut. Desktop artifacts are
#                          uploaded straight to the GitHub Release that
#                          triggered this run (`gh release upload`).
#   workflow_dispatch    → manual run (staging QA, re-deploy, force
#                          rebuild). No public Release exists to attach to,
#                          so desktop artifacts are attached to the
#                          *workflow run* instead (Actions tab, 14-day
#                          retention) — visible to the team, not the public.
#
# Desktop pipeline shape (client-tauri only):
#   plan       → runs ci_planning.ts ONCE: checksum + shared version +
#                platform/bundle filtering + per-leg build/reuse/skip decision
#                (emits the dynamic matrix; unchanged-checksum releases get
#                reuse legs that copy prior artifacts instead of recompiling).
#   build-web  → builds the OS-independent SvelteKit bundle ONCE with the
#                plan's version string, uploads it for the matrix legs.
#   deploy-desktop → one job per matrix leg (runs-on from the plan):
#                build legs compile with the shared web bundle; reuse legs
#                just copy artifacts between releases on ubuntu-latest.
#   update-manifest → (release: published only) merges each leg's updater
#                fragment into a single latest.json on the triggering release.
# ────────────────────────────────────────────────────────────────────────
env:
  DEPLOY_APPS: "client-tauri"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Deployment Target Environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      force:
        description: "Bypass Redis checksum cache (--force)"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Comma-separated platforms to build (linux,windows,macos). Empty = all"
        required: false
        type: string
        default: ""
      bundles:
        description: "Comma-separated bundle targets (appimage,deb,rpm,msi,dmg). Empty = platform defaults"
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-${{ github.event.inputs.mode || 'production' }}
  cancel-in-progress: false

permissions:
  contents: write # required for `gh release upload` / `gh release download`

jobs:
  # ── Preflight: materialize DEPLOY_APPS for job-level `if` ───────────
  # GitHub Actions does NOT expose the `env` context to job-level `if:`
  # conditions (only step-level) — a workflow using it fails to parse
  # ("Unrecognized named-value: 'env'") and never runs. This tiny job
  # re-exports the workflow-level env var as a job output so downstream
  # jobs can gate on it via the `needs` context, which IS allowed.
  resolve-apps:
    name: Resolve Deploy Apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_apps: ${{ steps.apps.outputs.deploy_apps }}
    steps:
      - name: Read DEPLOY_APPS
        id: apps
        run: echo "deploy_apps=$DEPLOY_APPS" >> "$GITHUB_OUTPUT"

  # ── Plan (compute): checksum + version + cache read ───────────────
  # Touches GCP secrets (download_secrets). Emits ONLY brace-free outputs
  # (checksum/version/cached state) — the JSON matrix is computed in the
  # separate plan-matrix job below because GitHub Actions silently drops any
  # job output containing a masked substring, and using the multiline JSON
  # GCP_SA_KEY secret here registers `{`/`}` as masked characters (which
  # would strip a JSON matrix output).
  plan:
    name: Plan Desktop Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: resolve-apps
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: contains(needs.resolve-apps.outputs.deploy_apps, 'client-tauri') || needs.resolve-apps.outputs.deploy_apps == 'all'
    outputs:
      checksum: ${{ steps.plan.outputs.checksum }}
      version: ${{ steps.plan.outputs.version }}
      cached_checksum: ${{ steps.plan.outputs.cached_checksum }}
      cached_release_tag: ${{ steps.plan.outputs.cached_release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # The checksum hashes apps/frontend/client/.env.{mode}, so the env file
      # must exist before planning. --strict fails loudly on missing secrets.
      - name: Download Secrets from GCP Secret Manager
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/download_secrets.ts --mode="$MODE" --strict scripts client-tauri

      # ── Single secrets fetch, shared with every desktop job ─────────
      # Every desktop job needs the same .env.{mode} files. Fetching per-job
      # spawned concurrent `gcloud secrets` processes that collide on gcloud's
      # config/token cache (Windows file-lock). Fetch ONCE here and hand the
      # files down via Upstash Redis (per-run key, 4h TTL) — the repo is
      # PUBLIC, so no env content may ride in downloadable workflow artifacts.
      # Downstream jobs restore the files with env_share.ts --get.
      - name: Share env files via Redis
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/env_share.ts --mode="$MODE" --put

      - name: Compute checksum + version
        id: plan
        shell: bash
        run: bun scripts/src/lib/deploy/ci_planning.ts --mode="$MODE"
        env:
          MODE: ${{ github.event.inputs.mode || 'production' }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  # ── Plan-matrix: build/skip/reuse decisions → the JSON matrix ─────
  # Deliberately NO secret references (no GCP auth, no download_secrets) so
  # GitHub's masker never registers `{`/`}` here and the JSON matrix output
  # survives. All state comes in as plain strings from the plan job.
  plan-matrix:
    name: Decide Desktop Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: plan
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
      needs_build: ${{ steps.decide.outputs.needs_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Decide matrix
        id: decide
        shell: bash
        run: |
          bun scripts/src/lib/deploy/ci_planning.ts --mode="$MODE" --decide \
            --checksum="${{ needs.plan.outputs.checksum }}" \
            --version="${{ needs.plan.outputs.version }}" \
            --cached-checksum="${{ needs.plan.outputs.cached_checksum }}" \
            --cached-release-tag="${{ needs.plan.outputs.cached_release_tag }}" \
            --platforms="$PLATFORMS" --bundles="$BUNDLES" $FORCE_FLAG
        env:
          MODE: ${{ github.event.inputs.mode || 'production' }}
          PLATFORMS: ${{ github.event.inputs.platforms }}
          BUNDLES: ${{ github.event.inputs.bundles }}
          FORCE_FLAG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Shared web build (once, OS-independent) ────────────────────────
  # The SvelteKit bundle is embedded inside every desktop binary, so build it
  # a single time with the plan's version string — previously each matrix leg
  # rebuilt it independently, racing to different PUBLIC_APP_VERSION values.
  build-web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan, plan-matrix]
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.plan-matrix.result == 'success' && needs.plan-matrix.outputs.needs_build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Restore Bun & Moon build caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            .moon/cache
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/moon.yml', '**/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore env files from Redis
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/env_share.ts --mode="$MODE" --get
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}

      - name: Build web bundle
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bunx moon run client:build -- --mode "$MODE"
        env:
          PUBLIC_APP_VERSION: ${{ needs.plan.outputs.version }}
          # moon's toolchain would otherwise try to provision its own bun via
          # proto in CI — force global tools (same as pr-checks.yml).
          MOON_TOOLCHAIN_FORCE_GLOBALS: "true"

      - name: Upload shared web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build-${{ github.run_id }}
          path: apps/frontend/client/build
          # Zipped on purpose: ~13k files, and upload-artifact v7's
          # `archive: false` only supports a SINGLE file per artifact.
          # download-artifact@v8 unzips transparently on the matrix legs.
          if-no-files-found: error
          retention-days: 1

  # ── Desktop releases (dynamic matrix from the plan job) ────────────
  # matrix.include comes from ci_planning.ts: build legs run on their native
  # OS with the full toolchain; reuse legs run on ubuntu-latest and just copy
  # previously-built artifacts between releases. No per-leg "Platform gate" —
  # unneeded legs are never scheduled.
  deploy-desktop:
    name: Desktop (${{ matrix.platform }}${{ matrix.action == 'reuse' && ' — reuse' || '' }})
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 45
    needs: [plan, plan-matrix, build-web]
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.plan-matrix.result == 'success' && needs.plan-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan-matrix.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # ── Build legs only: Rust toolchain + OS deps ──────────────────
      - name: Setup Rust toolchain
        if: matrix.action == 'build'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Built-in rust-cache targets the repo ROOT (where there is no
          # Cargo.toml — its `cargo metadata` probe fails and it caches
          # ./target instead of the real one). A dedicated step below points
          # the cache at the nested Tauri workspace instead.
          cache: false
          cache-on-failure: true

      # Rust cache for the NESTED cargo workspace. Tauri compiles the full
      # wry/tao dependency tree (~15-25 min cold); caching the real target
      # dir turns subsequent runs into a few-minute incremental compile.
      - name: Cache Rust (nested Tauri workspace)
        if: matrix.action == 'build'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/frontend/client/src-tauri"
          cache-on-failure: true

      # Plain apt install instead of cache-apt-pkgs-action: the action's cache
      # was saved empty (6KB manifest, no .debs) on the first run, so every
      # subsequent run restored nothing and cargo failed on missing system
      # libs (gobject-2.0 etc.). The workflow runs rarely — a direct install
      # is simpler and cannot go stale. Tauri v2 Ubuntu 24.04 prerequisite set.
      - name: Install Linux system dependencies
        if: matrix.action == 'build' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl wget file

      # ── Env files for the leg (REDIS creds for the deploy cache) ──
      # Downloaded from the plan job's encrypted artifact — no per-leg GSM
      # fetch (avoids concurrent-gcloud file-lock races, see plan job).
      # build legs need @tauri-apps/cli, so they also run bun install below.
      - name: Restore Bun & Moon build caches
        if: matrix.action == 'build'
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            .moon/cache
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/moon.yml', '**/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-

      - name: Install dependencies
        if: matrix.action == 'build'
        run: bun install --frozen-lockfile

      - name: Restore env files from Redis
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/env_share.ts --mode="$MODE" --get
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}

      # ── Build legs only: consume the shared web bundle ─────────────
      - name: Download shared web build
        if: matrix.action == 'build'
        uses: actions/download-artifact@v8
        with:
          name: web-build-${{ github.run_id }}
          path: apps/frontend/client/build

      # ── Run the leg (build or reuse) ───────────────────────────────
      # macOS ships a UNIVERSAL binary (arm64 + x86_64 lipo'd together) so
      # both the darwin-aarch64 and darwin-x86_64 updater channels resolve;
      # the extra rust target is installed right before the build.
      - name: Add Intel macOS target (universal build)
        if: matrix.action == 'build' && matrix.platform == 'macos'
        run: rustup target add x86_64-apple-darwin

      - name: Run Desktop Leg
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/deploy/ci_run.ts \
            --mode="$MODE" \
            --version="${{ needs.plan.outputs.version }}" \
            --checksum="${{ needs.plan.outputs.checksum }}"
        env:
          LEG: ${{ toJson(matrix) }}
          CI: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_TARGET: ${{ matrix.platform == 'macos' && 'universal-apple-darwin' || '' }}
          # Updater signing key. Scoped to the desktop build step ONLY — the
          # SvelteKit web build (build-web job) never sees it, and the
          # client's vite envPrefix is ['PUBLIC_'] so TAURI_* could not reach
          # the frontend bundle anyway (GHSA-2rcp-jvr4-r259 safe).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Updater fragment for this leg (release runs only) — the
      # update-manifest job merges all fragments into latest.json.
      - name: Upload updater fragment
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v7
        with:
          name: updater-fragments-${{ matrix.platform }}
          path: updater-fragments
          if-no-files-found: ignore
          retention-days: 14

      # Workflow-dispatch / staging only: no public Release exists, so attach
      # the raw bundle files to the run. One artifact PER FILE with
      # `archive: false` (v7 limitation: single file per unzipped artifact) —
      # users download exactly the installer they need, no zip wrapping. When
      # RELEASE_TAG is set, ci_run.ts already uploaded them to the release.
      - name: Upload Linux AppImage
        if: matrix.action == 'build' && env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: tauri-linux-appimage
          path: '**/target/**/bundle/appimage/*.appimage'
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Linux deb
        if: matrix.action == 'build' && env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: tauri-linux-deb
          path: '**/target/**/bundle/deb/*.deb'
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Linux rpm
        if: matrix.action == 'build' && env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: tauri-linux-rpm
          path: '**/target/**/bundle/rpm/*.rpm'
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows nsis (exe)
        if: matrix.action == 'build' && env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: tauri-windows-nsis
          path: '**/target/**/bundle/nsis/*.exe'
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload macOS dmg
        if: matrix.action == 'build' && env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: tauri-macos-dmg
          path: '**/target/**/bundle/dmg/*.dmg'
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload macOS updater archive
        if: matrix.action == 'build' && env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: tauri-macos-updater
          path: '**/target/**/bundle/macos/*.app.tar.gz'
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload signature files
        if: matrix.action == 'build' && env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: tauri-signatures
          path: '**/target/**/bundle/**/*.sig'
          archive: false
          if-no-files-found: ignore
          retention-days: 14

  # ── Update manifest (release runs only) ──────────────────────────
  # Merge the per-platform updater fragments every leg emitted into a single
  # latest.json and attach it to the triggering release. GitHub's
  # releases/latest/download/latest.json URL then always resolves to the
  # newest release's manifest, which is what the in-app updater polls.
  #
  # Gated on the matrix being non-empty (not needs_build): a pure-reuse run
  # still re-attaches artifacts to the new release and needs a manifest there
  # too, or clients would 404 on the newest release.
  update-manifest:
    name: Generate Update Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan-matrix, deploy-desktop]
    if: github.event_name == 'release' && needs.plan-matrix.result == 'success' && needs.plan-matrix.outputs.matrix != '[]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Read Cargo.toml from the release's own commit so the manifest
          # version always matches the artifact that was built for it.
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Download updater fragments
        uses: actions/download-artifact@v8
        with:
          pattern: updater-fragments-*
          path: updater-fragments-merged
          merge-multiple: true

      - name: Merge + upload latest.json
        shell: bash
        run: |
          bun scripts/src/lib/deploy/updater_manifest.ts --merge \
            --fragments-dir="updater-fragments-merged" \
            --release-tag="${{ github.event.release.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Web & backend deploys (singleton, runs in parallel with desktop) ─
  deploy-web:
    name: Web & Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resolve-apps
    # Same per-environment GCP_SA_KEY resolution as deploy-desktop.
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.resolve-apps.outputs.deploy_apps != 'client-tauri'
    steps:
      - name: Compute web deploy apps
        id: apps
        run: |
          DEPLOY_APPS="${{ env.DEPLOY_APPS }}"
          if [ "$DEPLOY_APPS" = "all" ]; then
            echo "web_apps=client site firebase" >> "$GITHUB_OUTPUT"
          else
            WEB=$(echo "$DEPLOY_APPS" | tr ' ' '\n' | grep -v 'client-tauri' | tr '\n' ' ')
            echo "web_apps=$WEB" >> "$GITHUB_OUTPUT"
          fi

      # Every step below is explicitly gated on web_apps being non-empty.
      # The original version only printed "skipping" and exited 0 on an
      # empty list — that does NOT stop the rest of the job. Checkout, GCP
      # auth, and dependency install were all still running (and billing
      # minutes) on runs with nothing to deploy. Fixed here.
      - name: Checkout repository
        if: steps.apps.outputs.web_apps != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        if: steps.apps.outputs.web_apps != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Authenticate to Google Cloud
        if: steps.apps.outputs.web_apps != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        if: steps.apps.outputs.web_apps != ''
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: steps.apps.outputs.web_apps != ''
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Restore Bun & Moon build caches
        if: steps.apps.outputs.web_apps != ''
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            .moon/cache
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/moon.yml', '**/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-

      - name: Install dependencies
        if: steps.apps.outputs.web_apps != ''
        run: bun install --frozen-lockfile

      - name: Download Secrets from GCP Secret Manager
        if: steps.apps.outputs.web_apps != ''
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/download_secrets.ts --mode="$MODE" --strict scripts ${{ steps.apps.outputs.web_apps }}

      - name: Run Web Deploy Pipeline
        if: steps.apps.outputs.web_apps != ''
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          FORCE_FLAG="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          bun scripts/src/lib/deploy/index.ts --yes --mode="$MODE" $FORCE_FLAG ${{ steps.apps.outputs.web_apps }}
        env:
          CI: "true"
