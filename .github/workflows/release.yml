name: Release

# ── Config ──────────────────────────────────────────────────────────────
# DEPLOY_APPS controls which apps this pipeline touches:
#   "client-tauri"                      → desktop release only (default)
#   "client client-tauri site firebase" → desktop + web + backend
#   "all"                                → everything in DEPLOYABLE_APPS
# ────────────────────────────────────────────────────────────────────────
env:
  DEPLOY_APPS: "client-tauri"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Deployment Target Environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      force:
        description: "Bypass Redis checksum cache (--force)"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Comma-separated platforms to build (linux,windows,macos). Empty = all"
        required: false
        type: string
        default: ""
      bundles:
        description: "Comma-separated bundle targets (appimage,deb,rpm,msi,dmg). Empty = platform defaults"
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-${{ github.event.inputs.mode || 'production' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve-apps:
    name: Resolve Deploy Apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_apps: ${{ steps.apps.outputs.deploy_apps }}
    steps:
      - name: Read DEPLOY_APPS
        id: apps
        run: echo "deploy_apps=$DEPLOY_APPS" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan Desktop Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: resolve-apps
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: contains(needs.resolve-apps.outputs.deploy_apps, 'client-tauri') || needs.resolve-apps.outputs.deploy_apps == 'all'
    outputs:
      checksum: ${{ steps.plan.outputs.checksum }}
      version: ${{ steps.plan.outputs.version }}
      cached_checksum: ${{ steps.plan.outputs.cached_checksum }}
      cached_release_tag: ${{ steps.plan.outputs.cached_release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Download Secrets from GCP Secret Manager
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/download_secrets.ts --mode="$MODE" --strict scripts client-tauri

      - name: Compute checksum + version
        id: plan
        shell: bash
        run: bun scripts/src/lib/deploy/ci_planning.ts --mode="$MODE"
        env:
          MODE: ${{ github.event.inputs.mode || 'production' }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  plan-matrix:
    name: Decide Desktop Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: plan
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
      needs_build: ${{ steps.decide.outputs.needs_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Decide matrix
        id: decide
        shell: bash
        run: |
          bun scripts/src/lib/deploy/ci_planning.ts --mode="$MODE" --decide \
            --checksum="${{ needs.plan.outputs.checksum }}" \
            --version="${{ needs.plan.outputs.version }}" \
            --cached-checksum="${{ needs.plan.outputs.cached_checksum }}" \
            --cached-release-tag="${{ needs.plan.outputs.cached_release_tag }}" \
            --platforms="$PLATFORMS" --bundles="$BUNDLES" $FORCE_FLAG
        env:
          MODE: ${{ github.event.inputs.mode || 'production' }}
          PLATFORMS: ${{ github.event.inputs.platforms }}
          BUNDLES: ${{ github.event.inputs.bundles }}
          FORCE_FLAG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan-matrix
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.plan-matrix.result == 'success' && needs.plan-matrix.outputs.needs_build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Restore Bun & Moon build caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            .moon/cache
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/moon.yml', '**/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Secrets from GCP Secret Manager
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/download_secrets.ts --mode="$MODE" --strict client-tauri

      - name: Build web bundle
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bunx moon run client:build -- --mode "$MODE"
        env:
          PUBLIC_APP_VERSION: ${{ needs.plan.outputs.version }}
          MOON_TOOLCHAIN_FORCE_GLOBALS: "true"

      - name: Upload shared web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build-${{ github.run_id }}
          path: apps/frontend/client/build
          if-no-files-found: error
          retention-days: 1

  deploy-desktop:
    name: Desktop (${{ matrix.platform }}${{ matrix.action == 'reuse' && ' — reuse' || '' }})
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 45
    needs: [plan, plan-matrix, build-web]
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: |
      always() &&
      needs.plan-matrix.result == 'success' &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      needs.plan-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan-matrix.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Rust toolchain
        if: matrix.action == 'build'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          cache-on-failure: true

      - name: Cache Rust (nested Tauri workspace)
        if: matrix.action == 'build'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/frontend/client/src-tauri"
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: matrix.action == 'build' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl wget file

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Restore Bun & Moon build caches
        if: matrix.action == 'build'
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            .moon/cache
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/moon.yml', '**/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-

      - name: Install dependencies
        if: matrix.action == 'build'
        run: bun install --frozen-lockfile

      - name: Download Secrets from GCP Secret Manager
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/download_secrets.ts --mode="$MODE" --strict scripts

      - name: Download shared web build
        if: matrix.action == 'build'
        uses: actions/download-artifact@v8
        with:
          name: web-build-${{ github.run_id }}
          path: apps/frontend/client/build

      - name: Run Desktop Leg
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/deploy/ci_run.ts \
            --mode="$MODE" \
            --version="${{ needs.plan.outputs.version }}" \
            --checksum="${{ needs.plan.outputs.checksum }}"
        env:
          LEG: ${{ toJson(matrix) }}
          CI: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload updater fragment
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v7
        with:
          name: updater-fragments-${{ matrix.platform }}
          path: updater-fragments
          if-no-files-found: ignore
          retention-days: 14

      # ── Dynamic Gated Staging Uploads ────────────────────────────────
      - name: Upload Linux AppImage
        if: matrix.action == 'build' && env.RELEASE_TAG == '' && matrix.platform == 'linux' && contains(matrix.bundles, 'appimage')
        uses: actions/upload-artifact@v7
        with:
          name: tauri-linux-appimage
          path: "**/target/release/bundle/appimage/*.AppImage"
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Linux deb
        if: matrix.action == 'build' && env.RELEASE_TAG == '' && matrix.platform == 'linux' && contains(matrix.bundles, 'deb')
        uses: actions/upload-artifact@v7
        with:
          name: tauri-linux-deb
          path: "**/target/release/bundle/deb/*.deb"
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Linux rpm
        if: matrix.action == 'build' && env.RELEASE_TAG == '' && matrix.platform == 'linux' && contains(matrix.bundles, 'rpm')
        uses: actions/upload-artifact@v7
        with:
          name: tauri-linux-rpm
          path: "**/target/release/bundle/rpm/*.rpm"
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows msi
        if: matrix.action == 'build' && env.RELEASE_TAG == '' && matrix.platform == 'windows' && contains(matrix.bundles, 'msi')
        uses: actions/upload-artifact@v7
        with:
          name: tauri-windows-msi
          path: "**/target/release/bundle/msi/*.msi"
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload macOS dmg
        if: matrix.action == 'build' && env.RELEASE_TAG == '' && matrix.platform == 'macos' && contains(matrix.bundles, 'dmg')
        uses: actions/upload-artifact@v7
        with:
          name: tauri-macos-dmg
          path: "**/target/release/bundle/dmg/*.dmg"
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload macOS updater archive
        if: matrix.action == 'build' && env.RELEASE_TAG == '' && matrix.platform == 'macos' && contains(matrix.bundles, 'app')
        uses: actions/upload-artifact@v7
        with:
          name: tauri-macos-updater
          path: "**/target/release/bundle/macos/*.app.tar.gz"
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload signature files
        if: matrix.action == 'build' && env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: tauri-signatures-${{ matrix.platform }}
          path: "**/target/release/bundle/**/*.sig"
          archive: false
          if-no-files-found: ignore
          retention-days: 14

  update-manifest:
    name: Generate Update Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan-matrix, deploy-desktop]
    if: github.event_name == 'release' && needs.plan-matrix.result == 'success' && needs.plan-matrix.outputs.matrix != '[]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Download updater fragments
        uses: actions/download-artifact@v8
        with:
          pattern: updater-fragments-*
          path: updater-fragments-merged
          merge-multiple: true

      - name: Merge + upload latest.json
        shell: bash
        run: |
          bun scripts/src/lib/deploy/updater_manifest.ts --merge \
            --fragments-dir="updater-fragments-merged" \
            --release-tag="${{ github.event.release.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    name: Web & Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resolve-apps
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.resolve-apps.outputs.deploy_apps != 'client-tauri'
    steps:
      - name: Compute web deploy apps
        id: apps
        run: |
          DEPLOY_APPS="${{ env.DEPLOY_APPS }}"
          if [ "$DEPLOY_APPS" = "all" ]; then
            echo "web_apps=client site firebase" >> "$GITHUB_OUTPUT"
          else
            WEB=$(echo "$DEPLOY_APPS" | tr ' ' '\n' | grep -v 'client-tauri' | tr '\n' ' ')
            echo "web_apps=$WEB" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.apps.outputs.web_apps != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        if: steps.apps.outputs.web_apps != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Authenticate to Google Cloud
        if: steps.apps.outputs.web_apps != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        if: steps.apps.outputs.web_apps != ''
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: steps.apps.outputs.web_apps != ''
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Restore Bun & Moon build caches
        if: steps.apps.outputs.web_apps != ''
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            .moon/cache
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/moon.yml', '**/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-

      - name: Install dependencies
        if: steps.apps.outputs.web_apps != ''
        run: bun install --frozen-lockfile

      - name: Download Secrets from GCP Secret Manager
        if: steps.apps.outputs.web_apps != ''
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/download_secrets.ts --mode="$MODE" --strict scripts ${{ steps.apps.outputs.web_apps }}

      - name: Run Web Deploy Pipeline
        if: steps.apps.outputs.web_apps != ''
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          FORCE_FLAG="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          bun scripts/src/lib/deploy/index.ts --yes --mode="$MODE" $FORCE_FLAG ${{ steps.apps.outputs.web_apps }}
        env:
          CI: "true"
