name: Release

# ── Config ──────────────────────────────────────────────────────────────
# DEPLOY_APPS controls which apps this pipeline touches. It is NEVER
# hardcoded at the workflow level (a prior version defaulted to
# "client-tauri" unconditionally, which silently kicked off a desktop
# build even for pushes that only touched this workflow file, and had
# nothing to do with the actual DEPLOY_APPS resolution below) — every
# event resolves it explicitly, in resolve-plan:
#   workflow_dispatch, apps input set  → exactly those apps (or "all")
#   workflow_dispatch, apps input blank→ "client-tauri" (manual desktop rebuild)
#   push (production/staging)          → moon's dependency-graph-aware
#                                         affected-project detection
#                                         (scripts/.../resolve_deploy_apps.ts),
#                                         MINUS client-tauri — desktop
#                                         releases stay deliberate, never an
#                                         automatic side effect of a web push.
#   release: published                 → "client-tauri" (a GitHub Release
#                                         IS the desktop cut)
#   any event, commit message contains
#   `deploy[...]` (see commit_parser.ts)→ that override wins over all of the
#                                         above. `deploy[all]`,
#                                         `deploy[client,site]`,
#                                         `deploy[all force]` (space- or
#                                         comma-separated app ids, optional
#                                         `force` token to bypass the
#                                         checksum-cache skip).
#
# Triggers:
#   release: published    → real production cut. Desktop artifacts are
#                            uploaded straight to the GitHub Release that
#                            triggered this run (`gh release upload`).
#   workflow_dispatch      → manual run (staging QA, re-deploy, force
#                            rebuild). No public Release exists to attach to,
#                            so desktop artifacts are attached to the
#                            *workflow run* instead (Actions tab, 14-day
#                            retention) — visible to the team, not the public.
#   push: [production,
#          staging]        → auto-deploy web apps (client, site, docs, hub),
#                            D1 migrations, and the worker VM — whichever of
#                            those moon says are actually affected (see
#                            resolve-plan; deliberately no workflow-level
#                            `paths:` filter, so a shared-package change
#                            still reaches that decision). `main` is
#                            deliberately NOT a trigger — it's the PR-review
#                            branch (CodeRabbit only
#                            reviews PRs targeting main); a deploy happens by
#                            promoting main into `production` or `staging`
#                            (merge/PR), never on every PR merge to main.
#                            Mode is derived from the branch name, not
#                            hardcoded — see resolve-plan's "Resolve
#                            deployment mode" step.
#
# Pipeline shape:
#   resolve-plan     → groups DEPLOY_APPS by serviceType (desktop,
#                      cloudflare-worker)
#                      so every job below
#                      is gated at the JOB level (`if: needs.resolve-plan...`)
#                      instead of skipping steps one at a time inside a
#                      monolithic job. Deploying only "client-tauri" (e.g. a
#                      release: published run) schedules NOTHING beyond the
#                      desktop jobs — the whole point is that the rest of
#                      the stack still deploys fine locally (`bun run
#                      deploy`) and doesn't need to burn Action minutes on
#                      every desktop release.
#   decrypt-secrets → decrypts SOPS-encrypted env files locally (C-441).
#                      No GCP auth, no Redis relay. Each job that needs
#                      secrets decrypts independently; the operation is
#                      fast (~100ms) and idempotent.
#   plan-desktop     → (client-tauri only) checksum + shared version +
#                      cached-release lookup, from the shared secrets.
#   plan-matrix      → platform/bundle filtering + per-leg build/reuse/skip
#                      decision (emits the dynamic matrix). No secrets.
#   build-web        → builds the OS-independent SvelteKit bundle ONCE with
#                      the plan's version string. Consumed by the
#                      desktop matrix legs.
#   deploy-desktop   → one job per matrix leg (runs-on from the plan): build
#                      legs compile with the shared web bundle; reuse legs
#                      just copy artifacts between releases on ubuntu-latest.
#   update-manifest  → (release: published only) merges each leg's updater
#                      fragment into a single latest.json on the triggering
#                      release.
#   deploy-cloudflare
#                    → one dedicated job per service type, each running only
#                      when resolve-plan found apps of that type. Each calls
#                      the same local orchestrator (scripts/.../deploy/index.ts)
#                      scoped to just its own apps — index.ts already handles
#                      checksum-skip, parallel deploys, and build dedup for
#                      a given set of apps, so these jobs stay thin.
#
# 🔐 Secrets (C-441): All env files are decrypted locally from SOPS-encrypted
#   secrets/<mode>.enc.env files committed to the repo. The only GitHub
#   secret needed is SOPS_AGE_KEY. No GCP auth, no Redis relay, no
#   env_share.ts.
# ────────────────────────────────────────────────────────────────────────

on:
  release:
    types: [published]
  push:
    # main is PR-review-only (CodeRabbit's base_branches in .coderabbit.yaml
    # is main, and it can only review PRs targeting main) — it never deploys.
    # A deploy happens by promoting main into `production` (or `staging`),
    # via a merge/PR, same as any other push to those branches.
    branches: [production, staging]
    # Deliberately NO `paths:` filter — a static allowlist here would
    # undermine the whole point of resolve-plan's moon-affected detection.
    # A shared-package-only push (packages/shared/logger, say) has to reach
    # resolve-plan for `moon query projects --affected --downstream=deep` to
    # even get a chance to notice every app that transitively depends on it;
    # a path filter that only knew about apps/frontend/{docs,site,hub,client}
    # would silently exclude exactly that case. resolve-plan itself is cheap
    # (~15-30s) and correctly resolves to "nothing to deploy" (empty
    # DEPLOY_APPS) for a push that touches nothing any app's build depends
    # on, at which point every downstream job's `if:` gate skips for free —
    # so the cost of removing this filter is one lightweight job, not a
    # runaway pipeline.
  workflow_dispatch:
    inputs:
      mode:
        description: "Deployment Target Environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      apps:
        description: "Apps to deploy (space-separated). Default: client-tauri"
        required: false
        default: ""
        type: string
      force:
        description: "Bypass Redis checksum cache (--force)"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Comma-separated platforms to build (linux,windows,macos). Empty = all"
        required: false
        default: ""
        type: string
      bundles:
        description: "Comma-separated bundle targets (appimage,nsis,app,dmg) — deb/rpm/msi aren't in PLATFORM_DEFAULTS (see ci_planning.ts). Empty = platform defaults"
        required: false
        default: ""
# Two independent queues, because the two trigger kinds want opposite
# behaviour:
#
#   push to production/staging → a web deploy. Ten merges in an hour must NOT
#                   become a multi-hour backlog of deploys that were already
#                   superseded. Deploying an intermediate commit is pointless
#                   when the next one lands seconds later, so cancel.
#   release/manual → a real production cut, including desktop legs that
#                   upload artifacts to a GitHub Release. Cancelling one
#                   mid-upload leaves a half-published release, so never.
#
# Separate groups matter as much as the flag: with one shared group a routine
# push would sit behind (or cancel) a desktop release cut.
concurrency:
  # Mode here must be computable from workflow-trigger context alone — the
  # `needs.resolve-plan.outputs.mode` job output isn't available yet at
  # concurrency-evaluation time. release/workflow_dispatch match
  # resolve-plan's own logic (production default, or the dispatch input);
  # push derives it from the branch name, same as resolve-plan does.
  group: deploy-${{ github.event.inputs.mode || (github.event_name == 'push' && github.ref_name == 'staging' && 'staging') || 'production' }}-${{ github.event_name == 'push' && 'web' || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read # elevated to write per-job where needed (update-manifest, deploy-desktop)

jobs:
  # ── Resolve plan: group DEPLOY_APPS by serviceType ─────────────────
  # GitHub Actions does NOT expose the `env` context to job-level `if:`
  # conditions (only step-level) — a workflow using it fails to parse
  # ("Unrecognized named-value: 'env'") and never runs. This job re-exports
  # DEPLOY_APPS (grouped by serviceType, via resolve_plan.ts) as job outputs
  # so downstream jobs can gate on it via the `needs` context, which IS
  # allowed. Grouping is driven by APP_CONFIG[app].serviceType, so adding a
  # new deployable app never requires touching this workflow.
  resolve-plan:
    name: 🔎 Resolve Deploy Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all_apps: ${{ steps.resolve.outputs.all_apps }}
      desktop_apps: ${{ steps.resolve.outputs.desktop_apps }}
      cloudflare_apps: ${{ steps.resolve.outputs.cloudflare_apps }}
      database_migration_apps: ${{ steps.resolve.outputs.database_migration_apps }}
      mode: ${{ steps.mode.outputs.mode }}
      worker_changed: ${{ steps.worker-changed.outputs.changed }}
      force: ${{ steps.deploy-apps.outputs.force }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The "Set DEPLOY_APPS for push events" and "Detect worker
          # changes" steps below `git diff` github.event.before against the
          # checked-out HEAD — a shallow (default depth-1) clone doesn't
          # contain `before`'s commit object at all, so that diff fails hard
          # with "fatal: bad object <sha>" (this was the actual cause behind
          # every prior push-triggered Release run failing on main).
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          # resolve_deploy_apps.ts shells out to `bun moon query …`, which
          # resolves through node_modules/.bin/moon (@moonrepo/cli) — needs
          # a real install, not just the global moon toolchain.
          install-deps: "true"

      # Single source of truth for "mode" downstream jobs read via
      # `needs.resolve-plan.outputs.mode` — keep in sync with the
      # workflow-context-only expression in the `concurrency:` group above.
      - name: Resolve deployment mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          elif [ "$EVENT_NAME" = "release" ]; then
            MODE="production"
          elif [ "$REF_NAME" = "production" ] || [ "$REF_NAME" = "staging" ]; then
            MODE="$REF_NAME"
          else
            echo "❌ Cannot resolve a deploy mode for event=$EVENT_NAME ref=$REF_NAME" >&2
            exit 1
          fi
          echo "  Resolved mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # Explicit workflow_dispatch input always wins — the person running it
      # typed exactly what they want deployed. `force` for this path is
      # handled downstream by the existing `inputs.force` checkbox (see
      # FORCE_FLAG in deploy-cloudflare/deploy-desktop), not by this job's
      # `force` output — that output is only for the commit-message override.
      - name: Set DEPLOY_APPS for workflow_dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.apps != ''
        shell: bash
        env:
          APPS: ${{ inputs.apps }}
        run: echo "DEPLOY_APPS=$APPS" >> "$GITHUB_ENV"

      - name: Default DEPLOY_APPS for workflow_dispatch (no apps given)
        if: github.event_name == 'workflow_dispatch' && inputs.apps == ''
        shell: bash
        run: echo "DEPLOY_APPS=client-tauri" >> "$GITHUB_ENV"

      # push/release: resolve_deploy_apps.ts — see the header comment block
      # at the top of this file for the full precedence rules (commit-message
      # `deploy[...]` override, then moon's dependency-graph-aware affected-
      # project detection for push, then the client-tauri default for
      # release). Writes DEPLOY_APPS to $GITHUB_ENV (consumed by the next
      # step) and this job's `force` output.
      - name: Resolve DEPLOY_APPS (push/release)
        if: github.event_name == 'push' || github.event_name == 'release'
        id: deploy-apps
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            bun scripts/src/lib/deploy/resolve_deploy_apps.ts --event=push --base="$BEFORE" --head="$AFTER"
          else
            bun scripts/src/lib/deploy/resolve_deploy_apps.ts --event=release
          fi

      - name: Resolve deploy plan
        id: resolve
        shell: bash
        run: bun scripts/src/lib/deploy/resolve_plan.ts

      # `worker` is `enabled: false` in deployment_config.ts (its own
      # build→push→restart script, not the generic per-service-type
      # pipeline resolve_plan.ts groups above) so it's never part of
      # DEPLOY_APPS/all_apps — gate its dedicated job on a plain path check
      # instead, same idea as the DEPLOY_APPS detection above but standalone.
      - name: Detect worker changes (push only)
        if: github.event_name == 'push'
        id: worker-changed
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if git diff --name-only "$BEFORE" "$AFTER" | grep -q '^apps/backend/worker/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Download secrets: decrypt SOPS-encrypted env files (C-441) ─────
  # Every job below needs the same .env.{mode} files. With the SOPS backend,
  # decryption is a local operation — no GCP auth, no Redis relay.
  # Each job decrypts independently; the operation is fast (~100ms) and
  # idempotent. The only GitHub secret needed is SOPS_AGE_KEY.
  decrypt-secrets:
    name: 🔓 Decrypt Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [resolve-plan]
    environment:
      name: ${{ needs.resolve-plan.outputs.mode }}
    if: needs.resolve-plan.outputs.all_apps != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          sops: "true"

      - name: Decrypt secrets from SOPS
        shell: bash
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          ALL_APPS: ${{ needs.resolve-plan.outputs.all_apps }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          bun scripts/src/lib/ops/decrypt_secrets.ts --mode="$MODE" --strict scripts \
            $ALL_APPS

  # ── Plan desktop: checksum + version + cache read ──────────────────
  # Decrypts secrets locally from SOPS (no GCP auth, no Redis relay).
  plan-desktop:
    name: Plan Desktop Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve-plan, decrypt-secrets]
    environment:
      name: ${{ needs.resolve-plan.outputs.mode }}
    if: needs.resolve-plan.outputs.desktop_apps != ''
    outputs:
      checksum: ${{ steps.plan.outputs.checksum }}
      version: ${{ steps.plan.outputs.version }}
      cached_checksum: ${{ steps.plan.outputs.cached_checksum }}
      cached_release_tag: ${{ steps.plan.outputs.cached_release_tag }}
      cached_version: ${{ steps.plan.outputs.cached_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          # computeAppChecksum() now shells out to `bun moon query projects`
          # (moon_graph.ts) to fold in every project client-tauri
          # transitively depends on — needs node_modules/.bin/moon.
          install-deps: "true"
          sops: "true"

      - name: Decrypt secrets from SOPS
        shell: bash
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          ALL_APPS: ${{ needs.resolve-plan.outputs.all_apps }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          bun scripts/src/lib/ops/decrypt_secrets.ts --mode="$MODE" --strict scripts \
            $ALL_APPS

      - name: Compute checksum + version
        id: plan
        shell: bash
        run: bun scripts/src/lib/deploy/ci_planning.ts --mode="$MODE"
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  # ── Plan-matrix: build/skip/reuse decisions → the JSON matrix ─────
  # Deliberately NO secret references (no download_secrets/decrypt_secrets calls) so
  # GitHub's masker never registers `{`/`}` here and the JSON matrix output
  # survives. All state comes in as plain strings from plan-desktop.
  plan-matrix:
    name: Decide Desktop Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve-plan, plan-desktop]
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
      needs_build: ${{ steps.decide.outputs.needs_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Decide matrix
        id: decide
        shell: bash
        run: |
          bun scripts/src/lib/deploy/ci_planning.ts --mode="$MODE" --decide \
            --checksum="$CHECKSUM" \
            --version="$VERSION" \
            --cached-checksum="$CACHED_CHECKSUM" \
            --cached-release-tag="$CACHED_RELEASE_TAG" \
            --cached-version="$CACHED_VERSION" \
            --platforms="$PLATFORMS" --bundles="$BUNDLES" $FORCE_FLAG
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          CHECKSUM: ${{ needs.plan-desktop.outputs.checksum }}
          VERSION: ${{ needs.plan-desktop.outputs.version }}
          CACHED_CHECKSUM: ${{ needs.plan-desktop.outputs.cached_checksum }}
          CACHED_RELEASE_TAG: ${{ needs.plan-desktop.outputs.cached_release_tag }}
          CACHED_VERSION: ${{ needs.plan-desktop.outputs.cached_version }}
          PLATFORMS: ${{ github.event.inputs.platforms }}
          BUNDLES: ${{ github.event.inputs.bundles }}
          FORCE_FLAG: ${{ (github.event.inputs.force == 'true' || needs.resolve-plan.outputs.force == 'true') && '--force' || '' }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Shared web build (once, OS-independent) ────────────────────────
  # The SvelteKit bundle is embedded inside every desktop binary, so build
  # it a single time with the plan's version string.
  build-web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve-plan, plan-desktop, plan-matrix]
    environment:
      name: ${{ needs.resolve-plan.outputs.mode }}
    if: needs.plan-matrix.result == 'success' && needs.plan-matrix.outputs.needs_build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          moon-cache: "true"
          install-deps: "true"
          sops: "true"

      - name: Decrypt secrets from SOPS
        shell: bash
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          ALL_APPS: ${{ needs.resolve-plan.outputs.all_apps }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          bun scripts/src/lib/ops/decrypt_secrets.ts --mode="$MODE" --strict scripts \
            $ALL_APPS

      - name: Build web bundle
        shell: bash
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          PUBLIC_APP_VERSION: ${{ needs.plan-desktop.outputs.version }}
          # MOON_TOOLCHAIN_FORCE_GLOBALS is set by setup-environment composite action.
        run: |
          bun moon run client:build -- --mode "$MODE"

      - name: Upload shared web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build-${{ github.run_id }}
          path: apps/frontend/client/build
          # Zipped on purpose: ~13k files, and upload-artifact v7's
          # `archive: false` only supports a SINGLE file per artifact.
          # download-artifact@v8 unzips transparently on every consumer.
          if-no-files-found: error
          retention-days: 1

  # ── Desktop releases (dynamic matrix from the plan job) ────────────
  # matrix.include comes from ci_planning.ts: build legs run on their native
  # OS with the full toolchain; reuse legs run on ubuntu-latest and just copy
  # previously-built artifacts between releases. No per-leg "Platform gate" —
  # unneeded legs are never scheduled.
  deploy-desktop:
    permissions:
      contents: write # for gh release upload (the top-level default is read-only)
    name: Desktop (${{ matrix.platform }}${{ matrix.action == 'reuse' && ' — reuse' || '' }})
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 45
    needs: [resolve-plan, plan-desktop, plan-matrix, build-web]
    environment:
      name: ${{ needs.resolve-plan.outputs.mode }}
    if: needs.plan-matrix.result == 'success' && needs.plan-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan-matrix.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          sops: "true"

      # macOS GitHub runners ship a stock Homebrew install with several
      # third-party taps pre-added (aws/tap among them) that Homebrew 6's new
      # tap-trust check now flags as untrusted on every `brew` invocation —
      # we never asked for or use any of them, so silence the check instead
      # of doing tap-by-tap `brew untap` whack-a-mole as the runner image
      # changes over time. (Homebrew's own message calls this "not
      # recommended" because it's meant for taps YOU rely on and choose not
      # to vet — that caveat doesn't apply to taps we've never touched.)
      - name: Work around macOS runner's pre-tapped, untrusted Homebrew taps
        if: matrix.action == 'build' && matrix.platform == 'macos'
        run: echo "HOMEBREW_NO_REQUIRE_TAP_TRUST=1" >> "$GITHUB_ENV"

      # ── Build legs only: Rust toolchain + OS deps ──────────────────
      - name: Setup Rust toolchain
        if: matrix.action == 'build'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Built-in rust-cache targets the repo ROOT (where there is no
          # Cargo.toml — its `cargo metadata` probe fails and it caches
          # ./target instead of the real one). A dedicated step below points
          # the cache at the nested Tauri workspace instead.
          cache: false
          cache-on-failure: true

      # Rust cache for the NESTED cargo workspace. Tauri compiles the full
      # wry/tao dependency tree (~15-25 min cold); caching the real target
      # dir turns subsequent runs into a few-minute incremental compile.
      - name: Cache Rust (nested Tauri workspace)
        if: matrix.action == 'build'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/frontend/client/src-tauri"
          cache-on-failure: true

      # Plain apt install instead of cache-apt-pkgs-action: the action's cache
      # was saved empty (6KB manifest, no .debs) on the first run, so every
      # subsequent run restored nothing and cargo failed on missing system
      # libs (gobject-2.0 etc.). The workflow runs rarely — a direct install
      # is simpler and cannot go stale. Tauri v2 Ubuntu 24.04 prerequisite set.
      - name: Install Linux system dependencies
        if: matrix.action == 'build' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl wget file

      # build legs need @tauri-apps/cli, so they also run bun install below.
      - name: Restore Bun dependency cache
        if: matrix.action == 'build'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      # No moon cache here on purpose. The desktop leg never invokes moon:
      # ci_run.ts imports only cli_utils / tauri_release / cache, the web
      # bundle arrives as a downloaded artifact (see "Download shared web
      # build" below), and the Rust half is cached by Swatinem/rust-cache
      # above. Restoring a moon cache would be pure overhead — and this leg
      # is the worst place to pay it: it runs on three platforms, each
      # getting its own cache entry out of the shared 10 GB repo budget.

      - name: Install dependencies
        if: matrix.action == 'build'
        run: bun install --frozen-lockfile

      # Env files for the leg — decrypted locally from SOPS, no GCP auth,
      # no Redis relay (C-441). Each leg decrypts independently; the
      # operation is fast (~100ms) and avoids the old concurrent-gcloud
      # file-lock races that motivated the Redis relay.
      - name: Decrypt secrets from SOPS
        shell: bash
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          ALL_APPS: ${{ needs.resolve-plan.outputs.all_apps }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          bun scripts/src/lib/ops/decrypt_secrets.ts --mode="$MODE" --strict scripts \
            $ALL_APPS

      # ── Build legs only: consume the shared web bundle ─────────────
      - name: Download shared web build
        if: matrix.action == 'build'
        uses: actions/download-artifact@v8
        with:
          name: web-build-${{ github.run_id }}
          path: apps/frontend/client/build

      # ── Run the leg (build or reuse) ───────────────────────────────
      # macOS ships a UNIVERSAL binary (arm64 + x86_64 lipo'd together) so
      # both the darwin-aarch64 and darwin-x86_64 updater channels resolve;
      # the extra rust target is installed right before the build.
      - name: Add Intel macOS target (universal build)
        if: matrix.action == 'build' && matrix.platform == 'macos'
        run: rustup target add x86_64-apple-darwin

      - name: Run Desktop Leg
        id: run-leg
        shell: bash
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          VERSION: ${{ needs.plan-desktop.outputs.version }}
          CHECKSUM: ${{ needs.plan-desktop.outputs.checksum }}
          LEG: ${{ toJson(matrix) }}
          CI: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_TARGET: ${{ matrix.platform == 'macos' && 'universal-apple-darwin' || '' }}
          # Updater signing key: passed directly as a GitHub Actions secret,
          # NEVER routed through the SOPS-decrypted scripts/.env.{mode} file
          # — see NEVER_ENCRYPT_KEYS in secrets_backend.ts (C-441 AC-6). The
          # client's vite envPrefix is ['PUBLIC_'], so this could never reach
          # the frontend bundle either way (GHSA-2rcp-jvr4-r259 safe).
          # src-tauri/tauri.conf.json's static createUpdaterArtifacts stays
          # `false` (so a plain local `bun tauri build` needs no signing key)
          # — tauri_release.ts's buildTauriArtifacts() overrides it to `true`
          # at build time for staging/production only (see liveModes).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun scripts/src/lib/deploy/ci_run.ts \
            --mode="$MODE" \
            --version="$VERSION" \
            --checksum="$CHECKSUM"


      # Updater fragment for this leg (release runs only) — the
      # update-manifest job merges all fragments into latest.json.
      - name: Upload updater fragment
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v7
        with:
          name: updater-fragments-${{ matrix.platform }}
          path: updater-fragments
          if-no-files-found: ignore
          retention-days: 14

      # Workflow-dispatch / staging only: no public Release exists, so attach
      # the raw bundle files to the run instead. ONE dynamic step per leg —
      # ci_run.ts computes the exact glob list for this leg's bundle types
      # (plus signatures) and hands it back via `artifact_globs`, replacing
      # what used to be 6 separate hardcoded upload-artifact steps (one per
      # bundle type, each with its own `if`). Trade-off: a leg that ships
      # multiple bundle types now downloads as one zip instead of one
      # unzipped file per type — worth it for six fewer steps to maintain.
      - name: Upload build artifacts (ephemeral)
        if: matrix.action == 'build' && env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: tauri-${{ matrix.platform }}
          path: ${{ steps.run-leg.outputs.artifact_globs }}
          if-no-files-found: warn
          retention-days: 14

  # ── Update manifest (release runs only) ──────────────────────────
  # Merge the per-platform updater fragments every leg emitted into a single
  # latest.json and attach it to the triggering release. GitHub's
  # releases/latest/download/latest.json URL then always resolves to the
  # newest release's manifest, which is what the in-app updater polls.
  #
  # Gated on the matrix being non-empty (not needs_build): a pure-reuse run
  # still re-attaches artifacts to the new release and needs a manifest there
  # too, or clients would 404 on the newest release.
  update-manifest:
    permissions:
      contents: write # for gh release upload
    name: Generate Update Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan-matrix, deploy-desktop]
    if: github.event_name == 'release' && needs.plan-matrix.result == 'success' && needs.plan-matrix.outputs.matrix != '[]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Read Cargo.toml from the release's own commit so the manifest
          # version always matches the artifact that was built for it.
          ref: ${{ github.event.release.tag_name }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Download updater fragments
        uses: actions/download-artifact@v8
        with:
          pattern: updater-fragments-*
          path: updater-fragments-merged
          merge-multiple: true

      - name: Merge + upload latest.json
        shell: bash
        run: |
          bun scripts/src/lib/deploy/updater_manifest.ts --merge \
            --fragments-dir="updater-fragments-merged" \
            --release-tag="$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Discord release announcement (release runs only) ────────────────
  # CI-only path: the desktop matrix has multiple legs, so this waits for all
  # of them via [plan-matrix, deploy-desktop] before announcing once. A local
  # `bun run deploy ... client-tauri` has no matrix to wait for, so that path
  # calls discord_notify.ts's notifyDiscordRelease() directly from
  # tauri_release.ts's deployTauriRelease instead of going through this job.
  #
  # Deliberately depends on deploy-desktop, NOT update-manifest — update-
  # manifest can now exit non-zero on a partial manifest (see
  # updater_manifest.ts) while still having published real download links,
  # and that shouldn't block the announcement. discord_notify.ts itself
  # no-ops when WORKER_NOTIFY_SECRET isn't configured for the mode (TASK 4 —
  # posts through the worker VM's /notify relay now, not a webhook URL).
  notify-discord:
    name: Announce Release (Discord)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [resolve-plan, plan-matrix, deploy-desktop]
    if: github.event_name == 'release' && needs.plan-matrix.result == 'success' && needs.plan-matrix.outputs.matrix != '[]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          sops: "true"

      - name: Decrypt secrets from SOPS
        shell: bash
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          ALL_APPS: ${{ needs.resolve-plan.outputs.all_apps }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          bun scripts/src/lib/ops/decrypt_secrets.ts --mode="$MODE" --strict scripts \
            $ALL_APPS

      - name: Post release announcement to Discord
        shell: bash
        run: bun scripts/src/lib/deploy/discord_notify.ts --tag="$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Cloudflare Workers (client, site, docs) ────────────────────────
  deploy-cloudflare:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve-plan, decrypt-secrets]
    environment:
      name: ${{ needs.resolve-plan.outputs.mode }}
    if: needs.resolve-plan.outputs.cloudflare_apps != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          moon-cache: "true"
          install-deps: "true"
          sops: "true"

      - name: Decrypt secrets from SOPS
        shell: bash
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          ALL_APPS: ${{ needs.resolve-plan.outputs.all_apps }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          bun scripts/src/lib/ops/decrypt_secrets.ts --mode="$MODE" --strict scripts \
            $ALL_APPS

      - name: Run Web Deploy Pipeline (Cloudflare)
        shell: bash
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          FORCE_FLAG: ${{ (github.event.inputs.force == 'true' || needs.resolve-plan.outputs.force == 'true') && '--force' || '' }}
          CLOUDFLARE_APPS: ${{ needs.resolve-plan.outputs.cloudflare_apps }}
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun scripts/src/lib/deploy/index.ts --yes --mode="$MODE" $FORCE_FLAG \
            $CLOUDFLARE_APPS

  # ── D1 Database Migrations (C-436, C-394 AC-5) ─────────────────────
  # Independently invocable — never a side effect of deploying the hub.
  # Gated on resolve-plan actually including the `database` app: true when
  # moon considers `packages/backend/database` (moon project
  # `backend-database`) affected by a push, or it was explicitly requested
  # via a commit-message `deploy[...]` override or workflow_dispatch
  # `apps`/`all`. `wrangler d1 migrations apply` is idempotent and a no-op
  # when nothing is pending, so a broader trigger than "only the SQL
  # migration files changed" is safe, not wasteful-in-a-harmful-way.
  deploy-database:
    name: D1 Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve-plan, decrypt-secrets]
    environment:
      name: ${{ needs.resolve-plan.outputs.mode }}
    if: needs.resolve-plan.outputs.database_migration_apps != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          install-deps: "true"
          sops: "true"

      - name: Decrypt secrets from SOPS
        shell: bash
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          ALL_APPS: ${{ needs.resolve-plan.outputs.all_apps }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          bun scripts/src/lib/ops/decrypt_secrets.ts --mode="$MODE" --strict scripts \
            $ALL_APPS

      - name: Apply D1 migrations
        shell: bash
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun scripts/src/lib/deploy/index.ts --yes --mode="$MODE" database

  # ── Worker VM (apps/backend/worker) ─────────────────────────────────
  # NOT part of the generic per-service-type pipeline above (`worker` is
  # `enabled: false` in deployment_config.ts — see the comment there) — it
  # has its own build→push→restart script against a single always-on
  # Compute Engine VM. Production only, always (there is no staging VM;
  # see scripts/src/lib/worker/deploy.ts's header comment).
  #
  # Needs a real GCP credential, unlike every other job in this workflow
  # (C-441 removed GCP auth entirely for the SOPS-backed apps). Routed
  # through the SOPS-encrypted secrets/<mode>.enc.env bundle like every
  # other deploy credential here — apps/backend/worker/.env.example's
  # GCP_SA_KEY_JSON (base64-encoded service-account JSON, scoped to
  # Artifact Registry Writer on the aikami-worker repo + Compute Instance
  # Admin on the aikami-worker VM only). Decrypting it only requires the
  # `worker` project explicitly (not part of $ALL_APPS — see resolve-plan),
  # so it's never pulled into any other job's decrypt step.
  deploy-worker:
    name: Deploy Worker VM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [resolve-plan]
    environment:
      name: production
    if: >-
      needs.resolve-plan.outputs.mode == 'production' &&
      (
        (github.event_name == 'push' && needs.resolve-plan.outputs.worker_changed == 'true') ||
        (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.apps, 'worker'))
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          install-deps: "true"
          sops: "true"

      - name: Decrypt secrets from SOPS
        shell: bash
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          bun scripts/src/lib/ops/decrypt_secrets.ts --mode="$MODE" --strict worker

      - name: Write GCP service-account key
        shell: bash
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
        run: |
          GCP_SA_KEY_JSON=$(grep '^GCP_SA_KEY_JSON=' "apps/backend/worker/.env.$MODE" | cut -d= -f2-)
          if [ -z "$GCP_SA_KEY_JSON" ]; then
            echo "❌ GCP_SA_KEY_JSON is empty in apps/backend/worker/.env.$MODE — see this job's header comment." >&2
            exit 1
          fi
          mkdir -p .secrets
          echo "$GCP_SA_KEY_JSON" | base64 -d > ".secrets/gcp_sa_key.$MODE.json"

      - name: Deploy worker VM
        shell: bash
        run: bun scripts/src/lib/worker/deploy.ts

  # ── Failure notification ──────────────────────────────────────────────
  # Posts to Discord when any deploy job fails. Uses `if: failure()` which
  # evaluates to true when ANY job in the workflow has failed.
  notify-failure:
    name: ⚠️ Notify Deploy Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ failure() }}
    needs:
      - resolve-plan
      - decrypt-secrets
      - plan-desktop
      - plan-matrix
      - build-web
      - deploy-desktop
      - update-manifest
      - notify-discord
      - deploy-cloudflare
      - deploy-database
      - deploy-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Post failure notification to Discord
        shell: bash
        run: |
          bun scripts/src/lib/deploy/discord_notify.ts --failure \
            --mode="$MODE" \
            --run-id="$RUN_ID"
        env:
          MODE: ${{ needs.resolve-plan.outputs.mode }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_NOTIFY_SECRET: ${{ secrets.WORKER_NOTIFY_SECRET }}
