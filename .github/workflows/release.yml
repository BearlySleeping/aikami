name: Release

# ── Config ──────────────────────────────────────────────────────────────
# DEPLOY_APPS controls which apps this pipeline touches:
#   "client-tauri"                      → desktop release only (default)
#   "client client-tauri site firebase" → desktop + web + backend
#   "all"                                → everything in DEPLOYABLE_APPS
#
# Triggers:
#   release: published  → real production cut. Desktop artifacts are
#                          uploaded straight to the GitHub Release that
#                          triggered this run (`gh release upload`).
#   workflow_dispatch    → manual run (staging QA, re-deploy, force
#                          rebuild). No public Release exists to attach to,
#                          so desktop artifacts are attached to the
#                          *workflow run* instead (Actions tab, 14-day
#                          retention) — visible to the team, not the public.
#
# Pipeline shape:
#   resolve-plan     → groups DEPLOY_APPS by serviceType (desktop,
#                      cloud-run-sveltekit, firebase-hosting,
#                      firebase-functions, docker-release) so every job below
#                      is gated at the JOB level (`if: needs.resolve-plan...`)
#                      instead of skipping steps one at a time inside a
#                      monolithic job. Deploying only "client-tauri" (the
#                      default) schedules NOTHING beyond the desktop jobs —
#                      the whole point is that the rest of the stack still
#                      deploys fine locally (`bun run deploy`) and doesn't
#                      need to burn Action minutes on every desktop release.
#   prepare-secrets  → the ONE place that authenticates to GCP and downloads
#                      Secret Manager secrets, for the UNION of every app in
#                      scope this run (desktop + web + backend + docker).
#                      Shared to every other job over Redis (env_share.ts) —
#                      no job below this one re-authenticates to GCP just to
#                      read secrets (they may still auth to GCP for their own
#                      deploy calls — gcloud run deploy, docker push, etc.
#                      that's a different concern from *fetching* secrets).
#   plan-desktop     → (client-tauri only) checksum + shared version +
#                      cached-release lookup, from the shared secrets.
#   plan-matrix      → platform/bundle filtering + per-leg build/reuse/skip
#                      decision (emits the dynamic matrix). No secrets.
#   build-web        → builds the OS-independent SvelteKit bundle ONCE with
#                      the plan's version string. Consumed by BOTH the
#                      desktop matrix legs AND (when both are in scope this
#                      run) the Cloud Run SvelteKit deploy — see
#                      deploy-cloud-run-sveltekit's --skip-build-for.
#   deploy-desktop   → one job per matrix leg (runs-on from the plan): build
#                      legs compile with the shared web bundle; reuse legs
#                      just copy artifacts between releases on ubuntu-latest.
#   update-manifest  → (release: published only) merges each leg's updater
#                      fragment into a single latest.json on the triggering
#                      release.
#   deploy-cloud-run-sveltekit / deploy-firebase-hosting /
#   deploy-firebase-functions / deploy-docker-release
#                    → one dedicated job per service type, each running only
#                      when resolve-plan found apps of that type. Each calls
#                      the same local orchestrator (scripts/.../deploy/index.ts)
#                      scoped to just its own apps — index.ts already handles
#                      checksum-skip, parallel deploys, and build dedup for a
#                      given set of apps, so these jobs stay thin.
# ────────────────────────────────────────────────────────────────────────
env:
  DEPLOY_APPS: "client-tauri"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Deployment Target Environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      force:
        description: "Bypass Redis checksum cache (--force)"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Comma-separated platforms to build (linux,windows,macos). Empty = all"
        required: false
        type: string
        default: ""
      bundles:
        description: "Comma-separated bundle targets (appimage,nsis,app,dmg) — deb/rpm/msi aren't in PLATFORM_DEFAULTS (see ci_planning.ts). Empty = platform defaults"
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-${{ github.event.inputs.mode || 'production' }}
  cancel-in-progress: false

permissions:
  contents: write # required for `gh release upload` / `gh release download`

jobs:
  # ── Resolve plan: group DEPLOY_APPS by serviceType ─────────────────
  # GitHub Actions does NOT expose the `env` context to job-level `if:`
  # conditions (only step-level) — a workflow using it fails to parse
  # ("Unrecognized named-value: 'env'") and never runs. This job re-exports
  # DEPLOY_APPS (grouped by serviceType, via resolve_plan.ts) as job outputs
  # so downstream jobs can gate on it via the `needs` context, which IS
  # allowed. Grouping is driven by APP_CONFIG[app].serviceType, so adding a
  # new deployable app never requires touching this workflow.
  resolve-plan:
    name: 🔎 Resolve Deploy Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all_apps: ${{ steps.resolve.outputs.all_apps }}
      desktop_apps: ${{ steps.resolve.outputs.desktop_apps }}
      cloud_run_apps: ${{ steps.resolve.outputs.cloud_run_apps }}
      firebase_hosting_apps: ${{ steps.resolve.outputs.firebase_hosting_apps }}
      firebase_functions_apps: ${{ steps.resolve.outputs.firebase_functions_apps }}
      docker_release_apps: ${{ steps.resolve.outputs.docker_release_apps }}
      database_migration_apps: ${{ steps.resolve.outputs.database_migration_apps }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Resolve deploy plan
        id: resolve
        shell: bash
        run: bun scripts/src/lib/deploy/resolve_plan.ts

  # ── Prepare secrets: the ONE Secret Manager fetch for this whole run ─
  # Every job below needs the same .env.{mode} files. Fetching per-job/
  # per-service-type spawned concurrent `gcloud secrets` processes that
  # collide on gcloud's config/token cache (Windows file-lock). Fetch ONCE
  # here, for every app across every service type in scope this run, and
  # hand the files down via Upstash Redis (per-run key, 4h TTL) — the repo
  # is PUBLIC, so no env content may ride in downloadable workflow
  # artifacts. Downstream jobs restore the files with env_share.ts --get.
  prepare-secrets:
    name: 🔐 Prepare Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve-plan]
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.resolve-plan.outputs.all_apps != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          gcp-auth: "true"
          gcp-service-account-key: ${{ secrets.GCP_SA_KEY }}

      - name: Download Secrets from GCP Secret Manager
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/download_secrets.ts --mode="$MODE" --strict scripts \
            ${{ needs.resolve-plan.outputs.all_apps }}

      - name: Share env files via Redis
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/env_share.ts --mode="$MODE" --put
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}

  # ── Plan desktop: checksum + version + cache read ──────────────────
  # No GCP auth here anymore — prepare-secrets already fetched the .env file
  # this checksum hashes; this job just restores it from Redis.
  plan-desktop:
    name: Plan Desktop Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve-plan, prepare-secrets]
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.resolve-plan.outputs.desktop_apps != ''
    outputs:
      checksum: ${{ steps.plan.outputs.checksum }}
      version: ${{ steps.plan.outputs.version }}
      cached_checksum: ${{ steps.plan.outputs.cached_checksum }}
      cached_release_tag: ${{ steps.plan.outputs.cached_release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Restore env files from Redis
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/env_share.ts --mode="$MODE" --get
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}

      - name: Compute checksum + version
        id: plan
        shell: bash
        run: bun scripts/src/lib/deploy/ci_planning.ts --mode="$MODE"
        env:
          MODE: ${{ github.event.inputs.mode || 'production' }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  # ── Plan-matrix: build/skip/reuse decisions → the JSON matrix ─────
  # Deliberately NO secret references (no GCP auth, no download_secrets) so
  # GitHub's masker never registers `{`/`}` here and the JSON matrix output
  # survives. All state comes in as plain strings from plan-desktop.
  plan-matrix:
    name: Decide Desktop Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan-desktop]
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
      needs_build: ${{ steps.decide.outputs.needs_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Decide matrix
        id: decide
        shell: bash
        run: |
          bun scripts/src/lib/deploy/ci_planning.ts --mode="$MODE" --decide \
            --checksum="${{ needs.plan-desktop.outputs.checksum }}" \
            --version="${{ needs.plan-desktop.outputs.version }}" \
            --cached-checksum="${{ needs.plan-desktop.outputs.cached_checksum }}" \
            --cached-release-tag="${{ needs.plan-desktop.outputs.cached_release_tag }}" \
            --platforms="$PLATFORMS" --bundles="$BUNDLES" $FORCE_FLAG
        env:
          MODE: ${{ github.event.inputs.mode || 'production' }}
          PLATFORMS: ${{ github.event.inputs.platforms }}
          BUNDLES: ${{ github.event.inputs.bundles }}
          FORCE_FLAG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Shared web build (once, OS-independent) ────────────────────────
  # The SvelteKit bundle is embedded inside every desktop binary AND is what
  # the Cloud Run SvelteKit app serves, so build it a single time with the
  # plan's version string. deploy-cloud-run-sveltekit reuses this artifact
  # (via --skip-build-for) whenever both it and the desktop pipeline are in
  # scope this run — see that job for the fallback when this one is skipped.
  build-web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan-desktop, plan-matrix]
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.plan-matrix.result == 'success' && needs.plan-matrix.outputs.needs_build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          moon-cache: "true"
          install-deps: "true"

      - name: Restore env files from Redis
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/env_share.ts --mode="$MODE" --get
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}

      - name: Build web bundle
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bunx moon run client:build -- --mode "$MODE"
        env:
          PUBLIC_APP_VERSION: ${{ needs.plan-desktop.outputs.version }}
          # moon's toolchain would otherwise try to provision its own bun via
          # proto in CI — force global tools (same as pr-checks.yml).
          MOON_TOOLCHAIN_FORCE_GLOBALS: "true"

      - name: Upload shared web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build-${{ github.run_id }}
          path: apps/frontend/client/build
          # Zipped on purpose: ~13k files, and upload-artifact v7's
          # `archive: false` only supports a SINGLE file per artifact.
          # download-artifact@v8 unzips transparently on every consumer.
          if-no-files-found: error
          retention-days: 1

  # ── Desktop releases (dynamic matrix from the plan job) ────────────
  # matrix.include comes from ci_planning.ts: build legs run on their native
  # OS with the full toolchain; reuse legs run on ubuntu-latest and just copy
  # previously-built artifacts between releases. No per-leg "Platform gate" —
  # unneeded legs are never scheduled.
  deploy-desktop:
    name: Desktop (${{ matrix.platform }}${{ matrix.action == 'reuse' && ' — reuse' || '' }})
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 45
    needs: [plan-desktop, plan-matrix, build-web]
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.plan-matrix.result == 'success' && needs.plan-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan-matrix.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      # macOS GitHub runners ship a stock Homebrew install with several
      # third-party taps pre-added (aws/tap among them) that Homebrew 6's new
      # tap-trust check now flags as untrusted on every `brew` invocation —
      # we never asked for or use any of them, so silence the check instead
      # of doing tap-by-tap `brew untap` whack-a-mole as the runner image
      # changes over time. (Homebrew's own message calls this "not
      # recommended" because it's meant for taps YOU rely on and choose not
      # to vet — that caveat doesn't apply to taps we've never touched.)
      - name: Work around macOS runner's pre-tapped, untrusted Homebrew taps
        if: matrix.action == 'build' && matrix.platform == 'macos'
        run: echo "HOMEBREW_NO_REQUIRE_TAP_TRUST=1" >> "$GITHUB_ENV"

      # ── Build legs only: Rust toolchain + OS deps ──────────────────
      - name: Setup Rust toolchain
        if: matrix.action == 'build'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Built-in rust-cache targets the repo ROOT (where there is no
          # Cargo.toml — its `cargo metadata` probe fails and it caches
          # ./target instead of the real one). A dedicated step below points
          # the cache at the nested Tauri workspace instead.
          cache: false
          cache-on-failure: true

      # Rust cache for the NESTED cargo workspace. Tauri compiles the full
      # wry/tao dependency tree (~15-25 min cold); caching the real target
      # dir turns subsequent runs into a few-minute incremental compile.
      - name: Cache Rust (nested Tauri workspace)
        if: matrix.action == 'build'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/frontend/client/src-tauri"
          cache-on-failure: true

      # Plain apt install instead of cache-apt-pkgs-action: the action's cache
      # was saved empty (6KB manifest, no .debs) on the first run, so every
      # subsequent run restored nothing and cargo failed on missing system
      # libs (gobject-2.0 etc.). The workflow runs rarely — a direct install
      # is simpler and cannot go stale. Tauri v2 Ubuntu 24.04 prerequisite set.
      - name: Install Linux system dependencies
        if: matrix.action == 'build' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl wget file

      # build legs need @tauri-apps/cli, so they also run bun install below.
      - name: Restore Bun & Moon build caches
        if: matrix.action == 'build'
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            .moon/cache
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/moon.yml', '**/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-

      - name: Install dependencies
        if: matrix.action == 'build'
        run: bun install --frozen-lockfile

      # Env files for the leg (REDIS creds for the deploy cache) — restored
      # from the prepare-secrets job's shared Redis entry, no per-leg GSM
      # fetch (avoids concurrent-gcloud file-lock races, see prepare-secrets).
      - name: Restore env files from Redis
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/env_share.ts --mode="$MODE" --get
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}

      # ── Build legs only: consume the shared web bundle ─────────────
      - name: Download shared web build
        if: matrix.action == 'build'
        uses: actions/download-artifact@v8
        with:
          name: web-build-${{ github.run_id }}
          path: apps/frontend/client/build

      # ── Run the leg (build or reuse) ───────────────────────────────
      # macOS ships a UNIVERSAL binary (arm64 + x86_64 lipo'd together) so
      # both the darwin-aarch64 and darwin-x86_64 updater channels resolve;
      # the extra rust target is installed right before the build.
      - name: Add Intel macOS target (universal build)
        if: matrix.action == 'build' && matrix.platform == 'macos'
        run: rustup target add x86_64-apple-darwin

      - name: Run Desktop Leg
        id: run-leg
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/deploy/ci_run.ts \
            --mode="$MODE" \
            --version="${{ needs.plan-desktop.outputs.version }}" \
            --checksum="${{ needs.plan-desktop.outputs.checksum }}"
        env:
          LEG: ${{ toJson(matrix) }}
          CI: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_TARGET: ${{ matrix.platform == 'macos' && 'universal-apple-darwin' || '' }}
          # Updater signing key: NOT passed here. It lives in GCM as
          # TAURI_SIGNING_PRIVATE_KEY / _PASSWORD (unprefixed, scripts/.env.example)
          # and reaches this step's process.env automatically — the "Restore env
          # files from Redis" step above writes scripts/.env.{mode} to disk, and
          # ci_run.ts's initScriptsEnv(mode) call loads it before spawning
          # `tauri build`. The client's vite envPrefix is ['PUBLIC_'], so these
          # could never reach the frontend bundle either way (GHSA-2rcp-jvr4-r259
          # safe). src-tauri/tauri.conf.json's static createUpdaterArtifacts
          # stays `false` (so a plain local `bun tauri build` needs no signing
          # key) — tauri_release.ts's buildTauriArtifacts() overrides it to
          # `true` at build time for staging/production only (see liveModes).

      # Updater fragment for this leg (release runs only) — the
      # update-manifest job merges all fragments into latest.json.
      - name: Upload updater fragment
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v7
        with:
          name: updater-fragments-${{ matrix.platform }}
          path: updater-fragments
          if-no-files-found: ignore
          retention-days: 14

      # Workflow-dispatch / staging only: no public Release exists, so attach
      # the raw bundle files to the run instead. ONE dynamic step per leg —
      # ci_run.ts computes the exact glob list for this leg's bundle types
      # (plus signatures) and hands it back via `artifact_globs`, replacing
      # what used to be 6 separate hardcoded upload-artifact steps (one per
      # bundle type, each with its own `if`). Trade-off: a leg that ships
      # multiple bundle types now downloads as one zip instead of one
      # unzipped file per type — worth it for six fewer steps to maintain.
      - name: Upload build artifacts (ephemeral)
        if: matrix.action == 'build' && env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: tauri-${{ matrix.platform }}
          path: ${{ steps.run-leg.outputs.artifact_globs }}
          if-no-files-found: warn
          retention-days: 14

  # ── Update manifest (release runs only) ──────────────────────────
  # Merge the per-platform updater fragments every leg emitted into a single
  # latest.json and attach it to the triggering release. GitHub's
  # releases/latest/download/latest.json URL then always resolves to the
  # newest release's manifest, which is what the in-app updater polls.
  #
  # Gated on the matrix being non-empty (not needs_build): a pure-reuse run
  # still re-attaches artifacts to the new release and needs a manifest there
  # too, or clients would 404 on the newest release.
  update-manifest:
    name: Generate Update Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan-matrix, deploy-desktop]
    if: github.event_name == 'release' && needs.plan-matrix.result == 'success' && needs.plan-matrix.outputs.matrix != '[]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Read Cargo.toml from the release's own commit so the manifest
          # version always matches the artifact that was built for it.
          ref: ${{ github.event.release.tag_name }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Download updater fragments
        uses: actions/download-artifact@v8
        with:
          pattern: updater-fragments-*
          path: updater-fragments-merged
          merge-multiple: true

      - name: Merge + upload latest.json
        shell: bash
        run: |
          bun scripts/src/lib/deploy/updater_manifest.ts --merge \
            --fragments-dir="updater-fragments-merged" \
            --release-tag="${{ github.event.release.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Discord release announcement (release runs only) ────────────────
  # CI-only path: the desktop matrix has multiple legs, so this waits for all
  # of them via [plan-matrix, deploy-desktop] before announcing once. A local
  # `bun run deploy ... client-tauri` has no matrix to wait for, so that path
  # calls discord_notify.ts's notifyDiscordRelease() directly from
  # tauri_release.ts's deployTauriRelease instead of going through this job.
  #
  # Deliberately depends on deploy-desktop, NOT update-manifest — update-
  # manifest can now exit non-zero on a partial manifest (see
  # updater_manifest.ts) while still having published real download links,
  # and that shouldn't block the announcement. discord_notify.ts itself
  # no-ops when DISCORD_WEBHOOK_URL isn't configured for the mode.
  notify-discord:
    name: Announce Release (Discord)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan-matrix, deploy-desktop]
    if: github.event_name == 'release' && needs.plan-matrix.result == 'success' && needs.plan-matrix.outputs.matrix != '[]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Restore env files from Redis
        shell: bash
        run: bun scripts/src/lib/ops/env_share.ts --mode=production --get
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}

      - name: Post release announcement to Discord
        shell: bash
        run: bun scripts/src/lib/deploy/discord_notify.ts --tag="${{ github.event.release.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Cloud Run (SvelteKit) ────────────────────────────────────────────
  deploy-cloud-run-sveltekit:
    name: Cloud Run (SvelteKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve-plan, prepare-secrets, plan-desktop, build-web]
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.resolve-plan.outputs.cloud_run_apps != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          moon-cache: "true"
          install-deps: "true"
          gcp-auth: "true"
          gcp-service-account-key: ${{ secrets.GCP_SA_KEY }}
          docker-registry: europe-west1-docker.pkg.dev

      - name: Restore env files from Redis
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/env_share.ts --mode="$MODE" --get
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}

      # If the desktop pipeline already built the shared SvelteKit bundle
      # this run (build-web succeeded), reuse it byte-for-byte instead of
      # paying for a second `moon run client:build` — same version string
      # (passed to index.ts below), so the output is identical. Falls back
      # to a normal build inside index.ts when build-web didn't run at all
      # (e.g. a web-only release with no client-tauri in DEPLOY_APPS, or
      # desktop's own checksum was unchanged so it never needed a build).
      - name: Download shared web build (if desktop built one this run)
        if: needs.build-web.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: web-build-${{ github.run_id }}
          path: apps/frontend/client/build

      - name: Run Web Deploy Pipeline (Cloud Run)
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          FORCE_FLAG="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          SKIP_BUILD_FLAG=""
          VERSION_FLAG=""
          if [ "${{ needs.build-web.result }}" == "success" ]; then
            SKIP_BUILD_FLAG="--skip-build-for=client"
            VERSION_FLAG="--version=${{ needs.plan-desktop.outputs.version }}"
          fi
          bun scripts/src/lib/deploy/index.ts --yes --mode="$MODE" $FORCE_FLAG $SKIP_BUILD_FLAG $VERSION_FLAG \
            ${{ needs.resolve-plan.outputs.cloud_run_apps }}
        env:
          CI: "true"

  # ── Firebase Hosting ─────────────────────────────────────────────────
  deploy-firebase-hosting:
    name: Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve-plan, prepare-secrets]
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.resolve-plan.outputs.firebase_hosting_apps != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Firebase CLI tooling shells out to Node directly — unlike Cloud Run
      # and desktop, this job actually needs it (see setup-environment.yml).
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node: "true"
          moon-cache: "true"
          install-deps: "true"
          gcp-auth: "true"
          gcp-service-account-key: ${{ secrets.GCP_SA_KEY }}

      - name: Restore env files from Redis
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/env_share.ts --mode="$MODE" --get
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}

      - name: Run Web Deploy Pipeline (Firebase Hosting)
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          FORCE_FLAG="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          bun scripts/src/lib/deploy/index.ts --yes --mode="$MODE" $FORCE_FLAG \
            ${{ needs.resolve-plan.outputs.firebase_hosting_apps }}
        env:
          CI: "true"

  # ── Firebase Functions ───────────────────────────────────────────────
  deploy-firebase-functions:
    name: Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve-plan, prepare-secrets]
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.resolve-plan.outputs.firebase_functions_apps != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          node: "true"
          node-version: "24.x"
          moon-cache: "true"
          install-deps: "true"
          gcp-auth: "true"
          gcp-service-account-key: ${{ secrets.GCP_SA_KEY }}

      - name: Restore env files from Redis
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/env_share.ts --mode="$MODE" --get
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}

      - name: Run Web Deploy Pipeline (Firebase Functions)
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          FORCE_FLAG="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          bun scripts/src/lib/deploy/index.ts --yes --mode="$MODE" $FORCE_FLAG \
            ${{ needs.resolve-plan.outputs.firebase_functions_apps }}
        env:
          CI: "true"

  # ── Docker Release (image / text / voice services) ─────────────────
  deploy-docker-release:
    name: Docker Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve-plan, prepare-secrets]
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.resolve-plan.outputs.docker_release_apps != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No moon-cache: docker-release apps skip the moon build phase
      # entirely in index.ts (needsDist === false) — restoring an unused
      # cache here would just cost time for nothing.
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          install-deps: "true"
          gcp-auth: "true"
          gcp-service-account-key: ${{ secrets.GCP_SA_KEY }}
          docker-registry: europe-west1-docker.pkg.dev

      - name: Restore env files from Redis
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/env_share.ts --mode="$MODE" --get
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}

      - name: Run Web Deploy Pipeline (Docker Release)
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          FORCE_FLAG="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          bun scripts/src/lib/deploy/index.ts --yes --mode="$MODE" $FORCE_FLAG \
            ${{ needs.resolve-plan.outputs.docker_release_apps }}
        env:
          CI: "true"

  # ── Database Migration (server data plane, C-394 AC-5) ──────────────
  # One-shot migration job: applies pending server-plane migrations against
  # NEON_DATABASE_URL_DIRECT (the DIRECT, unpooled endpoint — DDL under
  # PgBouncer transaction pooling is where pooling breaks). Transactional,
  # idempotent, and NEVER a side effect of deploying the hub — this job only
  # runs when resolve-plan found the `database` app in DEPLOY_APPS.
  deploy-database-migration:
    name: Database Migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve-plan, prepare-secrets]
    environment:
      name: ${{ github.event.inputs.mode || 'production' }}
    if: needs.resolve-plan.outputs.database_migration_apps != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          install-deps: "true"
          gcp-auth: "true"
          gcp-service-account-key: ${{ secrets.GCP_SA_KEY }}

      - name: Restore env files from Redis
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/ops/env_share.ts --mode="$MODE" --get
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}

      - name: Run Database Migration
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          bun scripts/src/lib/deploy/index.ts --yes --mode="$MODE" \
            ${{ needs.resolve-plan.outputs.database_migration_apps }}
        env:
          CI: "true"
