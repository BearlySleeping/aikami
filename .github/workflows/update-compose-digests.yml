# .github/workflows/update-compose-digests.yml
#
# Weekly digest-pin refresh for the local stack (C-390 Watch Points).
#
# Pinned digests go stale: upstream publishes new images and — for
# stable-diffusion.cpp — force-moves the rolling `master-*` tags, silently
# swapping the engine underneath an unpinned user. This job re-resolves the
# current digests for every upstream image the compose topology references
# and opens a PR bumping them, so the pins stay fresh without un-pinning.
#
# The PR is intentionally not auto-merged: a human (or the smoke test in CI)
# confirms the new digests still satisfy the health probes.

name: Update Compose Digests

# Weekly cron: re-resolves pinned digests so they don't go stale.
# Scheduled workflows auto-disable after 60 days of repo inactivity.
# schedule only ever runs from the default branch.
on:
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  bump:
    name: Re-resolve pinned digests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # needed to push the digest-bump branch
      pull-requests: write # needed to create/update the digest-bump PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Re-resolve digests and patch compose files
        run: |
          set -euo pipefail
          cd apps/backend/local-stack

          # Map of upstream reference -> file:image-key. Keys are the image
          # tags as written in the compose files (minus digest).
          declare -A IMAGES=(
            [ghcr.io/ggml-org/llama.cpp:server]="compose.yaml:compose.cpu.yaml"
            [ghcr.io/ggml-org/llama.cpp:server-cuda]="compose.cuda.yaml"
            [ghcr.io/ggml-org/llama.cpp:server-rocm]="compose.rocm.yaml"
            [ghcr.io/ggml-org/llama.cpp:server-vulkan]="compose.vulkan.yaml"
            [ghcr.io/ggml-org/llama.cpp:server-intel]="compose.intel.yaml"
            [ghcr.io/ggml-org/llama.cpp:server-musa]="compose.musa.yaml"
            [ghcr.io/leejet/stable-diffusion.cpp:master-cuda]="compose.cuda.yaml"
            [ghcr.io/leejet/stable-diffusion.cpp:master-vulkan]="compose.rocm.yaml:compose.vulkan.yaml"
            [ghcr.io/leejet/stable-diffusion.cpp:master-musa]="compose.musa.yaml"
            [ghcr.io/leejet/stable-diffusion.cpp:master-sycl]="compose.intel.yaml"
            [ollama/ollama:latest]="compose.yaml"
            [yanwk/comfyui-boot:cu130-slim-v2]="compose.yaml"
          )

          changed=0
          for ref in "${!IMAGES[@]}"; do
            # Use buildx imagetools inspect (not docker manifest inspect) —
            # the classic command fails on single-platform OCI manifests
            # that ggml-org/leejet publish ("Treating single images as
            # manifest lists is not implemented").
            raw=$(docker buildx imagetools inspect --raw "$ref" 2>/dev/null || true)
            if [ -z "$raw" ]; then
              echo "WARN: could not resolve $ref"
              continue
            fi
            # Extract the list digest from the manifest index (first manifest's digest
            # is the list digest itself). For single-platform images, --raw returns
            # the image manifest directly — extract its config digest instead.
            digest=$(echo "$raw" | jq -r '.manifests[0].digest // .config.digest // empty' 2>/dev/null)
            if [ -z "$digest" ]; then
              echo "WARN: could not extract digest for $ref"
              continue
            fi
            # Full reference with digest, e.g. ref@sha256:...
            full="${ref}@${digest}"
            for file in ${IMAGES[$ref]//:/ }; do
              # Strip any existing @sha256:... before comparing
              if grep -qE "${ref}@sha256:[a-f0-9]+" "$file"; then
                # Already pinned — replace the existing digest
                sed -i -E "s|${ref}@sha256:[a-f0-9]+|${full}|g" "$file"
                echo "updated: $ref -> $digest in $file"
                changed=1
              elif grep -q "$ref" "$file"; then
                # Unpinned — pin it
                sed -i "s|${ref}|${full}|g" "$file"
                echo "bumped: $ref -> $digest in $file"
                changed=1
              else
                echo "WARN: ${ref} not found in $file"
              fi
            done
          done

          if [ "$changed" -eq 0 ]; then
            echo "no-digest-changes"
          else
            echo "digest-changes"
          fi

      - name: Create or update the digest-bump PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No digest changes; nothing to PR."
            exit 0
          fi
          branch="chore/compose-digests-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add apps/backend/local-stack
          git commit -m "chore(local-stack): refresh pinned compose digests"
          # --force handles same-day re-runs (date-stamped branch already exists)
          git push origin "$branch" --force
          # Check if a PR already exists for this branch before creating
          if gh pr view "$branch" --json id --jq .id >/dev/null 2>&1; then
            echo "PR already exists for $branch; skipping creation."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(local-stack): refresh pinned compose digests" \
              --body "Weekly digest-pin refresh for the C-390 local stack. Verify the updated digests still pass the local-stack smoke test before merging." \
              --label "dependencies"
          fi
