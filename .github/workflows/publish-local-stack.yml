# .github/workflows/publish-local-stack.yml
#
# Publishes the images Aikami owns for the local stack (C-390) to GHCR
# and verifies the publish contract:
#   - aikami-model-fetcher (docker/fetcher/Dockerfile — bzip2-enabled bun)
#   - aikami-voice            (docker/voice/Dockerfile.sherpa)
#   - aikami-sd-server:cpu    (docker/sd-server/Dockerfile.cpu — the one
#                              backend upstream does not publish)
#   - aikami-client           (Dockerfile.client — needs the staged SPA build)
#
# AC-5: after build, layer inspection asserts no weights (*.gguf/*.safetensors/
# *.onnx/*.bin/*.pt) are present and the compressed image is under 250 MB.
# AC-9: the client image is booted twice with different mounted config.json
# files pointing at different engine hosts; both must serve the new config
# with no rebuild.
# AC-1: every image referenced by the compose topology must resolve and be
# digest-pinned (runs docker manifest inspect).
#
# GHCR images default to private — anonymous-pull verification is part of
# the job so a private package cannot ship silently.

name: Publish Local Stack Images

# Push-to-main trigger held off for now (2026-08-15) while this workflow is
# still being stabilized — the sd-server:cpu image alone takes 15-20+ min to
# compile from source (GGML_CPU_ALL_VARIANTS=ON: every CPU ISA variant, for
# runtime dispatch on unknown user hardware — a real product requirement,
# not a thing to cache away). Re-enable once it's reliably green; until then
# trigger manually via workflow_dispatch.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'apps/backend/local-stack/**'
  #     - '.github/workflows/publish-local-stack.yml'

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    # Needed only for the "Download client secrets" step below (GCP_SA_KEY /
    # environment-scoped secrets) — the rest of this job doesn't touch GCP.
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Single source of truth for the local-stack release tag: the images
      # get a stable `:$LOCAL_STACK_VERSION` tag (in addition to `:latest`
      # and `:$sha`) so users can pin a known-good stack version instead of
      # always tracking `latest`. Bump apps/backend/local-stack/package.json
      # to cut a new version.
      #
      # IMAGE_PREFIX is computed here (not in workflow-level `env:`) because
      # `github.repository_owner` is "BearlySleeping" — mixed case — and
      # Docker repository names must be lowercase. GitHub Actions expression
      # syntax has no case-conversion function, so this is a shell step.
      # (Every build-push step below failed on this the first time the
      # AC-1 fix let the workflow get this far — "invalid tag ...: repository
      # name must be lowercase".)
      - name: Read local-stack version + image prefix
        id: version
        run: |
          version=$(jq -r .version apps/backend/local-stack/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "LOCAL_STACK_VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── AC-1: every upstream image reference resolves ─────────────────
      # Uses `docker buildx imagetools inspect`, not `docker manifest
      # inspect` — the classic manifest command fails on these refs with
      # "Treating single images as manifest lists is not implemented"
      # because ggml-org/leejet publish single-platform OCI image manifests
      # (not manifest lists) at a `tag@digest` ref, which some Docker CLI
      # versions' `manifest inspect` can't parse. buildx imagetools handles
      # both manifest lists and single-platform manifests, and accepts
      # `name:tag@digest` directly (verified 2026-08-15 after 4 straight
      # publish failures on this step).
      - name: Verify upstream image references resolve
        run: |
          set -euo pipefail
          cd apps/backend/local-stack
          for backend in cpu cuda rocm vulkan intel musa; do
            COMPOSE_FILE="compose.yaml:compose.$backend.yaml" \
            COMPOSE_PROFILES=text,image,voice,stt,web docker compose config \
              >/tmp/render-$backend.yaml
          done
          # Extract every pinned upstream image from the rendered configs.
          grep -hoE 'ghcr.io/(ggml-org|leejet)/[^" ]+' /tmp/render-*.yaml \
            | sort -u | while read -r img; do
              echo "resolving $img"
              docker buildx imagetools inspect "$img" >/dev/null
            done

      # ── Model-fetcher image (bzip2-enabled bun) ────────────────────────
      - name: Build and publish aikami-model-fetcher
        uses: docker/build-push-action@v6
        with:
          context: apps/backend/local-stack/docker/fetcher
          file: apps/backend/local-stack/docker/fetcher/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/aikami-model-fetcher:latest
            ${{ env.IMAGE_PREFIX }}/aikami-model-fetcher:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/aikami-model-fetcher:${{ env.LOCAL_STACK_VERSION }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=aikami-model-fetcher
          cache-to: type=gha,mode=max,scope=aikami-model-fetcher

      # ── Voice image ────────────────────────────────────────────────────
      - name: Build and publish aikami-voice
        uses: docker/build-push-action@v6
        with:
          context: apps/backend/local-stack/docker/voice
          file: apps/backend/local-stack/docker/voice/Dockerfile.sherpa
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/aikami-voice:latest
            ${{ env.IMAGE_PREFIX }}/aikami-voice:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/aikami-voice:${{ env.LOCAL_STACK_VERSION }}
          platforms: linux/amd64
          cache-from: type=gha,scope=aikami-voice
          cache-to: type=gha,mode=max,scope=aikami-voice

      # sd-server:cpu compiles stable-diffusion.cpp + every ggml CPU ISA
      # variant from source; even with --parallel capped to 2 (see
      # Dockerfile.cpu), a heavy build here got the standard runner
      # OOM-killed ("lost communication with the server", 2026-08-15).
      # A swap file gives the kernel somewhere to go instead of invoking the
      # OOM killer — cheap headroom, standard runner, no cost.
      - name: Add swap space
        run: |
          # The runner image already has an active swap file at /swapfile
          # ("fallocate failed: Text file busy" when this used that path) —
          # /mnt is the runner's separate, much larger scratch volume.
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # ── CPU sd-server image ───────────────────────────────────────────
      - name: Build and publish aikami-sd-server:cpu
        uses: docker/build-push-action@v6
        with:
          context: apps/backend/local-stack/docker/sd-server
          file: apps/backend/local-stack/docker/sd-server/Dockerfile.cpu
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/aikami-sd-server:cpu
            ${{ env.IMAGE_PREFIX }}/aikami-sd-server:cpu-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/aikami-sd-server:cpu-${{ env.LOCAL_STACK_VERSION }}
          platforms: linux/amd64
          # This is the slow one (15-20+ min cold: GGML_CPU_ALL_VARIANTS=ON
          # compiles every CPU ISA variant from source). GHA layer cache
          # means a rebuild after e.g. only bumping SD_CPP_REVISION, or
          # re-running after an unrelated step failed downstream, reuses
          # the compiled ggml/sd.cpp layers instead of recompiling.
          cache-from: type=gha,scope=aikami-sd-server-cpu
          cache-to: type=gha,mode=max,scope=aikami-sd-server-cpu

      # ── Client image (staged SPA + runtime config mount, AC-9) ────────
      # The SPA needs real PUBLIC_FIREBASE_* / PUBLIC_* values baked in (Vite
      # inlines them at build time) or the packaged client's auth/Firestore
      # never work. apps/frontend/client/.env.production is gitignored, so
      # fetch it from GCP Secret Manager the same way release.yml's
      # prepare-secrets job does, scoped to just the `client` app — this
      # workflow builds nothing else that needs secrets.
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          install-deps: "true"
          gcp-auth: "true"
          gcp-service-account-key: ${{ secrets.GCP_SA_KEY }}

      - name: Download client secrets from GCP Secret Manager
        run: bun scripts/src/lib/ops/download_secrets.ts --mode=production --strict client

      - name: Build the client SPA for staging
        working-directory: apps/frontend/client
        run: bun run build:production
        env:
          NODE_ENV: production

      - name: Stage client build + emit config
        working-directory: apps/backend/local-stack
        run: |
          rm -rf .build/client
          mkdir -p .build
          cp -a ../../frontend/client/build .build/client
          ./scripts/emit_config.sh > .build/client/config.json

      - name: Build and publish aikami-client
        uses: docker/build-push-action@v6
        with:
          context: apps/backend/local-stack
          file: apps/backend/local-stack/Dockerfile.client
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/aikami-client:latest
            ${{ env.IMAGE_PREFIX }}/aikami-client:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/aikami-client:${{ env.LOCAL_STACK_VERSION }}
          platforms: linux/amd64
          cache-from: type=gha,scope=aikami-client
          cache-to: type=gha,mode=max,scope=aikami-client

      # ── AC-5: layer inspection for voice + sd-server + client ─────────
      # Runs AFTER all three images are published. AC-5 names aikami-client
      # and aikami-voice: no weights in any layer, and the compressed image
      # (sum of registry layer sizes) stays within the 250 MB budget.
      - name: AC-5 layer inspection (voice + sd-server + client)
        run: |
          set -euo pipefail
          cd apps/backend/local-stack
          for img in \
            "${{ env.IMAGE_PREFIX }}/aikami-voice:latest" \
            "${{ env.IMAGE_PREFIX }}/aikami-sd-server:cpu" \
            "${{ env.IMAGE_PREFIX }}/aikami-client:latest"; do
            docker pull "$img"
            echo "== $img layers =="
            size_bytes=$(docker image inspect "$img" --format '{{.Size}}')
            echo "uncompressed size: $(awk "BEGIN{printf \"%.1f\", $size_bytes/1048576}") MB"
            # Compressed size = sum of the registry manifest's layer sizes.
            # buildx imagetools, not `docker manifest inspect` — see the
            # AC-1 step above for why. `--raw` on $img's tag returns a
            # manifest INDEX, not a single image manifest — build-push-
            # action@v6 attaches a provenance/SBOM attestation by default,
            # even for single-platform builds, so `.layers` isn't at the
            # top level. Resolve the real per-platform manifest (the one
            # whose platform isn't the attestation's "unknown/unknown")
            # and inspect that digest directly for its `.layers`.
            raw=$(docker buildx imagetools inspect "$img" --raw)
            manifest_digest=$(echo "$raw" \
              | jq -r '.manifests[] | select(.platform.architecture != "unknown") | .digest' \
              | head -1)
            repo="${img%%:*}"
            compressed=$(docker buildx imagetools inspect "${repo}@${manifest_digest}" --raw \
              | jq '[.layers[].size] | add // 0')
            echo "compressed size: $(awk "BEGIN{printf \"%.1f\", $compressed/1048576}") MB"
            if [ "$compressed" -gt 262144000 ]; then
              echo "FAIL: $img compressed size ${compressed} bytes exceeds the 250 MB budget (AC-5)"
              exit 1
            fi
            echo "ok: $img within the 250 MB compressed budget (AC-5)"
            # Weights must not be in any layer (AC-5).
            docker run --rm --entrypoint /bin/sh "$img" -c \
              'find / -type f \( -name "*.gguf" -o -name "*.safetensors" -o -name "*.onnx" -o -name "*.bin" -o -name "*.pt" \) 2>/dev/null' \
              | { grep -q . && { echo "FAIL: weight files found in image"; exit 1; } || echo "ok: no weight files"; }
          done

      # ── AC-9: two config mounts against one client image ──────────────
      - name: AC-9 two-config-mount test
        run: |
          set -euo pipefail
          img="${{ env.IMAGE_PREFIX }}/aikami-client:latest"
          docker pull "$img"
          mkdir -p /tmp/cfg-a /tmp/cfg-b
          cat > /tmp/cfg-a/config.json <<'EOF'
          { "text": { "url": "http://10.1.1.1:11434/v1" }, "image": { "url": "http://10.1.1.1:8188" }, "voice": { "tts": { "mode": "server", "url": "http://10.1.1.1:8089" }, "stt": { "url": "http://10.1.1.1:8087" } }, "models": { "originUrl": "https://huggingface.co" } }
          EOF
          cat > /tmp/cfg-b/config.json <<'EOF'
          { "text": { "url": "http://10.2.2.2:11434/v1" }, "image": { "url": "http://10.2.2.2:8188" }, "voice": { "tts": { "mode": "server", "url": "http://10.2.2.2:8089" }, "stt": { "url": "http://10.2.2.2:8087" } }, "models": { "originUrl": "https://huggingface.co" } }
          EOF
          cid_a=$(docker run -d -p 15274:5274 \
            -v /tmp/cfg-a/config.json:/usr/share/nginx/html/config.json:ro "$img")
          trap 'docker rm -f "$cid_a" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:15274/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:15274/config.json | grep -q '10.1.1.1' \
            && echo "ok: config A served"
          docker rm -f "$cid_a" >/dev/null 2>&1
          cid_b=$(docker run -d -p 15274:5274 \
            -v /tmp/cfg-b/config.json:/usr/share/nginx/html/config.json:ro "$img")
          trap - EXIT
          trap 'docker rm -f "$cid_b" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:15274/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:15274/config.json | grep -q '10.2.2.2' \
            && echo "ok: config B served without rebuild"

      # ── Anonymous pull verification ────────────────────────────────────
      - name: Verify anonymous pull
        run: |
          set -euo pipefail
          # Log out so the pull exercises the public path, not the token.
          docker logout ghcr.io
          for img in \
            "${{ env.IMAGE_PREFIX }}/aikami-model-fetcher:latest" \
            "${{ env.IMAGE_PREFIX }}/aikami-voice:latest" \
            "${{ env.IMAGE_PREFIX }}/aikami-sd-server:cpu" \
            "${{ env.IMAGE_PREFIX }}/aikami-client:latest"; do
            echo "anonymous pull: $img"
            docker pull "$img" >/dev/null
          done
