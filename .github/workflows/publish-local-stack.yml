# .github/workflows/publish-local-stack.yml
#
# Publishes the images Aikami owns for the local stack (C-390) to GHCR
# and verifies the publish contract:
#   - aikami-model-fetcher (docker/fetcher/Dockerfile — bzip2-enabled bun)
#   - aikami-voice            (docker/voice/Dockerfile.sherpa)
#   - aikami-sd-server:cpu    (docker/sd-server/Dockerfile.cpu — the one
#                              backend upstream does not publish)
#   - aikami-client           (Dockerfile.client — needs the staged SPA build)
#
# AC-5: after build, layer inspection asserts no weights (*.gguf/*.safetensors/
# *.onnx/*.bin/*.pt) are present and the compressed image is under 250 MB.
# AC-9: the client image is booted twice with different mounted config.json
# files pointing at different engine hosts; both must serve the new config
# with no rebuild.
# AC-1: every image referenced by the compose topology must resolve and be
# digest-pinned (runs docker manifest inspect).
#
# GHCR images default to private — anonymous-pull verification is part of
# the job so a private package cannot ship silently.
#
# Pipeline shape:
#   setup      → computes version + image prefix, sets up Docker Buildx + GHCR login
#   build      → matrix job: 4 independent images built in parallel.
#                sd-server needs swap space; client needs GCP auth + SPA build.
#   verify     → AC-1 (upstream refs resolve), AC-5 (layer inspection),
#                AC-9 (config-mount test), anonymous pull, installer bundle.
#                Runs after ALL build legs complete.

name: Publish Local Stack Images

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'apps/backend/local-stack/**'
  #     - '.github/workflows/publish-local-stack.yml'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ── Setup: version info + Docker infrastructure ──────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_prefix: ${{ steps.version.outputs.image_prefix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read local-stack version + image prefix
        id: version
        run: |
          version=$(jq -r .version apps/backend/local-stack/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # ── Build matrix: 4 independent images ───────────────────────────────
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [setup]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aikami-model-fetcher
            context: apps/backend/local-stack
            file: apps/backend/local-stack/docker/fetcher/Dockerfile
            platforms: linux/amd64,linux/arm64
            cache-scope: aikami-model-fetcher
            needs-swap: false
            needs-gcp: false

          - image: aikami-voice
            context: apps/backend/local-stack/docker/voice
            file: apps/backend/local-stack/docker/voice/Dockerfile.sherpa
            platforms: linux/amd64
            cache-scope: aikami-voice
            needs-swap: false
            needs-gcp: false

          - image: aikami-sd-server:cpu
            context: apps/backend/local-stack/docker/sd-server
            file: apps/backend/local-stack/docker/sd-server/Dockerfile.cpu
            platforms: linux/amd64
            cache-scope: aikami-sd-server-cpu
            needs-swap: true
            needs-gcp: false

          - image: aikami-client
            context: apps/backend/local-stack
            file: apps/backend/local-stack/Dockerfile.client
            platforms: linux/amd64
            cache-scope: aikami-client
            needs-swap: false
            needs-gcp: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # sd-server:cpu compiles stable-diffusion.cpp + every ggml CPU ISA
      # variant from source; even with --parallel capped to 2 (see
      # Dockerfile.cpu), a heavy build here got the standard runner
      # OOM-killed ("lost communication with the server", 2026-08-15).
      # A swap file gives the kernel somewhere to go instead of invoking the
      # OOM killer — cheap headroom, standard runner, no cost.
      - name: Add swap space (sd-server only)
        if: matrix.needs-swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # Client image needs GCP auth + secrets + SPA build before docker build.
      - name: Setup environment (client only)
        if: matrix.needs-gcp
        uses: ./.github/actions/setup-environment
        with:
          install-deps: "true"
          gcp-auth: "true"
          gcp-service-account-key: ${{ secrets.GCP_SA_KEY }}

      - name: Download client secrets from GCP Secret Manager
        if: matrix.needs-gcp
        run: bun scripts/src/lib/ops/download_secrets.ts --mode=production --strict client

      - name: Build the client SPA
        if: matrix.needs-gcp
        working-directory: apps/frontend/client
        run: bun run build:production
        env:
          NODE_ENV: production

      - name: Stage client build + emit config
        if: matrix.needs-gcp
        working-directory: apps/backend/local-stack
        run: |
          rm -rf .build/client
          mkdir -p .build
          cp -a ../../frontend/client/build .build/client
          ./scripts/emit_config.sh > .build/client/config.json

      - name: Build and publish ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ needs.setup.outputs.image_prefix }}/${{ matrix.image }}:latest
            ${{ needs.setup.outputs.image_prefix }}/${{ matrix.image }}:${{ github.sha }}
            ${{ needs.setup.outputs.image_prefix }}/${{ matrix.image }}:${{ needs.setup.outputs.version }}
          platforms: ${{ matrix.platforms }}
          cache-from: ${{ matrix.image == 'aikami-sd-server:cpu' && format('type=registry,ref={0}/aikami-sd-server:buildcache', needs.setup.outputs.image_prefix) || format('type=gha,scope={0}', matrix.cache-scope) }}
          cache-to: ${{ matrix.image == 'aikami-sd-server:cpu' && format('type=registry,ref={0}/aikami-sd-server:buildcache,mode=max', needs.setup.outputs.image_prefix) || format('type=gha,mode=min,scope={0}', matrix.cache-scope) }}

  # ── Verify: AC-1, AC-5, AC-9, anonymous pull, installer bundle ──────
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, build]
    permissions:
      contents: write # for gh release upload (installer bundle)
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── AC-1: every upstream image reference resolves ─────────────────
      - name: AC-1 — Verify upstream image references resolve
        run: |
          set -euo pipefail
          cd apps/backend/local-stack
          for backend in cpu cuda rocm vulkan intel musa; do
            COMPOSE_FILE="compose.yaml:compose.$backend.yaml" \
            COMPOSE_PROFILES=text,image,voice,stt,client docker compose config \
              >/tmp/render-$backend.yaml
          done
          grep -hoE 'ghcr.io/(ggml-org|leejet)/[^" ]+' /tmp/render-*.yaml \
            | sort -u | while read -r img; do
              echo "resolving $img"
              docker buildx imagetools inspect "$img" >/dev/null
            done
          echo "ok: all upstream references resolve (AC-1)"

      # ── AC-5: layer inspection for voice + sd-server + client ─────────
      - name: AC-5 — Layer inspection (voice + sd-server + client)
        env:
          PREFIX: ${{ needs.setup.outputs.image_prefix }}
        run: |
          set -euo pipefail
          for img in \
            "$PREFIX/aikami-voice:latest" \
            "$PREFIX/aikami-sd-server:cpu" \
            "$PREFIX/aikami-client:latest"; do
            docker pull "$img"
            echo "== $img layers =="
            size_bytes=$(docker image inspect "$img" --format '{{.Size}}')
            echo "uncompressed size: $(awk "BEGIN{printf \"%.1f\", $size_bytes/1048576}") MB"
            raw=$(docker buildx imagetools inspect "$img" --raw)
            manifest_digest=$(echo "$raw" \
              | jq -r '.manifests[] | select(.platform.architecture != "unknown") | .digest' \
              | head -1)
            repo="${img%%:*}"
            compressed=$(docker buildx imagetools inspect "${repo}@${manifest_digest}" --raw \
              | jq '[.layers[].size] | add // 0')
            echo "compressed size: $(awk "BEGIN{printf \"%.1f\", $compressed/1048576}") MB"
            if [ "$compressed" -gt 262144000 ]; then
              echo "FAIL: $img compressed size ${compressed} bytes exceeds the 250 MB budget (AC-5)"
              exit 1
            fi
            echo "ok: $img within the 250 MB compressed budget (AC-5)"
            docker run --rm --entrypoint /bin/sh "$img" -c \
              'find / -type f \( -name "*.gguf" -o -name "*.safetensors" -o -name "*.onnx" -o -name "*.bin" -o -name "*.pt" \) 2>/dev/null; true' \
              | { grep -q . && { echo "FAIL: weight files found in image"; exit 1; } || echo "ok: no weight files"; }
          done

      # ── AC-9: two config mounts against one client image ──────────────
      - name: AC-9 — Two-config-mount test
        env:
          IMG: ${{ needs.setup.outputs.image_prefix }}/aikami-client:latest
        run: |
          set -euo pipefail
          img="$IMG"
          docker pull "$img"
          mkdir -p /tmp/cfg-a /tmp/cfg-b
          cat > /tmp/cfg-a/config.json <<'EOF'
          { "text": { "url": "http://10.1.1.1:11434/v1" }, "image": { "url": "http://10.1.1.1:8188" }, "voice": { "tts": { "mode": "server", "url": "http://10.1.1.1:8089" }, "stt": { "url": "http://10.1.1.1:8087" } }, "models": { "originUrl": "https://huggingface.co" } }
          EOF
          cat > /tmp/cfg-b/config.json <<'EOF'
          { "text": { "url": "http://10.2.2.2:11434/v1" }, "image": { "url": "http://10.2.2.2:8188" }, "voice": { "tts": { "mode": "server", "url": "http://10.2.2.2:8089" }, "stt": { "url": "http://10.2.2.2:8087" } }, "models": { "originUrl": "https://huggingface.co" } }
          EOF
          cid_a=$(docker run -d -p 15274:5274 \
            -v /tmp/cfg-a/config.json:/usr/share/nginx/html/config.json:ro "$img")
          trap 'docker rm -f "$cid_a" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:15274/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:15274/config.json | grep -q '10.1.1.1' \
            && echo "ok: config A served"
          docker rm -f "$cid_a" >/dev/null 2>&1
          cid_b=$(docker run -d -p 15274:5274 \
            -v /tmp/cfg-b/config.json:/usr/share/nginx/html/config.json:ro "$img")
          trap - EXIT
          trap 'docker rm -f "$cid_b" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:15274/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:15274/config.json | grep -q '10.2.2.2' \
            && echo "ok: config B served without rebuild"
          docker rm -f "$cid_b" >/dev/null 2>&1
          trap - EXIT

      # ── AC-9b: no mount at all — the clone-free default path ───────────
      - name: AC-9b — Default-generated config test
        env:
          IMG: ${{ needs.setup.outputs.image_prefix }}/aikami-client:latest
        run: |
          set -euo pipefail
          img="$IMG"
          cid_c=$(docker run -d -p 15274:5274 "$img")
          trap 'docker rm -f "$cid_c" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:15274/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:15274/config.json | grep -q '"url": "http://localhost:11434/v1"' \
            && echo "ok: default config self-generated with no mount, no repo checkout"

      # ── Anonymous pull verification ────────────────────────────────────
      - name: Verify anonymous pull
        env:
          PREFIX: ${{ needs.setup.outputs.image_prefix }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          for img in \
            "$PREFIX/aikami-model-fetcher:latest" \
            "$PREFIX/aikami-voice:latest" \
            "$PREFIX/aikami-sd-server:cpu" \
            "$PREFIX/aikami-client:latest"; do
            echo "anonymous pull: $img"
            docker pull "$img" >/dev/null
          done
          echo "ok: all images publicly pullable"

      # ── C-418 Feature F: one-command installer bundle ─────────────────
      - name: Build the one-command installer bundle
        run: |
          set -euo pipefail
          cd apps/backend/local-stack
          sh scripts/bundle_stack.sh
          ls -lh dist/local-stack-*.tar.gz dist/SHA256SUMS

      - name: Upload installer bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd apps/backend/local-stack
          version=$(jq -r .version package.json)
          tag="local-stack-${version}"
          gh release view "${tag}" >/dev/null 2>&1 \
            || gh release create "${tag}" --title "Aikami Local Stack ${version}" --generate-notes
          gh release upload "${tag}" "dist/local-stack-${version}.tar.gz" dist/SHA256SUMS --clobber
